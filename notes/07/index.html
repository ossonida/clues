<script>
const $=s=>document.querySelector(s);
const SAVE_KEY='hn.note07.v4';
const PLACES={seat:'서윤 자리 27번',hall:'복도',office:'총무실',lounge:'휴게실'};
const CLOCK=['','23:02','23:06','23:10','23:14','23:19','23:24'];
function fresh(){return{v:'cover',ch:1,lamp:true,lock:[0,0,0,0],cctv:30,ph:'home',pg:0,f:{},obj:[],screws:[0,0,0,0],ang:20,items:['receipt'],newItem:null,hints:{},started:false,done:false,ms:0,unread:0,note:''}}
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(SAVE_KEY)||'null')||{})}catch{S=fresh()}
const resumed=S.started&&!S.done;
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch{}};
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hintTotal=()=>Object.values(S.hints).reduce((a,b)=>a+b,0);
const anaMin=()=>Math.min(999,Math.round(S.ms/60000));
const ana=(n,p={},b=false)=>{if(window.hn)window.hn(n,p,b)};
const norm=s=>String(s).toLowerCase().replace(/[\s.,!?·~'"「」()\-]/g,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),Math.min(7000,2400+m.length*45))}
function give(k){if(!S.items.includes(k)){S.items.push(k);S.newItem=k}save()}
const tries={};
const tried=(p,ok)=>{tries[p]=(tries[p]||0)+1;ana('puzzle_tried',{puzzle:p,outcome:ok?'solved':'wrong',attempt:tries[p],minutes_used:anaMin()})};

/* ---------- 소리 (Web Audio 합성, 끌 수 있음) ---------- */
const SND={on:true,c:null,
  ac(){if(!this.c){try{this.c=new (window.AudioContext||window.webkitAudioContext)()}catch{}}return this.c},
  tone(f,e,d,g=.03,type='sine',delay=0){const c=this.ac();if(!c||!this.on)return;const t=c.currentTime+delay,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,e),t+d);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.02)},
  noise(d,f,g,q=1){const c=this.ac();if(!c||!this.on)return;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const v=c.createGain();v.gain.setValueAtTime(g,c.currentTime);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);s.connect(fl).connect(v).connect(c.destination);s.start()},
  click(){this.noise(.04,2200,.08,2)},
  tap(){this.noise(.02,3200,.05,3)},
  sw(){this.noise(.05,1400,.1,3);this.tone(900,600,.04,.015,'square')},
  clunk(){this.noise(.18,260,.12,1);this.tone(160,90,.18,.03,'triangle')},
  page(){this.noise(.16,1800,.05,.7)},
  ding(){this.tone(880,880,.12,.025);this.tone(1175,1175,.18,.022,'sine',.11)},
  wrong(){this.tone(220,140,.16,.03,'triangle')},
  ok(){this.tone(523,523,.1,.025);this.tone(784,784,.18,.022,'sine',.09)},
  hum:null,
  humOn(on){const c=this.ac();if(!c)return;if(this.hum){try{this.hum.o.stop()}catch{}this.hum=null}if(!on||!this.on)return;const o=c.createOscillator(),v=c.createGain();o.type='sine';o.frequency.value=100;v.gain.value=.006;o.connect(v).connect(c.destination);o.start();this.hum={o}}
};

const SEATS={12:[150,70],14:[250,70],22:[150,170],27:[350,170]};
function who(m){ // 22:30~23:00 (분)
  const P=[];
  if(m<45||m>=48)P.push(['12',...SEATS[12]]);else if(m===45)P.push(['mjwalk',230,130]);else if(m===46)P.push(['mjshoot',300,150]);else P.push(['mjwalk',220,120]);
  if(m<43||m>=58)P.push(['14',...SEATS[14]]);else if(m===43)P.push(['mewalk',200,200]);
  P.push(['22',...SEATS[22]]);
  if(m<44||m>=59)P.push(['yoon',...SEATS[27]]);else if(m===44)P.push(['yoonwalk',230,210]);
  return P;
}
function openCCTV(){
  showM('CCTV · 열람실',`<div class="cctv"><div class="ts" id="cts"></div>
    <svg viewBox="0 0 420 240" id="csv"></svg>

  $('#cv').oninput=e=>{S.cctv=+e.target.value;save();SND.tap();drawCCTV()};

function drawCCTV(){
  const m=S.cctv,away=m>=44&&m<59;
  const fig=([k,x,y])=>`<g data-p="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y-16}" r="10" fill="#ddd"/><rect x="${x-14}" y="${y-6}" width="28" height="26" rx="8" fill="#bbb"/>${k==='mjshoot'?`<path d="M${x+12} ${y} L${x+30} ${y-14}" stroke="#ddd" stroke-width="6"/><rect x="${x+26}" y="${y-30}" width="12" height="18" fill="#fff" stroke="#000"/>`:''}<rect x="${x-24}" y="${y-40}" width="${k==='mjshoot'?66:48}" height="66" fill="transparent"/></g>`;

  $('#modal').querySelectorAll('[data-p]').forEach(g=>g.onclick=()=>{const k=g.dataset.p,msg=$('#cmsg');

    if(k!=='mjshoot'){msg.textContent=T[k];SND.click();return}
    msg.innerHTML='화면을 키웠다. 민재가 27번 책상 앞에 서서 <b>자기 폰</b>을 들고 있다. 서윤의 폰은 책상 위 그대로. <b>손이 닿지 않는다.</b>';

}

  showM('커뮤니티 글 사진',`<div class="photo" id="pho"><div class="base">${photoSvg()}</div><div class="lens" id="lens"><div id="lin">${photoSvg()}</div></div><div class="ring" id="ring"></div></div>

  const box=$('#pho'),lens=$('#lens'),lin=$('#lin'),ring=$('#ring'),Z=3.2;
  const pos=e=>{const r=box.getBoundingClientRect();return [e.clientX-r.left-box.clientLeft,e.clientY-r.top-box.clientTop,box.clientWidth]};
  const mv=e=>{const [x,y]=pos(e),touch=e.pointerType!=='mouse',R=touch?80:72;

  box.onpointerdown=e=>{box.setPointerCapture(e.pointerId);mv(e)};

  box.onpointerup=e=>{if(!can)return;const [x,y,w]=pos(e);
    let px=x/w*400,py=y/w*400;const a=-4*Math.PI/180,dx=px-240,dy=py-150;px=240+dx*Math.cos(a)-dy*Math.sin(a);py=150+dx*Math.sin(a)+dy*Math.cos(a);

    <p>경찰차에 타기 전, 서윤이 처음으로 내 눈을 봤다. <span class="hand" style="font-size:22px">"한 번만 오르면 그만두려고 했어. 근데 만점이 나오니까… 못 멈추겠더라."</span></p>
    <p>민재는 아무 말 없이 글을 지웠다. 대신 이렇게 남겼다. 「모함이라고 한 사람들, 사과는 안 바람. 내일 시험 잘 보셈.」</p>
    <p>내일 아침이면 전국의 수험생 수십만 명이 같은 시각에 같은 시험지를 펼친다. 모르는 문제 앞에서도 끝까지 연필을 놓지 않는 사람, 틀린 답이라도 자기 손으로 고른 사람. <b>그 사람들의 1점을 지키는 게, 오늘 밤 내가 할 수 있는 전부였다.</b></p>
    <p>소등. 텅 빈 27번 칸막이에 포스트잇 한 장을 붙였다.</p>
    ${S.note?`<div class="left">${esc(S.note)}<br><small style="font-size:15px">— 14번 지수</small></div>`:`<div class="leave"><input id="noteIn" maxlength="40" placeholder="서윤에게 한 줄"><button class="btn" id="noteOk">붙이기</button></div>`}
    <div class="row"><button class="btn" id="again">처음부터 다시</button><a class="btn primary" href="../../" style="text-decoration:none">사건 대장으로</a></div>
  </article>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bindEnd(){
  const ok=$('#noteOk');if(ok)ok.onclick=()=>{const v=$('#noteIn').value.trim();if(!v)return;S.note=v;save();SND.ok();render()};
  $('#again').onclick=()=>{if(confirm('처음부터 다시 할까요? 지금 기록은 지워져요.')){ana('case_restarted');S=fresh();save();render()}};
}
function start(){
  if(!S.started){S.started=true;ana('case_started');ana('chapter_opened',{chapter:1,minutes_used:0});S.unread=1}
  S.v=S.v==='cover'?'seat':S.v;save();SND.ac();SND.humOn(true);render();
  if(S.unread)setTimeout(()=>{SND.ding();toast('📱 카톡이 왔다.')},500);
}

/* ---------- 모달 · 힌트 ---------- */
function showM(t,html){$('#modal').innerHTML=`<h2>${t}</h2>${html}<div class="actions"><button class="btn" id="mclose">닫기</button></div>`;$('#mbg').classList.add('on');$('#mclose').onclick=closeM}
function closeM(){$('#mbg').classList.remove('on');if(S.v!=='end'&&S.v!=='cover')render()}
$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mbg').classList.contains('on'))closeM()});
function openHint(){
  const c=S.ch,H=HINTS[c],got=S.hints[c]||0,lab=['어디를','어떻게','정답'];
  showM(`${CLOCK[c]} 힌트`,`<div class="posts">${H.map((h,i)=>i<got?`<div class="post"><small>${lab[i]}</small>${h}</div>`:i===got?`<button class="post closed" id="peel">포스트잇 ${i+1} 떼어 보기 (${lab[i]})</button>`:`<div class="post closed">포스트잇 ${i+1}</div>`).join('')}</div>`);
  const p=$('#peel');if(p)p.onclick=()=>{S.hints[c]=got+1;ana('hint_revealed',{chapter:c,level:got+1,minutes_used:anaMin()});save();renderHud();openHint()};
}
$('#btnHint').onclick=openHint;
$('#btnPhone').onclick=openPhone;
$('#btnSnd').onclick=()=>{SND.on=!SND.on;if(!SND.on)SND.humOn(false);else if(S.started&&!S.done)SND.humOn(true);renderHud()};

setInterval(()=>{if(S.started&&!S.done&&S.v!=='cover'&&document.visibilityState==='visible'){S.ms+=1000;$('#time').textContent=fmt(S.ms);if(S.ms%10000===0)save()}},1000);
addEventListener('pagehide',()=>{save();if(S.started&&!S.done)ana('case_left',{stage:'investigating',location:S.v,clue_count:S.ch-1,minutes_used:anaMin(),play_minutes:anaMin()},true)});

ana('case_intro_viewed');
if(resumed)ana('case_resumed',{clue_count:S.ch-1,minutes_used:anaMin()});
if(S.v!=='cover'&&S.v!=='end'&&S.started)S.v='cover';
render();
</script>
</body>
</html>
