<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히든노트 · Hidden Note</title>
<meta name="description" content="히든노트 — 브라우저에서 바로 플레이하는 추리 사건 파일 시리즈">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--panel:#1e1a17;--panel2:#272220;--line:#3a332e;--ink:#efe6d8;--dim:#a69a8a;--gold:#d8a64a;--gold2:#f0c96b;--red:#c8553d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{padding:72px 0 40px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 50% 0%,rgba(216,166,74,.12),transparent 60%)}
.eyebrow{font-size:12px;letter-spacing:4px;color:var(--gold2);font-weight:700}
h1{font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(40px,7vw,68px);margin:8px 0 6px;letter-spacing:-1px}
h1 span{color:var(--gold2)}
.lead{color:var(--dim);font-size:16px;max-width:560px}
.how{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--dim)}
main{padding:40px 0 70px}
h2{font-family:"Noto Serif KR",serif;font-size:22px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.note{position:relative;display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s}
.note:hover{transform:translateY(-3px);border-color:var(--gold)}
.cover{height:150px;background:#0d0b0a;position:relative;overflow:hidden}
.cover svg{width:100%;height:100%;display:block}
.num{position:absolute;top:12px;left:12px;background:var(--gold);color:#1b140a;font-weight:900;font-size:12px;letter-spacing:2px;padding:3px 10px;border-radius:4px}
.body{padding:14px 16px 16px}
.title{font-family:"Noto Serif KR",serif;font-weight:900;font-size:19px}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.meta span{font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 8px;color:var(--dim)}
.play{margin-top:14px;font-weight:700;color:var(--gold2);font-size:14px}
.note.soon{opacity:.55;pointer-events:none}
.note.soon .cover{display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR",serif;font-size:44px;color:#3a332e}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">HIDDEN NOTE</div>
    <h1>히든<span>노트</span></h1>
    <p class="lead">현장을 뒤지고, 잠긴 것을 풀고, 증거를 들이밀어라. 브라우저에서 바로 플레이하는 추리 사건 파일 시리즈입니다.</p>
    <div class="how"><div>1인 이상</div><div>설치 없이 브라우저로</div><div>사건마다 한 번 풀기</div></div>
  </div>
</header>
<main>
  <div class="wrap">
    <h2>사건 파일</h2>
    <div class="grid">
      <a class="note" href="notes/01/">
        <div class="cover">
          <svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice">
            <rect width="320" height="150" fill="#2a2420"/>
            <rect x="95" y="20" width="130" height="120" fill="#1a2a30" stroke="#9fb3bb" stroke-width="3"/>
            <rect x="101" y="26" width="118" height="108" fill="rgba(160,200,220,.12)"/>
            <rect x="125" y="62" width="70" height="32" fill="#3b1f4a"/>
            <text x="160" y="82" font-size="8" fill="#f0c96b" text-anchor="middle" font-family="sans-serif">DRAGON BAZAAR</text>
            <g fill="#d8a64a">
              <path d="M112 128 l3 -9 l3 0 l3 9 z"/><path d="M124 128 l3 -9 l3 0 l3 9 z"/><path d="M136 128 l3 -9 l3 0 l3 9 z"/>
              <path d="M178 128 l3 -9 l3 0 l3 9 z"/><path d="M190 128 l3 -9 l3 0 l3 9 z"/>
            </g>
            <path d="M110 40 l20 40" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
            <circle cx="60" cy="75" r="40" fill="none" stroke="#c8553d" stroke-width="2" stroke-dasharray="4 5" opacity=".5"/>
          </svg>
          <div class="num">NOTE 01</div>
        </div>
        <div class="body">
          <div class="title">퍼니보드 사건 파일</div>
          <div class="sub">보드게임 카페의 마지막 손님</div>
          <div class="meta"><span>1인~</span><span>60~90분</span><span>용의자 4명</span><span>바꿔치기 사건</span></div>
          <div class="play">사건 파일 열기 →</div>
        </div>
      </a>
      <div class="note soon">
        <div class="cover">?</div>
        <div class="body">
          <div class="title">NOTE 02</div>
          <div class="sub">준비 중</div>
        </div>
      </div>
    </div>
  </div>
</main>
<footer><div class="wrap">© 히든노트 · Hidden Note</div></footer>
</body>
</html>
