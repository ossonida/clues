<!DOCTYPE html>
<html lang="ko" data-note="note02">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note 02 · 문예부 교환일기 | 히든노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#34302b;--pad:#fbf2a6;--pline:#a9c3e0;--margin:rgba(214,69,65,.55);--lh:32px;--ml:56px;--binding:#7a1e1b;
  --sheet:#fffdf4;--ink:#1f1c18;--dim:#6b6358;--rule:#cfc5b0;--stamp:#a3312a;
  --blue:#27479a;--pencil:#4a4a4f;--red:#c23a2e;--green:#2b7a52;
  --nl:34px;--nm:64px;--hs:clamp(20px,5.4vw,27px);
  --mono:"Nanum Gothic Coding",monospace;--serif:"Nanum Myeongjo",serif;--hand:"Nanum Pen Script",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:"Nanum Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
@media(max-width:640px){:root{--ml:26px;--nm:40px}}
button{font-family:inherit;cursor:pointer;color:inherit}

/* 리갈패드 바탕 (Note 01과 같은 틀) */
.app{max-width:900px;min-height:100vh;margin:0 auto;padding:0 22px 56px calc(var(--ml) + 22px);background-color:var(--pad);
  background-image:linear-gradient(90deg,transparent calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 4px),transparent calc(var(--ml) - 4px),transparent var(--ml),var(--margin) var(--ml),var(--margin) calc(var(--ml) + 1px),transparent calc(var(--ml) + 1px)),
    repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--pline) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0,0 6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.app::before{content:"";display:block;height:34px;margin:0 -22px 22px calc(-1 * (var(--ml) + 22px));background:linear-gradient(#8a2420,var(--binding) 70%,#5a1412);box-shadow:0 3px 0 rgba(0,0,0,.12)}
@media(max-width:640px){.app{padding:0 12px 40px calc(var(--ml) + 12px)}.app::before{margin:0 -12px 18px calc(-1 * (var(--ml) + 12px))}}

header.hud{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--hand);font-size:40px;letter-spacing:-.5px;line-height:1.05}
.brand .t{background:linear-gradient(transparent 60%,rgba(214,69,65,.28) 60% 88%,transparent 88%)}
.brand .back{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px}
.brand .back:hover{color:var(--ink)}
.brand small{display:block;font-family:var(--serif);font-size:14px;color:var(--dim);margin-top:4px}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;line-height:1.3;padding:0 4px}
.stat b{color:var(--ink);font-size:20px;border-bottom:1px solid var(--ink);min-width:62px}
.btn{white-space:nowrap;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:7px 13px;font-size:14px;font-weight:700}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.primary:hover{background:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}

/* 페이지 플래그 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding-left:14px;position:relative;z-index:1;margin-bottom:-4px}
.tab{border:none;color:#3a3326;padding:7px 14px 9px;font-size:13px;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.12);opacity:.85;background:#ffe36e}
.tab:nth-child(2){background:#bfe1f6}.tab:nth-child(3){background:#e4e4e4}.tab:nth-child(4){background:#f9c6cf}.tab:nth-child(5){background:#c9ecc0}
.tab:hover{opacity:1}
.tab.on{opacity:1;padding-top:12px;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.tab:disabled{background:#e4dcc4;color:#9a8f76;font-weight:400;cursor:not-allowed;opacity:.8}

/* 교환일기 한 장 */
.sheet{position:relative;max-width:640px;background-color:var(--sheet);padding:var(--nl) 26px calc(var(--nl) * 1.5) calc(var(--nm) + 14px);
  background-image:linear-gradient(90deg,transparent calc(var(--nm) - 1px),rgba(214,69,65,.6) calc(var(--nm) - 1px),rgba(214,69,65,.6) var(--nm),transparent var(--nm)),
    repeating-linear-gradient(transparent 0 calc(var(--nl) - 1px),#c9d6ea calc(var(--nl) - 1px) var(--nl));
  box-shadow:0 1px 1px rgba(0,0,0,.12),0 16px 30px -14px rgba(40,30,0,.55);overflow:hidden}
@media(max-width:640px){.sheet{padding-right:12px;padding-left:calc(var(--nm) + 8px)}}
.sheet.turn{animation:turn .45s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(26px) rotate(.8deg)}to{opacity:1;transform:none}}
.ln{height:var(--nl);line-height:calc(var(--nl) - 4px);font-family:var(--hand);font-size:var(--hs);white-space:nowrap;position:relative;margin:0}
.ln.head{display:flex;justify-content:space-between;font-size:calc(var(--hs) * .82)}
.blue{color:var(--blue)}.pencil{color:var(--pencil)}.red{color:var(--red)}
.ln .no{position:absolute;left:calc(-1 * var(--nm) - 2px);width:calc(var(--nm) - 20px);text-align:right;font-family:var(--hand);font-size:calc(var(--hs) * .78);color:var(--red)}
/* 빨간 펜 교정: 틀린 글자에 줄 긋고 위에 고친 글자 */
.fix{position:relative;display:inline-block}
.fix s{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.fix i{position:absolute;left:.05em;top:-.62em;font-style:normal;color:var(--red);font-size:.86em;transform:rotate(-8deg)}
.doodle{position:absolute;pointer-events:none}

/* 연필 문지르기 */
.rub{position:relative;height:calc(var(--nl) * 5);margin-left:calc(-1 * var(--nm) + 8px)}
.rub canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* 접힌 모서리 */
.corner{position:absolute;right:0;bottom:0;width:74px;height:74px;border:none;padding:0;background:linear-gradient(135deg,transparent 50%,#e8e0c8 50%,#d9cfb2 100%);
  box-shadow:-3px -3px 6px -3px rgba(0,0,0,.25);clip-path:polygon(100% 0,100% 100%,0 100%);transition:transform .2s}
.corner:hover{transform:scale(1.06);transform-origin:100% 100%}
.flap{position:absolute;right:10px;bottom:12px;background:#fff8e6;border:1px dashed #d9b9a8;padding:6px 12px 8px;font-family:var(--hand);color:var(--red);transform:rotate(-3deg);box-shadow:0 4px 10px -6px rgba(0,0,0,.4);animation:turn .35s ease-out;text-align:right}
.flap b{display:block;font-weight:400;font-size:calc(var(--hs) * 1.05);line-height:1.15}
.flap span{font-size:calc(var(--hs) * .72)}

/* 오늘의 암호 */
.pw{max-width:640px;margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pw label{font-family:var(--hand);font-size:26px;color:var(--ink)}
.pw input{font-family:var(--hand);font-size:26px;color:var(--blue);background:transparent;border:none;border-bottom:2px solid var(--ink);padding:0 6px;width:200px;outline:none}
.pw input:focus{border-color:var(--blue)}
.pw .msg{flex-basis:100%;font-family:var(--hand);font-size:22px;line-height:1.2;min-height:26px;color:var(--stamp)}
.pw .msg.near{color:var(--blue)}
.pw .done{font-family:var(--hand);font-size:28px;color:var(--blue)}
.pw .done::after{content:" ✓";color:var(--green,#3d6b3a)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* 번호자물쇠 */
.lock{max-width:640px;margin-top:26px;background:#2f3438;color:#e9e4d8;padding:16px 18px 18px;border-radius:6px;box-shadow:0 14px 24px -14px rgba(0,0,0,.7);display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.lock h3{margin:0;flex-basis:100%;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:#b9b2a2;font-weight:400}
.dials{display:flex;gap:8px}
.dial{display:flex;flex-direction:column;align-items:center;background:#1d2124;border-radius:4px;width:46px}
.dial button{background:none;border:none;color:#9aa3a8;width:100%;padding:2px 0;font-size:12px}
.dial button:hover{color:#fff}
.dial b{font-family:var(--mono);font-size:26px;line-height:1.3;color:#f3eee2;background:linear-gradient(#cfc7b4,#f7f2e6 45%,#cfc7b4);color:#1d2124;width:100%;text-align:center}
.lock .pull{background:#c9a04a;color:#1d2124;border:none;font-weight:800;padding:10px 18px;border-radius:3px}
.lock .pull:hover{background:#e0b85a}
.lock .msg{flex-basis:100%;font-family:var(--hand);font-size:21px;color:#f1c7a8;min-height:24px;line-height:1.2}

/* 표지 */
.cover{max-width:640px;background:#2f4a3c;color:#efe7cf;padding:34px 30px 30px;position:relative;box-shadow:0 18px 32px -14px rgba(0,0,0,.6);border-left:14px solid #233a2e}
.cover .label{background:#fffdf4;color:var(--ink);padding:14px 18px 12px;max-width:340px;transform:rotate(-1.5deg);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.cover .label h2{margin:0;font-family:var(--hand);font-weight:400;font-size:44px;line-height:1}
.cover .label div{font-family:var(--hand);font-size:22px;color:var(--blue);margin-top:6px;line-height:1.2}
.cover .story{font-family:var(--serif);font-size:15px;line-height:1.85;margin:26px 0 0;max-width:520px}
.cover .rules{background:#fff8c9;color:var(--ink);font-family:var(--hand);font-size:23px;line-height:1.3;padding:12px 16px;margin-top:22px;max-width:440px;transform:rotate(1.2deg);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.cover .rules b{font-weight:400;color:var(--stamp)}
.cover .how{font-size:13.5px;line-height:1.7;margin-top:22px;color:#cfd8c6}
.cover .how li{margin:2px 0}
.cover .go{margin-top:20px;background:#efe7cf;color:#233a2e;border:none;font-weight:800;padding:10px 20px;font-size:15px}
.cover .go:hover{background:#fff}
.proto{font-family:var(--mono);font-size:11.5px;color:#a9b8a4;margin-top:16px}

/* 결과 */
.result{text-align:left}
.result .big{font-family:var(--hand);font-size:44px;line-height:1.1;margin:0 0 10px}
.result .seal{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:3px;padding:4px 14px;transform:rotate(-7deg);margin:6px 0 16px;mix-blend-mode:multiply}
.result dl{font-family:var(--mono);font-size:14px;margin:0;max-width:340px}
.result dl div{display:flex;border-bottom:1px dotted #cfc6b0;padding:5px 0}
.result dt{width:110px;color:var(--dim)}.result dd{margin:0}
.result p{font-family:var(--serif);font-size:14.5px;line-height:1.8;max-width:520px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.nav{max-width:640px;display:flex;justify-content:space-between;margin-top:18px;font-family:var(--mono);font-size:13px}
.nav button{background:none;border:none;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.nav button:hover{color:var(--ink);border-color:var(--ink)}

.green{color:var(--green)}
.tiny{font-size:.62em;display:inline-block;transform:rotate(-6deg);margin-left:.3em}
.ln.right{text-align:right}

/* 4장: 글자판 + 구멍 뚫린 책갈피 */
.gwrap{width:100%}
.grille{position:relative;width:calc(var(--c) * 7);height:calc(var(--c) * 11);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(7,var(--c));grid-auto-rows:var(--c);background:#fffdf4;outline:1.5px solid #9fb3cf;font-family:var(--hand);font-size:calc(var(--c) * .62);color:var(--blue);user-select:none}
.grid span{display:flex;align-items:center;justify-content:center;border-right:1px dotted #c9d6ea;border-bottom:1px dotted #c9d6ea}
.grid span.star{color:var(--green);font-size:calc(var(--c) * .55)}
.bm{position:absolute;width:calc(var(--c) * 4);height:calc(var(--c) * 4);display:grid;grid-template-columns:repeat(4,1fr);touch-action:none;cursor:grab;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));transition:left .12s,top .12s;z-index:2;user-select:none}
.bm.drag{transition:none;cursor:grabbing}
.bm i{background:#e6d2a5;position:relative}
.bm i.h{background:transparent;box-shadow:inset 0 0 0 2px rgba(122,90,40,.7)}
.bm i.s::before{content:"★";position:absolute;left:2px;top:-1px;font-size:11px;font-style:normal;color:#7a5a28}
.bm .lbl{position:absolute;right:6px;bottom:3px;font-family:var(--hand);font-size:17px;color:#7a5a28;pointer-events:none}

/* 5장: 불빛에 비추기 */
.sheet.lit{background-color:#fffef9;box-shadow:0 0 0 1px rgba(255,240,180,.6),0 0 60px 10px rgba(255,236,160,.55),0 16px 30px -14px rgba(40,30,0,.55)}
.back{position:absolute;left:calc(var(--nm) + 14px);right:26px;font-family:var(--hand);font-size:calc(var(--hs) * 1.15);line-height:var(--nl);color:rgba(60,60,70,.5);transform:scaleX(-1);opacity:0;transition:opacity .6s;pointer-events:none;user-select:none;filter:blur(.3px)}
.sheet.lit .back{opacity:1}
.lamp{margin-top:14px;font-family:var(--hand);font-size:22px;background:#fff3b0;border:none;padding:4px 14px;box-shadow:0 2px 4px rgba(0,0,0,.18);transform:rotate(-1deg)}
.lamp:hover{background:#ffe680}

/* 6장: 찢긴 조각 */
.tear{position:relative;height:calc(var(--nl) * 6)}
.tbox{position:absolute;left:0;right:0;top:0;height:calc(var(--nl) * 2)}
.tear .tt{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:calc(var(--hs) * 1.35);color:var(--red);white-space:nowrap;user-select:none;padding-top:.2em}
.gap{background:#cbbd7a;box-shadow:inset 0 0 12px rgba(0,0,0,.35)}
.scrapw{position:absolute;left:0;right:0;top:0;height:calc(var(--nl) * 2);filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));transition:transform .25s;pointer-events:none;z-index:2}
.scrapw.drag{transition:none}
.scrap{position:absolute;inset:0;background:var(--sheet);touch-action:none;cursor:grab;pointer-events:auto}
.scrapw.fixed{filter:none}
.scrapw.fixed .scrap{cursor:default}

/* 마지막 장: 끼워 넣은 초록 글씨 */
.ins{position:relative;display:inline-block;width:.55em;height:1em}
.ins::after{content:"∨";position:absolute;left:.05em;top:.3em;font-family:sans-serif;font-size:.55em;color:var(--green)}
.ins i{position:absolute;left:50%;bottom:.7em;transform:translateX(-50%) rotate(-5deg);font-style:normal;font-size:.82em;color:var(--green);white-space:nowrap}

/* 결과: 다음 사람에게 */
.letter{background:#f2f8ef;border-left:3px solid var(--green);padding:10px 14px;font-family:var(--hand);font-size:23px;line-height:1.35;color:var(--green);max-width:520px;margin:14px 0}
.nextf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.nextf input{font-family:var(--hand);font-size:24px;background:transparent;border:none;border-bottom:2px solid var(--ink);padding:0 4px;flex:1;min-width:200px;outline:none}
.nextline{font-family:var(--hand);font-size:26px;color:var(--ink)}
.small{font-size:12.5px;color:var(--dim);font-family:var(--mono)}

/* 힌트 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(30,25,18,.66);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--pad);max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px 20px;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.modal h2{font-family:var(--serif);font-weight:800;margin:0 0 4px;font-size:20px}
.modal .sub{font-size:13px;color:var(--dim);margin-bottom:14px}
.posts{display:flex;flex-direction:column;gap:12px}
.post{background:#fff3a0;padding:10px 14px;font-family:var(--hand);font-size:22px;line-height:1.3;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.post:nth-child(2){background:#ffd6e0;transform:rotate(.6deg)}.post:nth-child(3){background:#cfeaff;transform:rotate(-.6deg)}
.post small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim)}
.post.closed{background:#efe9d2;color:var(--dim);font-family:inherit;font-size:14px}
.modal .actions{display:flex;justify-content:flex-end;margin-top:16px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sheet);padding:10px 18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">
      <a class="back" href="../../">← 사건 대장 / NOTE 02</a>
      <span class="t">문예부 교환일기</span>
      <small>노트 방탈출</small>
    </div>
    <div class="spacer"></div>
    <div class="stat"><span>걸린 시간</span><b id="time">0:00</b></div>
    <div class="stat"><span>힌트</span><b id="hintCount">0</b></div>
    <button class="btn" id="btnHint">힌트</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="page"></main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const SAVE_KEY='hn.note02.v1';
const END=8;   // 결과 페이지 번호

// ── 퍼즐 데이터 ──────────────────────────────
// ans: 정답, alt: 같이 인정할 답, near: "거의 맞았다"로 받아 줄 답
const PAGES=[
  {tab:'표지'},
  {tab:'1장', ans:'다음은너야', near:['다음은','다음','다음은너','너야','은너야'],
   hints:['여백에 그려진 화살표 낙서, 어디서 어디로 향하고 있나요?','각 줄의 맨 첫 글자만 위에서 아래로 읽어 보세요.','정답: 다음은너야']},
  {tab:'2장', ans:'할게', near:['할께','역할','쓸게','역할쓸게','빨간펜','고친글자'],
   hints:['하람이는 연필을 꾹꾹 눌러 쓴대요. 앞 장을 뜯어 갔다면 자국이 남았겠죠.','빈 줄 위를 마우스나 손가락으로 문질러 보세요. 드러난 말은 1장 이야기예요.',"1장에서 빨간 펜이 고친 글자는 '할'과 '게'. 정답: 할게"]},
  {tab:'3장', ans:'9173', alt:['구일칠삼'], near:['구일','칠삼','일칠삼'],
   hints:['오른쪽 아래 모서리가 접혀 있어요.',"'4-1'은 4번째 줄의 1번째 글자예요. 띄어쓰기는 세지 않아요. 찾은 글자를 숫자로 읽어 보세요.",'구·일·칠·삼 → 정답: 9173 (부실 문 번호래요. 기억해 두세요)']},
  {tab:'4장', ans:'거울을봐', alt:['거울봐'], near:['거울','거울을','울을봐','을봐'],

  $('#page').innerHTML=VIEWS[p]();
  if(!anim)$('#page').querySelectorAll('.turn').forEach(e=>e.classList.remove('turn'));
  $('#page').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  if(p===0)$('#start').onclick=()=>{S.started=true;S.open=Math.max(S.open,1);go(1)};
  const f=$('#pw');if(f)f.onsubmit=e=>{e.preventDefault();check(p)};
  if(p===2)initRub();
  if(p===3){const c=$('#corner');if(c)c.onclick=()=>{S.unfolded=true;save();render(false)}}
  if(p===4)bindGrille();
  if(p===5)$('#lamp').onclick=()=>{S.light=!S.light;save();$('#sheet5').classList.toggle('lit',S.light);$('#lamp').textContent=S.light?'불빛 치우기':'💡 창가 불빛에 비춰 보기'};
  if(p===6)bindTorn();
  if(p===7)bindLock();
  if(p===END){
    $('#again').onclick=()=>{if(confirm('처음부터 다시 할까요? 지금 기록은 지워져요.')){S=fresh();strokes=[];save();render(true)}};
    const nf=$('#nextf');if(nf)nf.onsubmit=e=>{e.preventDefault();const v=$('#nextIn').value.trim();if(!v)return;S.next=v;save();render(false)};
  }
}

function check(p){
  const inp=$('#ans'),v=norm(inp.value),pg=PAGES[p],msg=$('#msg');
  if(!v)return;
  if(v===norm(pg.ans)||(pg.alt||[]).some(a=>norm(a)===v)){
    S.solved[p]=pg.ans;S.open=Math.max(S.open,p+1);save();
    toast('다음 장이 떨어졌다.');render(false);return;
  }
  S.wrong[p]=(S.wrong[p]||0)+1;save();
  const a=norm(pg.ans);
  const near=pg.near.includes(v)||(a.length>=4&&lev(v,a)<=1)||(/^\d{4}$/.test(a)&&/^\d{4}$/.test(v)&&sameDigits(a,v));
  msg.className='msg'+(near?' near':'');
  msg.textContent=(p===6&&WRONG_COLOR[v])||(near?'거의 맞았다. 조금만 더…':['아닌 것 같다.','다음 장이 꿈쩍도 안 한다.','다시 읽어 보자.'][S.wrong[p]%3]);
  $('#pw').classList.remove('shake');void $('#pw').offsetWidth;$('#pw').classList.add('shake');
  inp.select();
}

// ── 마지막 장: 자물쇠 ──────────────────────────────
function bindLock(){
  $('#lock').querySelectorAll('.dial button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.lock[i]=(S.lock[i]+(+b.dataset.d)+10)%10;b.parentNode.querySelector('b').textContent=S.lock[i];save()});
  $('#pull').onclick=()=>{
    const code=S.lock.join(''),m=$('#lockMsg'),ans=PAGES[7].code;
    if(code===ans){S.done=true;S.p=END;save();toast('철컥!');render(true);return}
    S.wrong[7]=(S.wrong[7]||0)+1;save();
    m.textContent=code==='9173'?'작년 번호로는 안 열린다. 정말 바뀌었나 보다.':sameDigits(code,ans)?'숫자는 맞는 것 같은데… 순서가 아닌가?':'꿈쩍도 안 한다.';
    $('#lock').classList.remove('shake');void $('#lock').offsetWidth;$('#lock').classList.add('shake');
  };
}

// ── 4장: 책갈피 끌기 ──────────────────────────────
function bindGrille(){
  const g=$('#grille'),bm=$('#bm');if(!g)return;
  const c=clamp(Math.floor(g.parentNode.clientWidth/7),32,50);
  g.style.setProperty('--c',c+'px');
  const place=()=>{bm.style.left=S.card.x*c+'px';bm.style.top=S.card.y*c+'px'};place();
  let st=null;
  bm.onpointerdown=e=>{bm.setPointerCapture(e.pointerId);st={px:e.clientX,py:e.clientY,x:S.card.x*c,y:S.card.y*c};bm.classList.add('drag')};
  bm.onpointermove=e=>{if(!st)return;st.cx=clamp(st.x+e.clientX-st.px,0,3*c);st.cy=clamp(st.y+e.clientY-st.py,0,7*c);bm.style.left=st.cx+'px';bm.style.top=st.cy+'px'};
  bm.onpointerup=bm.onpointercancel=()=>{if(!st)return;bm.classList.remove('drag');if(st.cx!==undefined){S.card={x:Math.round(st.cx/c),y:Math.round(st.cy/c)};save()}st=null;place()};
}

// ── 6장: 찢긴 조각 맞추기 ──────────────────────────────
// 누르면 180° 돌고, 끌면 움직인다. 바로 선 채로 찢긴 자리 가까이 놓으면 딱 붙는다.
function bindTorn(){
  const t=$('#tear'),w=$('#scrapw'),s=$('#scrap');if(!t)return;
  const W=t.clientWidth,H=t.querySelector('.tbox').clientHeight;
  const place=()=>{w.style.transform=`translate(${S.torn.x*W}px,${S.torn.y*H}px) rotate(${S.torn.r}deg)`};place();
  if(S.torn.done)return;
  let st=null;
  s.onpointerdown=e=>{s.setPointerCapture(e.pointerId);st={px:e.clientX,py:e.clientY,x:S.torn.x,y:S.torn.y,moved:0};w.classList.add('drag')};
  s.onpointermove=e=>{if(!st)return;const dx=e.clientX-st.px,dy=e.clientY-st.py;st.moved=Math.max(st.moved,Math.hypot(dx,dy));
    if(st.moved<6)return;S.torn.x=clamp(st.x+dx/W,-.3,.3);S.torn.y=clamp(st.y+dy/H,-.3,2);place()};
  s.onpointerup=s.onpointercancel=()=>{if(!st)return;w.classList.remove('drag');
    if(st.moved<6)S.torn.r=(S.torn.r+180)%360;
    if(S.torn.r===0&&Math.abs(S.torn.x*W)<18&&Math.abs(S.torn.y*H)<18){S.torn={...S.torn,x:0,y:0,done:true};w.classList.add('fixed');s.onpointerdown=null;toast('찢긴 자리에 딱 맞는다.')}
    st=null;save();place()};
}

// ── 2장: 연필 문지르기 ──────────────────────────────
// 문지른 자리에 흑연을 칠하고, 눌린 글씨 모양만큼은 다시 지워 종이색이 드러나게 한다.
const RUB_TEXT=['빨간 펜이 고친','글자만 읽어'];
let strokes=[];   // 문지른 경로 (가로·세로 0~1 비율), 창 크기가 바뀌면 다시 그린다
async function initRub(){
  const wrap=$('#rub'),cv=$('#rubCv');if(!wrap)return;
  try{await document.fonts.load('40px "Nanum Pen Script"')}catch{}
  if(!document.body.contains(cv))return;
  const dpr=Math.min(devicePixelRatio||1,2),W=wrap.clientWidth,H=wrap.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  // 눌린 글씨 마스크
  const mask=document.createElement('canvas');mask.width=cv.width;mask.height=cv.height;
  const mc=mask.getContext('2d');mc.scale(dpr,dpr);
  const fs=Math.min(58,W/6.2);
  mc.font=`${fs}px "Nanum Pen Script"`;mc.textAlign='center';mc.textBaseline='middle';mc.lineWidth=2.6;mc.lineJoin='round';
  mc.save();mc.translate(W/2,H/2);mc.rotate(-.04);
  RUB_TEXT.forEach((t,i)=>{const y=(i-(RUB_TEXT.length-1)/2)*fs*1.15;mc.fillText(t,0,y);mc.strokeText(t,0,y)});
  mc.restore();
  // 흑연 질감
  const grain=document.createElement('canvas');grain.width=grain.height=48;
  const gc=grain.getContext('2d');
  gc.fillStyle='rgba(60,60,68,.45)';gc.fillRect(0,0,48,48);
  for(let i=0;i<1600;i++){gc.fillStyle=`rgba(30,30,36,${.3+Math.random()*.6})`;gc.fillRect(Math.random()*48,Math.random()*48,1+Math.random()*1.5,1)}
  const pat=ctx.createPattern(grain,'repeat');
  // 글씨가 있는 칸 (12px 격자) — 얼마나 문질렀는지 셀 때 쓴다
  const CELL=12,cols=Math.ceil(W/CELL),rows=Math.ceil(H/CELL),md=mc.getImageData(0,0,mask.width,mask.height).data;
  const textCells=new Set(),covered=new Set();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let hit=false;for(let y=0;y<CELL&&!hit;y+=3)for(let x=0;x<CELL&&!hit;x+=3){const px=Math.floor((c*CELL+x)*dpr),py=Math.floor((r*CELL+y)*dpr);if(px<mask.width&&py<mask.height&&md[(py*mask.width+px)*4+3]>40)hit=true}
    if(hit)textCells.add(r*cols+c)}
  const R=15;
  function dab(x0,y0,x1,y1){
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.42;ctx.strokeStyle=pat;ctx.lineWidth=R*2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
    const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/6));
    for(let k=0;k<=n;k++){const x=x0+(x1-x0)*k/n,y=y0+(y1-y0)*k/n;
      for(let r=Math.floor((y-R)/CELL);r<=Math.floor((y+R)/CELL);r++)for(let c=Math.floor((x-R)/CELL);c<=Math.floor((x+R)/CELL);c++)if(r>=0&&c>=0&&r<rows&&c<cols)covered.add(r*cols+c)}
  }
  function punch(){ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(mask,0,0);ctx.setTransform(dpr,0,0,dpr,0,0)}
  function progress(){
    if(S.rubbed||!textCells.size)return;
    let n=0;textCells.forEach(k=>{if(covered.has(k))n++});
    if(n/textCells.size>.6){S.rubbed=true;save();toast('눌린 자국이 드러났다.')}
  }
  // 이미 드러냈으면 글씨 둘레를 칠해 둔다
  if(S.rubbed){for(let y=H*.18;y<H*.86;y+=R*1.1)dab(W*.08,y,W*.92,y+4)}
  strokes.forEach(s=>{for(let i=1;i<s.length;i++)dab(s[i-1][0]*W,s[i-1][1]*H,s[i][0]*W,s[i][1]*H)});
  punch();
  let last=null,cur=null;
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);last=pos(e);cur=[[last[0]/W,last[1]/H]];strokes.push(cur);dab(...last,...last);punch()};
  cv.onpointermove=e=>{if(!last)return;const p=pos(e);dab(...last,...p);punch();cur.push([p[0]/W,p[1]/H]);last=p};
  cv.onpointerup=cv.onpointercancel=()=>{last=null;progress()};
}
let lastW=innerWidth;
addEventListener('resize',()=>{if(innerWidth===lastW)return;lastW=innerWidth;if(S.p===2)initRub();if(S.p===4)bindGrille();if(S.p===6)bindTorn()});

// ── 힌트 ──────────────────────────────
function openHint(){
  const p=S.p,pg=PAGES[p];if(!pg.hints)return;
  const got=S.hints[p]||0;
  $('#modal').innerHTML=`<h2>${pg.tab} 힌트</h2><div class="sub">포스트잇을 한 장씩 떼어 볼 수 있어요. 세 번째 장엔 정답이 적혀 있어요.</div>
    <div class="posts">${pg.hints.map((h,i)=>i<got?`<div class="post"><small>포스트잇 ${i+1}</small>${h}</div>`
      :i===got?`<button class="post closed" id="peel">포스트잇 ${i+1} 떼어 보기${i===2?' (정답)':''}</button>`
      :`<div class="post closed">포스트잇 ${i+1}</div>`).join('')}</div>
    <div class="actions"><button class="btn" id="mclose">닫기</button></div>`;
  $('#mbg').classList.add('on');
  $('#mclose').onclick=closeM;
  const pe=$('#peel');if(pe)pe.onclick=()=>{S.hints[p]=got+1;save();renderStats();openHint()};
}
function closeM(){$('#mbg').classList.remove('on')}
$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#btnHint').onclick=openHint;

if(!canOpen(S.p))S.p=0;
render(true);
</script>
