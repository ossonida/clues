<!DOCTYPE html>
<html lang="ko" data-note="note04">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note 04 · 깡총이 연습장 | 히든노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#24262b;--pad:#fbf2a6;--pline:#a9c3e0;--margin:rgba(214,69,65,.55);--lh:32px;--ml:56px;--binding:#2f5a45;
  --ink:#1f1c18;--dim:#6b6358;--stamp:#a3312a;--pencil:#4a4a4a;--blue:#2a4fb0;--grid:rgba(96,160,110,.22);--paper:#fbfdf5;
  --hs:clamp(19px,5vw,24px);
  --mono:"Nanum Gothic Coding",monospace;--serif:"Nanum Myeongjo",serif;--hand:"Nanum Pen Script",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:"Nanum Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
@media(max-width:640px){:root{--ml:26px}}
button{font-family:inherit;cursor:pointer;color:inherit}

/* 리갈패드 바탕 (시리즈 공통 틀, 이번엔 초록 제본) */
.app{max-width:900px;min-height:100vh;margin:0 auto;padding:0 22px 56px calc(var(--ml) + 22px);background-color:var(--pad);
  background-image:linear-gradient(90deg,transparent calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 4px),transparent calc(var(--ml) - 4px),transparent var(--ml),var(--margin) var(--ml),var(--margin) calc(var(--ml) + 1px),transparent calc(var(--ml) + 1px)),
    repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--pline) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0,0 6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.app::before{content:"";display:block;height:34px;margin:0 -22px 22px calc(-1 * (var(--ml) + 22px));background:linear-gradient(#3f7259,var(--binding) 70%,#1f3d2f);box-shadow:0 3px 0 rgba(0,0,0,.12)}
@media(max-width:640px){.app{padding:0 12px 40px calc(var(--ml) + 12px)}.app::before{margin:0 -12px 18px calc(-1 * (var(--ml) + 12px))}}
body.hasbag .app{padding-bottom:120px}

header.hud{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--hand);font-size:40px;letter-spacing:-.5px;line-height:1.05}
.brand .t{background:linear-gradient(transparent 60%,rgba(47,90,69,.25) 60% 88%,transparent 88%)}
.brand .back{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px}
.brand .back:hover{color:var(--ink)}
.brand small{display:block;font-family:var(--serif);font-size:14px;color:var(--dim);margin-top:4px}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;line-height:1.3;padding:0 4px}
.stat b{color:var(--ink);font-size:20px;border-bottom:1px solid var(--ink);min-width:62px}
.btn{white-space:nowrap;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:7px 13px;font-size:14px;font-weight:700}
.btn:hover{background:var(--ink);color:#fffdf4}
.btn.primary{background:var(--ink);color:#fffdf4}
.btn.primary:hover{background:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}

/* 탭 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding-left:14px;position:relative;z-index:1;margin-bottom:-4px}
.tab{border:none;color:#2f4638;padding:7px 14px 9px;font-size:13px;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.12);opacity:.85;background:#d5e6cf}
.tab:hover{opacity:1}
.tab.on{opacity:1;padding-top:12px;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.tab:disabled{background:#e4e6d8;color:#98a08f;font-weight:400;cursor:not-allowed;opacity:.8}
.tab .ok{color:#2b7a52;margin-left:3px}

/* 모눈 연습장 한 장 */
.sheet{position:relative;max-width:680px;background-color:var(--paper);padding:16px 18px 12px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px;
  box-shadow:0 1px 1px rgba(0,0,0,.12),0 16px 30px -14px rgba(20,40,20,.55)}
.sheet.turn{animation:turn .45s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(26px) rotate(.8deg)}to{opacity:1;transform:none}}
.sheet .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-family:var(--serif);font-size:12.5px;color:#4f7a5a;border-bottom:2px solid #6aa07a;padding-bottom:4px;margin-bottom:8px}
.sheet .head b{font-family:var(--hand);font-weight:400;font-size:calc(var(--hs) * 1.02);color:var(--pencil);margin-left:4px}
.say{font-family:var(--hand);font-size:var(--hs);line-height:1.3;color:var(--pencil);margin:0 0 2px}
.say.blue{color:var(--blue)}
.math{font-family:var(--hand);font-size:calc(var(--hs) * .95);color:#7a7a7a;display:flex;gap:4px 20px;flex-wrap:wrap;margin:0 0 6px}
.math i{font-style:normal;color:var(--stamp)}

/* 낙서 장면 */
.scene{display:block;width:100%;height:auto;margin-top:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.scene.holding{touch-action:none;cursor:crosshair}
.scene [data-id]{cursor:pointer}
.scene text{font-family:"Nanum Pen Script",cursive}
.pc{color:var(--pencil);stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bp{color:var(--blue);stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tiny{stroke-width:3.4;opacity:.75}
.thin{stroke-width:.9}
.wig{animation:wig .4s;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
#kc.hop{animation:hop 1.6s ease-in-out forwards}
#kc.gone{transform:translate(var(--dx),0)}
@keyframes hop{
  0%{transform:translate(0,0)}12%{transform:translate(calc(var(--dx) * .12),-26px)}25%{transform:translate(calc(var(--dx) * .25),0)}
  37%{transform:translate(calc(var(--dx) * .37),-26px)}50%{transform:translate(calc(var(--dx) * .5),0)}62%{transform:translate(calc(var(--dx) * .62),-26px)}
  75%{transform:translate(calc(var(--dx) * .75),0)}87%{transform:translate(calc(var(--dx) * .87),-26px)}100%{transform:translate(var(--dx),0)}}
#scrib.fade{transition:opacity .9s;opacity:0}

/* 필통 */
.bag{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.bag .in{pointer-events:auto;display:flex;align-items:center;gap:6px;background:#2f5a45;padding:9px 14px 11px;border-radius:14px 14px 0 0;
  box-shadow:0 -6px 18px rgba(0,0,0,.35);border:2px dashed rgba(232,240,220,.4);border-bottom:none}
.bag .lbl{font-family:var(--hand);font-size:22px;color:#e8f0dc;margin-right:4px}
.slot{width:44px;height:44px;border-radius:6px;border:1.5px dashed rgba(232,240,220,.35);background:transparent;padding:3px;transition:transform .15s}
.slot:disabled{cursor:default}
.slot.has{background:var(--paper);border:1.5px solid var(--paper)}
.slot.on{background:#ffe680;border-color:#c9a04a;transform:translateY(-7px) rotate(-4deg)}
.slot svg{width:100%;height:100%;display:block}
.slot.new{animation:pop .5s 4}
.slot.no{animation:wig .4s}
@keyframes pop{50%{transform:scale(1.2) rotate(-4deg)}}
@media(max-width:420px){.bag .lbl{display:none}.slot{width:38px;height:38px;padding:2px}.bag .in{gap:4px;padding:7px 8px 9px}}

/* 답 쓰는 칸 */
.pw{max-width:680px;margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pw label{font-family:var(--hand);font-size:26px;color:var(--ink)}
.pw input{font-family:var(--hand);font-size:26px;color:var(--pencil);background:transparent;border:none;border-bottom:2px solid var(--ink);padding:0 6px;width:200px;outline:none}
.pw input:focus{border-color:var(--blue)}
.pw .msg{flex-basis:100%;font-family:var(--hand);font-size:22px;line-height:1.2;min-height:26px;color:var(--stamp)}
.pw .msg.near{color:var(--blue)}
.pw .done{font-family:var(--hand);font-size:28px;color:var(--pencil)}
.pw .done::after{content:" ✓";color:#2b7a52}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nav{max-width:680px;display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-family:var(--mono);font-size:13px}
.nav button{background:none;border:none;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.nav button:hover{color:var(--ink);border-color:var(--ink)}

/* 표지 */
.cover{max-width:680px;background:#3f6b52;color:#e6eedf;padding:34px 30px 30px;position:relative;box-shadow:0 18px 32px -14px rgba(0,0,0,.6);border-left:14px solid #2a4a38;overflow:hidden}
.cover .label{background:var(--paper);color:var(--ink);padding:14px 18px 12px;max-width:300px;box-shadow:0 2px 4px rgba(0,0,0,.25);border:1px solid #9fbf9f}
.cover .label h2{margin:0;font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:8px}
.cover .label div{font-family:var(--serif);font-size:14px;color:#4f7a5a;margin-top:6px}
.cover .label .who{font-family:var(--hand);font-size:24px;color:var(--pencil);margin-top:2px}
.cover .kc{position:absolute;right:22px;top:22px;width:70px;height:94px;transform:rotate(8deg)}
.cover .story{font-family:var(--serif);font-size:15px;line-height:1.85;margin:24px 0 0;max-width:540px}
.cover .rules{background:var(--paper);color:var(--pencil);font-family:var(--hand);font-size:25px;line-height:1.3;padding:12px 16px;margin-top:16px;max-width:420px;transform:rotate(-.8deg);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.cover .go{margin-top:22px;background:#e6eedf;color:#1f3d2f;border:none;font-weight:800;padding:10px 20px;font-size:15px}
.cover .go:hover{background:#fff}
.proto{font-family:var(--mono);font-size:11.5px;color:#b5c9b8;margin-top:16px}
@media(max-width:480px){.cover{padding:26px 18px 24px}.cover .kc{width:50px;height:68px;right:12px;top:12px}}

/* 결과 */
.result .big{font-family:var(--hand);font-size:42px;line-height:1.1;margin:0 0 10px}
.result .seal{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:3px;padding:4px 14px;transform:rotate(-7deg);margin:6px 0 16px;mix-blend-mode:multiply}
.result dl{font-family:var(--mono);font-size:14px;margin:0;max-width:340px}
.result dl div{display:flex;border-bottom:1px dotted #b9cdb9;padding:5px 0}
.result dt{width:110px;color:var(--dim)}.result dd{margin:0}
.result p{font-family:var(--serif);font-size:14.5px;line-height:1.8;max-width:560px}
.result .note{font-family:var(--hand);font-size:26px;line-height:1.35;color:var(--pencil)}
.result .later{font-family:var(--mono);font-size:12.5px;color:var(--dim);border-top:1px dashed #9fbf9f;padding-top:10px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* 모달 · 힌트 */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,24,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--paper);max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px 20px;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.modal h2{font-family:var(--serif);font-weight:800;margin:0 0 8px;font-size:20px}
.modal .sub{font-size:13px;color:var(--dim);margin-bottom:14px}
.posts{display:flex;flex-direction:column;gap:12px}
.post{background:#fff3a0;padding:10px 14px;font-family:var(--hand);font-size:22px;line-height:1.3;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.post:nth-child(2){background:#ffd6e0;transform:rotate(.6deg)}.post:nth-child(3){background:#cfeaff;transform:rotate(-.6deg)}
.post small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim)}
.post.closed{background:#e9eedb;color:var(--dim);font-family:inherit;font-size:14px;border:none;text-align:left}
.modal .actions{display:flex;justify-content:flex-end;margin-top:16px}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fffdf4;padding:10px 18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<!-- 낙서 모양 (필통과 장면에서 같이 쓴다). 선 색은 쓰는 쪽에서 color로 정한다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
  </defs>
  <symbol id="d-pencil" viewBox="0 0 60 60"><path d="M8 24 H38 L52 30 L38 36 H8 Z"/><path d="M38 24 V36 M13 24 V36"/><path d="M47 28 L52 30 L47 32 Z" fill="currentColor"/></symbol>
  <symbol id="d-eraser" viewBox="0 0 60 60"><path d="M12 19 H48 Q52 19 52 23 V37 Q52 41 48 41 H12 Q8 41 8 37 V23 Q8 19 12 19 Z"/><path d="M23 19 V41 M36 19 V41 M26 24 L33 31 M26 31 L33 38"/></symbol>
  <symbol id="d-lens" viewBox="0 0 60 60"><circle cx="24" cy="24" r="14"/><path d="M34 34 L51 51" stroke-width="5"/><path d="M16 20 Q18 14 24 13"/></symbol>
  <symbol id="d-key" viewBox="0 0 60 60"><circle cx="16" cy="30" r="9"/><circle cx="16" cy="30" r="3"/><path d="M25 30 H52 M44 30 V38 M50 30 V36"/></symbol>
  <symbol id="d-umbrella" viewBox="0 0 60 60"><path d="M7 30 Q30 2 53 30 Q47 25 41.5 30 Q36 25 30 30 Q24 25 18.5 30 Q13 25 7 30 Z"/><path d="M30 30 V48 Q30 53 25 53 Q21 53 21 49"/></symbol>
  <symbol id="d-ladder" viewBox="0 0 60 60"><path d="M20 5 L15 55 M40 5 L45 55 M19 15 H41 M18 27 H42 M17 39 H43 M16 50 H44"/></symbol>
  <symbol id="d-star" viewBox="0 0 60 60"><path d="M30 5 L36 23 L55 23 L40 34 L46 53 L30 42 L14 53 L20 34 L5 23 L24 23 Z"/></symbol>

  <symbol id="d-girl" viewBox="0 0 70 120"><circle cx="35" cy="30" r="16"/><path d="M48 20 Q62 22 58 44"/><path d="M21 26 Q35 14 49 26"/><circle cx="29" cy="31" r="1.6" fill="currentColor"/><circle cx="41" cy="31" r="1.6" fill="currentColor"/><path d="M31 39 H39"/><path d="M35 46 L18 90 H52 Z"/><path d="M28 90 V110 M42 90 V110 M26 58 L15 74 M44 58 L55 74"/></symbol>
</svg>

<div class="app">
  <header class="hud">
    <div class="brand">
      <a class="back" href="../../">← 사건 대장 / NOTE 04</a>
      <span class="t">깡총이 연습장</span>
      <small>노트 방탈출 · 시제품 (1~3장)</small>
    </div>
    <div class="spacer"></div>
    <div class="stat"><span>걸린 시간</span><b id="time">0:00</b></div>
    <div class="stat"><span>힌트</span><b id="hintCount">0</b></div>
    <button class="btn" id="btnHint">힌트</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="page"></main>
</div>
<div class="bag" id="bag"></div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const SAVE_KEY='hn.note04.v1';
const PLAY_LAST=3;   // 시제품은 3장까지

// ── 장 데이터 ──────────────────────────────
// ans: 정답, alt: 같이 인정할 답, near: "거의 맞았다", say: 특정 오답에 돌려줄 말, perm: 글자 순서만 틀리면 짚어 줌
const PAGES=[
  {tab:'표지'},
  {tab:'1장', q:'확인란', ans:'안녕', alt:['안녕나는서하','안녕하세요','안녕나는윤서하','안녕하세요나는서하','안뇽'],
   near:['안','녕','녕안'],
   say:{'몰라':'그건 말풍선 밖이다.','집에갈래':'그건 말풍선 밖이다. 하고 싶었던 말은 따로 있다.','몰라집에갈래':'말풍선 밖 글자들이다.','집':'그건 말풍선 밖이다.','깡총이':'토끼 이름 말고, 짝한테 하려던 말.','말풍선':'말풍선 안에 뭐라고 쓰여 있는지.','선잇기':'선을 다 이으면 무슨 모양이 되는지 보자.'},
   hints:['서하가 끝까지 못 이은 게 있어요. 여백에 굴러다니는 몽당연필을 보세요.','연필을 집어서(필통에서 골라) 이어진 데 다음 번호부터 점을 차례로 눌러 보세요. 다 이으면 무슨 모양이 되는지 보세요.','점을 다 이으면 서하 입에서 나온 말풍선이 돼요. 말풍선 안의 글자 → 정답: 안녕']},
  {tab:'2장', q:'확인란', ans:'깡총이', alt:['깡총','깡충이','깡충','깡총이야','깡총이에요','깡총이라고해','토끼깡총이'],
   near:['깡총이다','깡'],
   say:{'토끼':'지호는 이름을 물었다.','지호':'지호는 자기 이름을 말했다. 물은 건 토끼 이름.','서하':'서하 이름 말고, 토끼 이름.','윤서하':'서하 이름 말고, 토끼 이름.','안녕':'인사는 지호가 먼저 했다. 지호가 물은 걸 보자.','귀엽다':'지호가 물은 건 따로 있다.'},
   hints:['시꺼멓게 칠한 칸 밑에 뭔가 쓰여 있어요. 파란 볼펜으로 그린 낙서를 보세요.','지호가 돌려준 지우개 낙서를 집어서, 필통에서 고른 채로 칠한 칸을 문질러 보세요. 지호가 물은 걸 읽고 1장을 다시 보세요.','지호는 토끼 이름을 물었어요. 1장에 서하가 적어 둔 이름 → 정답: 깡총이']},
  {tab:'3장', q:'확인란', ans:'미끄럼틀', alt:['미끄럼틀밑','미끄럼틀아래','미끄럼틀에서','미끄럼틀앞','미끄럼틀밑에서','미끄럼틀아래에서','미끄럼'],
   near:['끄럼틀','미끄','미끄럼트','미끄런틀'],perm:true,

let tick=0;
setInterval(()=>{if(S.started&&!S.done&&!document.hidden){S.ms+=1000;renderStats();if(++tick%5===0)save()}},1000);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
const norm=s=>s.replace(/[\s.,!?·'"~:\-]/g,'').toLowerCase();
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const sameChars=(a,b)=>[...a].sort().join('')===[...b].sort().join('');
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xac00;return w+(c>=0&&c<11172&&c%28?a:b)};

function canView(v){
  if(v==='cover')return true;
  if(!S.started)return false;
  if(v==='end')return S.done;
  const n=+v.slice(1);return n>=1&&n<=Math.min(S.open,PLAY_LAST);
}
function renderTabs(){

  $('#tabs').innerHTML=tabs.map(([v,label])=>{
    const locked=!canView(v),n=v[0]==='p'?+v.slice(1):0;
    return `<button class="tab${S.v===v?' on':''}" data-v="${v}"${locked?' disabled':''}${n>PLAY_LAST?' title="준비 중"':''}>${locked?'🔒 ':''}${label}${n&&S.solved[n]?'<span class="ok">✓</span>':''}</button>`}).join('');

function renderBag(){

function wiggleHeld(){const b=S.hold&&$(`.slot[data-b="${S.hold}"]`);if(!b)return;b.classList.remove('no');void b.offsetWidth;b.classList.add('no')}

const LR=64,LZ=3;
function scene(p,H,inner){

    <g id="lens" style="display:none" pointer-events="none">
      <g clip-path="url(#lc)"><circle id="lbg" r="${LR}" fill="#fbfdf5"/><g id="lz"><use href="#scn"/></g></g>
      <circle id="lrim" r="${LR}" fill="none" stroke="#8a6d3b" stroke-width="5"/><path id="lh" stroke="#8a6d3b" stroke-width="11" stroke-linecap="round"/>

    <use id="cur" href="#d-pencil" width="46" height="46" style="display:none;opacity:.85" pointer-events="none"/>
  </svg>`;
}
function toSvg(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function syncHold(){
  const svg=$('#scene');if(!svg)return;
  svg.classList.toggle('holding',!!S.hold);
  const cur=$('#cur');cur.setAttribute('href','#d-'+(S.hold||'pencil'));cur.setAttribute('class',S.hold?INK(S.hold):'');
  if(!S.hold||S.hold==='lens')cur.style.display='none';
  if(S.hold!=='lens')$('#lens').style.display='none';
}
function moveHeld(pt){
  if(!S.hold)return;
  if(S.hold==='lens'){
    const {x,y}=pt;$('#lens').style.display='';
    ['lcC','lbg','lrim'].forEach(id=>{const c=document.getElementById(id);c.setAttribute('cx',x);c.setAttribute('cy',y)});
    $('#lz').setAttribute('transform',`translate(${x} ${y}) scale(${LZ}) translate(${-x} ${-y})`);
    const k=LR*.72;$('#lh').setAttribute('d',`M${x+k} ${y+k} L${x+k+34} ${y+k+34}`);
  }else{const c=$('#cur');c.style.display='';c.setAttribute('x',pt.x-14);c.setAttribute('y',pt.y-32)}
}

function scribblePath(){
  let d='',l=SCR.x,r=SCR.x+SCR.w;
  for(let y=SCR.y+4,i=0;y<SCR.y+SCR.h;y+=7,i++){const a=(i*37)%11-5,b=(i*53)%9-4;d+=i?` L${i%2?l+a:r+b} ${y}`:`M${l} ${y}`;if(!i)d+=` L${r} ${y+3}`}
  for(let i=0;i<9;i++){const cx=SCR.x+30+i*33,cy=SCR.y+30+((i*41)%90);d+=` M${cx-18} ${cy} q18 -26 36 0 q-18 26 -36 0`}
  return d;
}

    ${scene(2,300,inner)}
  </article>`+answerRow(2);

const inScr=pt=>pt.x>=SCR.x-10&&pt.x<=SCR.x+SCR.w+10&&pt.y>=SCR.y-10&&pt.y<=SCR.y+SCR.h+10;
let rubbing=false;
function rub(pt){
  if(S.erased||!inScr(pt))return;
  const x=Math.round(pt.x),y=Math.round(pt.y),last=S.rub[S.rub.length-1];
  if(last&&Math.hypot(last[0]-x,last[1]-y)<12)return;
  S.rub.push([x,y]);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',26);c.setAttribute('fill','#000');$('#emH').appendChild(c);
  // 칠한 칸을 20칸 격자로 나눠 얼마나 지웠는지 센다
  let all=0,got=0;
  for(let gx=SCR.x+10;gx<SCR.x+SCR.w;gx+=20)for(let gy=SCR.y+10;gy<SCR.y+SCR.h;gy+=20){all++;if(S.rub.some(([a,b])=>(a-gx)**2+(b-gy)**2<26*26))got++}
  if(got/all>=.7){
    S.erased=true;rubbing=false;save();$('#scrib').classList.add('fade');
    setTimeout(()=>{render(false);toast('칠한 게 다 지워졌다. 밑에 파란 볼펜 글씨.')},900);
  }else if(S.rub.length%6===0)save();
}

    ${Object.entries(HIDDEN).map(([k,[x,y,ch]])=>S.found[k]
      ?`<text x="${x+3}" y="${y+14}" font-size="15" fill="var(--blue)" stroke="none">${ch}</text>`
      :`<use href="#d-${k}" x="${x}" y="${y}" width="16" height="16" class="bp tiny"/>`).join('')}
  </g>`;
}
function page3(){
  const inner=`
    <text x="24" y="34" font-size="30" fill="var(--blue)">지호표 숨은그림찾기</text>
    <text x="24" y="64" font-size="24" fill="var(--blue)">찾을 것: 열쇠 · 우산 · 사다리 · 별</text>
    ${S.bag.lens?'':`<g data-id="take:lens">${hit(500,0,74,72)}<use href="#d-lens" x="504" y="2" width="66" height="66" class="bp" filter="url(#rough)"/></g>`}
    ${picture()}
    <text x="330" y="416" font-size="24" fill="var(--blue)">다 찾으면 비밀 장소 알려 줌!</text>`;
  return `<article class="sheet turn">
    <div class="head"><span>날짜<b>2009. 3. 6. (금)</b></span><span>4학년 3반<b>윤서하</b></span></div>
    <p class="say">짝 이름은 지호. 깡총이 귀엽대.</p>
    <p class="say">지호가 숨은그림찾기를 그려 줬다. 다 찾으면 비밀 장소 알려 준대.</p>
    <p class="say">근데 그림이 너무 작아서 하나도 못 찾았다.</p>
    ${scene(3,424,inner)}
  </article>`+answerRow(3);
}
function hiddenAt(pt){return Object.keys(HIDDEN).find(k=>!S.found[k]&&Math.hypot(HIDDEN[k][0]+8-pt.x,HIDDEN[k][1]+8-pt.y)<20)}
function findHidden(k){
  S.found[k]=true;S.bag[k]=true;NEW=k;save();render(false);
  const left=Object.keys(HIDDEN).filter(h=>!S.found[h]).length;
  toast(`${josa(NAME[k],'을','를')} 찾았다! 필통에 넣었다. 있던 자리에 뭔가 쓰여 있다.${left?'':' 네 개 다 찾았다.'}`);
}

// ── 장면 입력 ──────────────────────────────
function take(item){
  if(S.bag[item])return;
  S.bag[item]=true;NEW=item;save();render(false);toast(TAKE[item]);
}
function bindScene(){
  const svg=$('#scene');if(!svg)return;
  const p=+svg.dataset.p;
  syncHold();
  svg.onpointermove=e=>{const pt=toSvg(svg,e);moveHeld(pt);if(rubbing)rub(pt)};
  svg.onpointerleave=()=>{hideHeld();rubbing=false};
  svg.onpointerdown=e=>{
    const pt=toSvg(svg,e);moveHeld(pt);
    if(p===2&&S.hold==='eraser'&&!S.erased&&inScr(pt)){rubbing=true;try{svg.setPointerCapture(e.pointerId)}catch{}rub(pt)}
  };
  svg.onpointerup=svg.onpointercancel=()=>{rubbing=false};
  svg.onclick=e=>{
    const pt=toSvg(svg,e),el=e.target.closest('[data-id]'),id=el&&el.dataset.id,h=S.hold;
    if(id&&id.startsWith('take:')){take(id.slice(5));return}
    if(p===1&&id==='dot'){if(h==='pencil')connect(+el.dataset.dot);else if(!h)toast(LOOK.dot);else{wiggleHeld()}return}
    if(p===2&&!S.erased&&inScr(pt)){if(h==='eraser')return;if(!h){toast(LOOK.scribble);return}if(REACT[h+'>scribble'])toast(REACT[h+'>scribble']);wiggleHeld();return}
    if(p===3){const k=hiddenAt(pt);
      if(k&&h==='lens'){findHidden(k);return}
      if(k&&!h){toast('콩알만 한 게 그려져 있는데, 너무 작아서 뭔지 모르겠다.');return}}
    if(!id)return;
    if(!h){if(LOOK[id])toast(LOOK[id]);const g=el;g.classList.remove('wig');void g.getBBox;g.classList.add('wig');return}
    if(h==='lens'&&id!=='kc')return;   // 돋보기는 들고 훑는 것만으로 충분하다
    if(REACT[h+'>'+id])toast(REACT[h+'>'+id]);
    wiggleHeld();
  };
}

// ── 답 ──────────────────────────────
function answerRow(p){
  const pg=PAGES[p];
  const nav=`<div class="nav"><button data-go="${p===1?'cover':'p'+(p-1)}">← 앞 장</button>${S.solved[p]&&p<PLAY_LAST?`<button data-go="p${p+1}">다음 장 →</button>`:''}</div>`;
  if(S.solved[p])return `<div class="pw"><label>${pg.q}:</label><span class="done">${S.solved[p]}</span></div>${nav}`;
  return `<form class="pw" id="pw" autocomplete="off"><label for="ans">${pg.q}:</label><input id="ans" maxlength="20" spellcheck="false"><button class="btn primary">적기</button><div class="msg" id="msg"></div></form>${nav}`;
}
function check(p){
  const inp=$('#ans'),v=norm(inp.value),pg=PAGES[p],msg=$('#msg');
  if(!v)return;
  if(v===norm(pg.ans)||(pg.alt||[]).some(a=>norm(a)===v)){
    S.solved[p]=pg.ans;S.open=Math.max(S.open,p+1);JUST=p;
    if(p>=PLAY_LAST)S.done=true;
    save();render(false);
    toast(p>=PLAY_LAST?'깡총이가 종이 끝으로 깡총깡총 건너간다.':`깡총이가 ${p+1}장으로 건너간다.`);
    setTimeout(()=>{JUST=0;if(p>=PLAY_LAST&&S.v==='p'+p)go('end')},1900);
    return;
  }
  S.wrong[p]=(S.wrong[p]||0)+1;save();
  const a=norm(pg.ans),said=pg.say&&pg.say[v];
  const perm=pg.perm&&v!==a&&sameChars(v,a);
  const near=(pg.near||[]).includes(v)||(a.length>=3&&lev(v,a)<=1);
  msg.className='msg'+(near&&!said&&!perm?' near':'');
  msg.textContent=said||(perm?'글자는 맞는데… 찾을 것 목록 순서대로 읽어 보자.':near?'거의 맞았다. 조금만 더…':['아닌 것 같다.','연습장을 다시 보자.','낙서를 더 만져 봐야 하나.'][S.wrong[p]%3]);
  $('#pw').classList.remove('shake');void $('#pw').offsetWidth;$('#pw').classList.add('shake');
  inp.select();
}

// ── 표지 · 끝 ──────────────────────────────
function pageCover(){
  return `<section class="cover turn">
    <svg class="kc" viewBox="0 0 60 80" aria-hidden="true"><use href="#d-kc" class="pc" style="color:#e6eedf" filter="url(#rough)"/></svg>
    <div class="label"><h2>수학 연습장</h2><div>4학년 3반</div><div class="who">윤서하</div></div>
    <p class="story">나는 깡총이. 2009년 3월, 이 연습장 첫 장 귀퉁이에 연필로 그려졌다. 나를 그린 아이는 그날 이렇게 적었다.</p>
    <div class="rules">깡총이 집은 다음에 그려 줄게. 문도.</div>
    <p class="story">그 “다음”은 오지 않았다. 연습장 맨 뒷장 어딘가에 그리다 만 집이 있다는 것만 안다. 종이 끝까지 가면 다음 장으로 건너갈 수 있다. 한 장씩 가 보기로 했다.</p>
    <button class="btn go" id="start">${S.started?'이어서 펼치기':'연습장 펼치기'}</button>
    <div class="proto">시제품 · 1~3장 · 진행 상황은 이 브라우저에 저장돼요</div>
  </section>`;
}
function pageEnd(){
  const h=hintTotal(),ansHints=Object.values(S.hints).filter(n=>n>=3).length;
  const grade=h===0?'짝꿍':ansHints===0?'낙서 친구':'전학생';
  return `<article class="sheet turn result">
    <p class="big">토요일, 미끄럼틀 밑.</p>
    <div class="seal">${grade}</div>
    <dl>
      <div><dt>걸린 시간</dt><dd>${fmt(S.ms)}</dd></div>
      <div><dt>힌트</dt><dd>${h}장</dd></div>
      <div><dt>틀린 답</dt><dd>${wrongTotal()}번</dd></div>
    </dl>
    <p>숨은 그림 밑에서 나온 글자 넷. 그날 서하는 연습장 맨 아래에 작게 적었다.</p>
    <p class="note">토요일에 미끄럼틀 밑에서 지호 만나기로 함! 깡총이도 데려가야지.</p>
    <p>깡총이는 다음 장으로 건너갈 준비를 한다. 필통에는 열쇠, 우산, 사다리, 별이 들어 있다. 아직 어디에 쓰는지 모르는 낙서들이다.</p>
    <div class="later">시제품은 여기까지예요. 4~6장(찢어진 사다리타기, 지호의 보물상자, 깡총이 집)은 만드는 중이에요.</div>
    <div class="row"><button class="btn" id="again">처음부터 다시</button><a class="btn primary" href="../../" style="text-decoration:none">사건 대장으로</a></div>
  </article>`;
}

// ── 렌더 ──────────────────────────────
function view(){
  const v=S.v;
  if(v==='cover')return pageCover();
  if(v==='end')return pageEnd();
  return [null,page1,page2,page3][+v.slice(1)]();
}
function render(anim){
  if(!canView(S.v))S.v='cover';
  renderTabs();renderStats();
  const pg=$('#page');pg.innerHTML=view();
  if(!anim)pg.querySelectorAll('.turn').forEach(e=>e.classList.remove('turn'));
  pg.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(S.v==='cover')$('#start').onclick=()=>{if(!S.started){S.started=true;S.open=1}go('p'+frontier())};
  const f=$('#pw');if(f)f.onsubmit=e=>{e.preventDefault();check(+S.v.slice(1))};
  if(S.v==='end')$('#again').onclick=()=>{if(confirm('처음부터 다시 할까요? 지금 기록은 지워져요.')){S=fresh();save();render(true)}};
  renderBag();bindScene();
}

// ── 모달 · 힌트 ──────────────────────────────
function openHint(){
  const p=hintPage(),pg=PAGES[p];if(!pg||!pg.hints||S.done)return;
  const got=S.hints[p]||0;
  $('#modal').innerHTML=`<h2>${pg.tab} 힌트</h2><div class="sub">지금 풀고 있는 장의 힌트예요. 한 장씩 떼어 볼 수 있고, 세 번째 장엔 정답이 있어요.</div>
    <div class="posts">${pg.hints.map((h,i)=>i<got?`<div class="post"><small>포스트잇 ${i+1}</small>${h}</div>`
      :i===got?`<button class="post closed" id="peel">포스트잇 ${i+1} 떼어 보기${i===2?' (정답)':''}</button>`
      :`<div class="post closed">포스트잇 ${i+1}</div>`).join('')}</div>
    <div class="actions"><button class="btn" id="mclose">닫기</button></div>`;
  $('#mbg').classList.add('on');
  $('#mclose').onclick=closeM;
  const pe=$('#peel');if(pe)pe.onclick=()=>{S.hints[p]=got+1;save();renderStats();openHint()};
}
function closeM(){$('#mbg').classList.remove('on')}
$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(S.hold){S.hold=null;save();renderBag();syncHold()}}});
$('#btnHint').onclick=openHint;

render(true);
</script>
</body>
</html>
