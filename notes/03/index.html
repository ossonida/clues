<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hada0127/hada-type-levelup@v2026.10.21/css/levelup-subset.css">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{
  --desk:#24262b;--pad:#fbf2a6;--pline:#a9c3e0;--margin:rgba(214,69,65,.55);--lh:32px;--ml:56px;--binding:#2c3540;
  --sheet:#f4ecd6;--ink:#1f1c18;--dim:#6b6358;--stamp:#a3312a;--pen:#23262f;--crayon:#c25a7c;
  --hs:clamp(19px,5vw,24px);
  --mono:"Kkakdugi Drafting",monospace;--serif:"LevelUp",serif;--hand:"HEEJOY",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:"Kkakdugi Drafting",system-ui,sans-serif;font-size:15px;line-height:1.6}
@media(max-width:640px){:root{--ml:26px}}
button{font-family:inherit;cursor:pointer;color:inherit}

/* 리갈패드 바탕 (Note 01·02와 같은 틀) */
.app{max-width:900px;min-height:100vh;margin:0 auto;padding:0 22px 56px calc(var(--ml) + 22px);background-color:var(--pad);
  background-image:linear-gradient(90deg,transparent calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 4px),transparent calc(var(--ml) - 4px),transparent var(--ml),var(--margin) var(--ml),var(--margin) calc(var(--ml) + 1px),transparent calc(var(--ml) + 1px)),
    repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--pline) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0,0 6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.app::before{content:"";display:block;height:34px;margin:0 -22px 22px calc(-1 * (var(--ml) + 22px));background:linear-gradient(#3a4552,var(--binding) 70%,#1c232b);box-shadow:0 3px 0 rgba(0,0,0,.12)}
@media(max-width:640px){.app{padding:0 12px 40px calc(var(--ml) + 12px)}.app::before{margin:0 -12px 18px calc(-1 * (var(--ml) + 12px))}}

header.hud{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--hand);font-size:40px;letter-spacing:-.5px;line-height:1.05}
.brand .t{background:linear-gradient(transparent 60%,rgba(44,53,64,.25) 60% 88%,transparent 88%)}
.brand .back{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px}
.brand .back:hover{color:var(--ink)}
.brand small{display:block;font-family:var(--serif);font-size:14px;color:var(--dim);margin-top:4px}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;line-height:1.3;padding:0 4px}
.stat b{color:var(--ink);font-size:20px;border-bottom:1px solid var(--ink);min-width:62px}
.btn{white-space:nowrap;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:7px 13px;font-size:14px;font-weight:700}
.btn:hover{background:var(--ink);color:#fffdf4}
.btn.primary{background:var(--ink);color:#fffdf4}
.btn.primary:hover{background:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}

/* 탭 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding-left:14px;position:relative;z-index:1;margin-bottom:-4px}
.tab{border:none;color:#3a3326;padding:7px 14px 9px;font-size:13px;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.12);opacity:.85;background:#e8dcb8}
.tab.map{background:#c8d6c0;margin-left:10px}
.tab:hover{opacity:1}
.tab.on{opacity:1;padding-top:12px;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.tab:disabled{background:#e4dcc4;color:#9a8f76;font-weight:400;cursor:not-allowed;opacity:.8}
.tab .ok{color:#2b7a52;margin-left:3px}

/* 숙직 일지 한 장 */
.log{position:relative;max-width:660px;background:var(--sheet);padding:22px 22px 26px;user-select:none;-webkit-user-select:none;
  box-shadow:0 1px 1px rgba(0,0,0,.12),0 16px 30px -14px rgba(40,30,0,.55);
  background-image:radial-gradient(ellipse at 85% 10%,rgba(150,110,40,.13),transparent 45%),radial-gradient(ellipse at 10% 95%,rgba(120,90,40,.12),transparent 40%)}
.log.turn{animation:turn .45s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(26px) rotate(.8deg)}to{opacity:1;transform:none}}
.log h3{margin:0;text-align:center;font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:10px;color:#3d3628}
.log .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-family:var(--serif);font-size:13px;color:#6b604a;border-bottom:2px solid #6b604a;padding:10px 0 6px;margin-bottom:2px}
.log .meta b{font-family:var(--hand);font-weight:400;font-size:calc(var(--hs) * 1.02);color:var(--pen);margin-left:4px}
.rows{display:grid;grid-template-columns:54px 70px 72px 1fr}
.rows>div{border-bottom:1px solid #cbbf9e;padding:4px 6px 2px;font-family:var(--hand);font-size:var(--hs);line-height:1.25;color:var(--pen);min-height:38px}
.rows>.th{font-family:var(--serif);font-size:12px;color:#6b604a;background:rgba(107,96,74,.08);min-height:0;padding:4px 6px;border-bottom:1px solid #6b604a}
.rows .st{white-space:nowrap;color:#7a7264}
.rows .st.bad{color:#c4261c;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
@media(max-width:560px){
  .rows{grid-template-columns:48px 62px 1fr}
  .rows>.th.memo{display:none}
  .rows>.memo{grid-column:1/-1;padding-left:20px;min-height:0;padding-bottom:6px}
  .rows>.memo:empty{display:none}
  .rows>div:not(.memo):not(.th){border-bottom:none}
}
.log .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;font-family:var(--hand);font-size:var(--hs);color:var(--pen);line-height:1.3}
.log .foot .sign{font-family:var(--serif);font-size:12px;color:#6b604a;white-space:nowrap}
.log .foot .sign b{display:inline-block;margin-left:6px;border:2px solid var(--stamp);color:var(--stamp);border-radius:50%;width:34px;height:34px;line-height:30px;text-align:center;font-family:var(--serif);font-size:12px;transform:rotate(-8deg);opacity:.8}
.quote{display:inline-block;background:#fff8dc;border:1px dashed #b9a676;padding:0 8px;margin:2px 0;transform:rotate(-.6deg)}

/* 5장 이후: 몇 장 비운 뒤 새로 쓴 기록. 잉크가 진하고 글씨가 떨린다 */
.blank{text-align:center;font-family:var(--serif);font-size:12.5px;color:#9a8f76;letter-spacing:4px;padding:22px 0 14px;border-bottom:1px dashed #cbbf9e;margin-bottom:10px}
/* 2026년 기록: 새 파란 볼펜. 옛 기록(검정)과 색·굵기 둘 다 다르게 */
.fresh .meta b,.fresh .rows>div:not(.th),.fresh .foot>div:first-child{color:#1747d1;-webkit-text-stroke:.35px #1747d1}
.fresh .rows .st{color:#1747d1}
.fresh .rows .st.bad{color:#c4261c}
.fresh .rows>div:not(.th){letter-spacing:.5px;transform:rotate(-.4deg)}
.fresh .meta .yr{display:inline-block;min-width:54px;border-bottom:1.5px dotted #9a8f76;margin:0 4px}

/* 풍금 */
.organ{margin-top:16px;background:#3b2a20;border:1px solid #5a4030;border-radius:4px;padding:14px 14px 12px}
.organ h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:#cdb79f;font-weight:400}
.keys{display:flex;gap:3px;height:120px}
.key{flex:1;background:linear-gradient(#f7f2e4,#e6dcc4);border:none;border-radius:0 0 4px 4px;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);padding:0}
.key:active,.key.down{background:#d9cba8;box-shadow:none}
.key .star{position:absolute;left:0;right:0;bottom:10px;font-size:20px;color:var(--crayon);font-family:var(--hand)}
.organ .msg{font-family:var(--hand);font-size:22px;color:#f1d9b8;min-height:28px;margin-top:6px;letter-spacing:2px}

/* 종 줄 */
.rope{margin-top:16px;background:#1b1e21;border:1px solid #3a3f44;border-radius:6px;padding:14px 16px 16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.rope h3{margin:0;flex-basis:100%;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:#b9b2a2;font-weight:400}
.rope .pull{background:#c9a04a;color:#1d2124;border:none;font-weight:800;padding:12px 20px;border-radius:3px;font-size:15px}
.rope .pull:active{transform:translateY(3px)}
.rope .rings{font-family:var(--hand);font-size:24px;color:#f3e3b5;min-height:30px;flex:1}
.rope .rings i{font-style:normal;opacity:.45;margin:0 6px}
.rope .msg{flex-basis:100%;font-family:var(--hand);font-size:21px;color:#f1c7a8;min-height:24px;line-height:1.2}

/* 손전등: .dk 안쪽을 덮는 어둠. 켜면 손가락/마우스 둘레만 밝아진다 */
.dk{position:relative}
.dark{position:absolute;inset:-2px;background:#0b0c10;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:24px;color:#6d6c76;text-align:center;padding:20px}
.dk.torch{touch-action:none;cursor:none}
.dk.torch .dark{-webkit-mask-image:radial-gradient(circle var(--r,90px) at var(--mx,50%) var(--my,30%),transparent 55%,#000 100%);
  mask-image:radial-gradient(circle var(--r,90px) at var(--mx,50%) var(--my,30%),transparent 55%,#000 100%)}
.dk.torch .dark span{display:none}

/* 답 쓰는 칸 */
.pw{max-width:660px;margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pw label{font-family:var(--hand);font-size:26px;color:var(--ink)}
.pw input{font-family:var(--hand);font-size:26px;color:var(--pen);background:transparent;border:none;border-bottom:2px solid var(--ink);padding:0 6px;width:200px;outline:none}
.pw input:focus{border-color:#27479a}
.pw .msg{flex-basis:100%;font-family:var(--hand);font-size:22px;line-height:1.2;min-height:26px;color:var(--stamp)}
.pw .msg.near{color:#27479a}
.pw .done{font-family:var(--hand);font-size:28px;color:var(--pen)}
.pw .done::after{content:" ✓";color:#2b7a52}
.pw .where{font-family:var(--hand);font-size:24px;color:var(--dim)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nav{max-width:660px;display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-family:var(--mono);font-size:13px}
.nav button{background:none;border:none;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.nav button:hover{color:var(--ink);border-color:var(--ink)}

/* 배치도 */
.plan{max-width:660px;background:#1f2a33;color:#d9e2e6;padding:16px 16px 12px;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.plan h3{margin:0 0 4px;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:#93a6b2;font-weight:400}
.plan svg{display:block;width:100%;height:auto;font-family:"Kkakdugi Drafting",sans-serif}
.plan .rm{cursor:pointer}
.plan .rm rect{fill:#2a3843;stroke:#7d95a3;stroke-width:1.5}
.plan .rm.open rect{fill:#e9dfb9;stroke:#f3ead0}
.plan .rm.open text{fill:#2a2418}
.plan .rm.open:hover rect{fill:#fff3c4}
.plan .rm.locked text{fill:#7d95a3}
.plan .rm.fresh rect{animation:glow 1.2s 3}
@keyframes glow{50%{fill:#fff8d6;stroke:#ffd76a}}
.plan .hall{fill:#25313b;stroke:#7d95a3;stroke-width:1.5}
.plan .lbl{font-size:15px;font-weight:700;fill:#d9e2e6;text-anchor:middle}
.plan .sub{font-size:13px;fill:#93a6b2;text-anchor:middle}
.plan .legend{font-family:var(--mono);font-size:11.5px;color:#93a6b2;margin-top:6px}

/* 방 */
.room{max-width:660px;background:#2a2c31;color:#e7e1d3;padding:20px 20px 22px;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.room h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:800;color:#f2ead5}
.room .desc{font-family:var(--serif);font-size:14.5px;line-height:1.85;color:#c9c2b2;margin:8px 0 16px}
.things{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thing{background:#3a3d44;border:1px solid #545862;color:#efe8d6;padding:14px 10px 12px;border-radius:3px;text-align:center;font-size:14px;font-weight:700;line-height:1.3}
.thing:hover{background:#4a4e57;border-color:#8a8f99}
.thing .ic{display:block;font-size:26px;margin-bottom:4px}
.thing.new{animation:pop .5s 4}
.room .dk{padding:4px;margin:-4px}
.room .nav button{color:#b3ad9f}
.room .nav button:hover{color:#fff;border-color:#fff}

/* 출석부 */
.roll{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto;font-family:var(--mono);background:#fffdf4;margin:4px 0 8px}
.roll th,.roll td{border:1px solid #b8ad92;padding:3px 0;text-align:center;min-width:18px}
.roll th{background:#efe6cc;font-weight:400;color:#6b604a}
.roll td.nm{font-family:"Kkakdugi Drafting",sans-serif;font-weight:700;white-space:nowrap;padding:3px 6px;text-align:left}
.roll td.x{color:#a3312a;font-weight:700}
.roll td.l{color:#1747d1;font-weight:700}
@media(max-width:560px){.roll{font-size:9.5px;letter-spacing:-.3px}.roll th,.roll td{min-width:0;padding:2px 0}.roll td.nm{padding:2px 2px;font-size:10px}}
.rollwrap{overflow-x:auto}
.legendline{font-size:12.5px;color:var(--dim)}

/* 번호자물쇠 */
.lock{margin-top:16px;background:#1b1e21;color:#e9e4d8;padding:14px 16px 16px;border-radius:6px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;border:1px solid #3a3f44}
.lock h3{margin:0;flex-basis:100%;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:#b9b2a2;font-weight:400}
.dials{display:flex;gap:8px}
.dial{display:flex;flex-direction:column;align-items:center;background:#0f1113;border-radius:4px;width:46px}
.dial button{background:none;border:none;color:#9aa3a8;width:100%;padding:2px 0;font-size:12px}
.dial button:hover{color:#fff}
.dial b{font-family:var(--mono);font-size:26px;line-height:1.3;background:linear-gradient(#cfc7b4,#f7f2e6 45%,#cfc7b4);color:#1d2124;width:100%;text-align:center}
.lock .pull{background:#c9a04a;color:#1d2124;border:none;font-weight:800;padding:10px 18px;border-radius:3px}
.lock .pull:hover{background:#e0b85a}
.lock .msg{flex-basis:100%;font-family:var(--hand);font-size:21px;color:#f1c7a8;min-height:24px;line-height:1.2}
.lock.open{opacity:.75}

/* 자리표 */
.seats{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;max-width:300px;margin:8px 0;font-family:var(--hand);font-size:26px}
.seats .win{grid-column:1;grid-row:2/4;writing-mode:vertical-rl;font-family:var(--serif);font-size:12px;color:#6b8aa3;border-left:4px double #9db7cc;display:flex;align-items:center;justify-content:center}
.seats b{font-weight:400;border:1.5px solid #6b604a;background:#fffdf4;text-align:center;padding:8px 0}
.seats i{font-style:normal;border:1.5px dashed #cbbf9e}
.seats .front{grid-column:2/4;text-align:center;font-family:var(--serif);font-size:12px;color:#6b604a;border-bottom:3px solid #3d3628;padding-bottom:2px}

/* 표지 */
.cover{max-width:660px;background:#2b3038;color:#e3dccb;padding:34px 30px 30px;position:relative;box-shadow:0 18px 32px -14px rgba(0,0,0,.6);border-left:14px solid #1c2026}
.cover .label{background:#efe6cc;color:var(--ink);padding:14px 18px 12px;max-width:300px;box-shadow:0 2px 4px rgba(0,0,0,.25);border:1px solid #b8ad92}
.cover .label h2{margin:0;font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:12px}
.cover .label div{font-family:var(--serif);font-size:14px;color:#6b604a;margin-top:6px}
.cover .label .who{font-family:var(--hand);font-size:22px;color:var(--pen)}
.cover .story{font-family:var(--serif);font-size:15px;line-height:1.85;margin:26px 0 0;max-width:540px}
.cover .rules{background:#f4ecd6;color:var(--pen);font-family:var(--hand);font-size:23px;line-height:1.3;padding:12px 16px;margin-top:22px;max-width:460px;transform:rotate(-.8deg);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.cover .go{margin-top:22px;background:#e3dccb;color:#1c2026;border:none;font-weight:800;padding:10px 20px;font-size:15px}
.cover .go:hover{background:#fff}
.proto{font-family:var(--mono);font-size:11.5px;color:#8e98a3;margin-top:16px}

/* 결과 */
.result{max-width:660px}
.result .big{font-family:var(--hand);font-size:42px;line-height:1.1;margin:0 0 10px}
.result .seal{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:3px;padding:4px 14px;transform:rotate(-7deg);margin:6px 0 16px;mix-blend-mode:multiply}
.result dl{font-family:var(--mono);font-size:14px;margin:0;max-width:340px}
.result dl div{display:flex;border-bottom:1px dotted #cfc6b0;padding:5px 0}
.result dt{width:110px;color:var(--dim)}.result dd{margin:0}
.result p{font-family:var(--serif);font-size:14.5px;line-height:1.8;max-width:540px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* 소지품 */
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--dim)}
.tool{border:1.5px solid var(--ink);background:#fffdf4;padding:6px 10px;font-size:13px;font-weight:700;border-radius:2px}
.tool:hover{background:#f3ead0}
.tool.lit{background:#ffe680;border-color:#c9a04a}
.tool.new{animation:pop .5s 4}
@keyframes pop{50%{transform:scale(1.18) rotate(-3deg)}}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,24,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--sheet);max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px 20px;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.modal h2{font-family:var(--serif);font-weight:800;margin:0 0 8px;font-size:20px}
.modal .sub{font-size:13px;color:var(--dim);margin-bottom:14px}
.modal p{font-family:var(--serif);font-size:14.5px;line-height:1.8;margin:6px 0}
.modal .hand{font-family:var(--hand);font-size:24px;line-height:1.3;color:var(--pen)}
.modal .crayon{font-family:var(--hand);font-size:24px;color:var(--crayon)}

<script>
const $=s=>document.querySelector(s);
// ==== 데이터 (PAGES) ====
const SAVE_KEY='hn.note03.v2';
const LAST=6;   // 마지막 장 (6장은 종탑에서 종을 쳐서 푼다)

// ── 일지 데이터 ──────────────────────────────
// ans: 정답, alt: 같이 인정할 답, near: "거의 맞았다", say: 특정 오답에 돌려줄 말
const PAGES=[
  {tab:'표지'},
  {tab:'1장', q:'확인란', ans:'시계뒤', alt:['시계','벽시계','벽시계뒤','시계뒤쪽','시계뒤에','벽시계뒤에'],
   near:['시계뒤편','시','계뒤','시계앞'],
   say:{'난로':'그건 이상 없던 줄이다.','책상':'책상은 아이들도 뒤진다고 했다.','풍금':'그건 이상 있던 일. 숨긴 곳은 따로 있다.','종탑':'그건 이상 있던 곳. 숨긴 곳은 따로 있다.'},
   hints:['“이상 있음”이라고 적힌 줄만 다시 보세요.','이상 있는 줄의 비고, 그 첫 글자를 위에서부터 차례로 읽어 보세요.','시·계·뒤 → 정답: 시계뒤. 배치도에서 숙직실 벽시계를 살펴보세요.']},
  {tab:'2장', code:'316',
   hints:['캐비닛은 교무실에 있어요. 번호를 적어 둔 메모가 교무실 메모지 묶음에 있었는데, 그 장은 뜯겨 나갔어요. 숙직실 책상도 다시 보세요.','숙직실에서 챙긴 연필을 소지품에서 골라 든 채로 메모지 묶음을 누르면 눌린 글씨 "애들 이번 달 쉰 날"이 떠올라요. 출석부에서 동·미·은 각자의 결석(/)을 세어 보세요. 지각(△)은 쉰 날이 아니에요.','동민 3 · 미래 1 · 은수 6 → 캐비닛 번호 316']},
  {tab:'3장', q:'확인란', ans:'종탑', alt:['종','종루','뒤뜰종탑','종탑이요','뒤뜰의종탑','종치는탑'],
   near:['탑','뒤뜰','종각'],
   say:{'은수자리에서창밖을봐':'칠판이 시킨 대로, 창밖에 뭐가 보이는지 직접 가서 보자.','창밖':'창밖에 뭐가 보이는지 직접 가서 보자.','창밖을봐':'창밖에 뭐가 보이는지 직접 가서 보자.','은수자리':'그 자리에서 창밖에 뭐가 보이는지 보자.','철봉':'그건 1번 자리 창밖이다.','운동장':'그건 1번 자리 창밖이다.','게시판':'그건 2번 자리에서 보이는 거다.','복도':'그건 2번 자리에서 보이는 거다.','은수':'은수 자리에서 보이는 걸 적자.','창가뒷자리':'자리 말고, 그 창밖에 보이는 것.','3번':'자리 말고, 그 창밖에 보이는 것.'},
   hints:['정전이라 일지가 안 보여요. 교무실 캐비닛에서 꺼낸 손전등을 켜 보세요.','일지에 나온 교실 칠판을 손전등으로 직접 보세요. 은수가 몇 번인지는 교무실 출석부, 몇 번 자리가 어디인지는 교탁 자리표에 있어요. 자리표는 연필 낙서로 덮여 있으니 교무실 담임 책상에서 챙긴 지우개를 든 채로 누르세요.','은수는 3번, 창가 뒷자리. 그 책상에서 창밖을 보면 → 정답: 종탑']},
  {tab:'4장', q:'확인란', ans:'아이들', alt:['애들','아이들셋','애들셋','학생들','동민미래은수','동민이미래은수','동민이미래은수','김동민박미래이은수','우리셋','세명','셋','아이들이'],
   near:['동민','미래','은수','동민미래','아이'],
   say:{'은수':'은수 혼자가 아니다. 쪽지를 다시 보자.','동민':'동민이 혼자가 아니다. 쪽지를 다시 보자.','미래':'미래 혼자가 아니다. 쪽지를 다시 보자.','귀신':'귀신이 서랍에 쪽지를 남기진 않는다.','한봉수':'아저씨는 듣기만 했다.','봉수':'아저씨는 듣기만 했다.'},
   hints:['일지 21:00 줄을 보세요. 음악실 열쇠는 창고에 있고, 열쇠꾸러미에 「창고」 열쇠가 있어요.','음악실 풍금에서 ★ 그려진 건반이 1이에요. 거기서부터 오른쪽으로 세어 5·3·3·4·2·2를 차례로 눌러 보세요.','★이 3번째 건반이니 7·5·5·6·4·4번째 건반. 열린 서랍의 쪽지를 읽으면 → 정답: 아이들']},
  {tab:'5장', q:'확인란', ans:'2026', alt:['2026년','이천이십육','이천이십육년','26년','26'],
   near:['2025','2027'],
   say:{'1999':'1999년 2월 28일은 일요일이었다. 맨 위 기록을 보자.','1999년':'1999년 2월 28일은 일요일이었다. 맨 위 기록을 보자.','2020':'2020년은 2월 29일이 있었다. 그해 2월 28일은 금요일.','2020년':'2020년은 2월 29일이 있었다. 그해 2월 28일은 금요일.','2015':'동창회보다 앞이다.','2009':'동창회보다 앞이다.','2019':'그해 2월 28일은 동창회 날, 목요일이었다.','2037':'아직 오지 않은 해다.','1998':'문 닫기 전이다.'},
   hints:['아래쪽 기록에는 연도가 비어 있어요. 일지가 말하는 "동창회 하던 날"이 언제였는지 현관에서 찾아보세요.','동창회는 2019년 2월 28일. 그 뒤로 2월 28일이 토요일이고 다음 날이 3월 1일(일)인 해를 찾으세요. 아직 오지 않은 해는 빼요.','2020년은 윤년이라 2월 28일이 금요일. 2021~2025년도 아니고, 2026년 2월 28일이 토요일. 정답: 2026']},
  {tab:'6장', code:'4-2-3',
   hints:['종탑 벽의 타종 규칙판, 음악실 서랍의 아이들 쪽지, 교무실 출석부를 함께 보세요.','은수 신호는 쪽지에 없어요. 봉수 아저씨가 밤마다 혼자 치는 종이 무엇인지 일지에서 보세요. 순서는 출석 번호(1 동민, 2 미래, 3 은수)대로.','동민 모임종 4번 → 미래 끝종 2번 → 은수 시작종 3번. 종 줄을 4번, 2번, 3번 끊어서 당기세요.']},
];
const ROOM_NAME={duty:'숙직실',office:'교무실',class:'교실',store:'창고',music:'음악실',bell:'종탑',hall:'현관'};

// ── 상태 ──────────────────────────────
const fresh=()=>({v:'cover',open:0,solved:{},hints:{},wrong:{},ms:0,started:false,done:false,
  rooms:{duty:true,office:false,class:false,store:false,music:false,bell:false,hall:false},tools:{key:false,torch:false,pencil:false,eraser:false},torch:false,held:null,rubbed:false,seatClean:false,cab:[0,0,0],drawer:false});
// ==== 상태·저장·탭 ====
let S=fresh();
let resumed=false;
try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d){S={...fresh(),...d,rooms:{...fresh().rooms,...(d.rooms||{})},tools:{...fresh().tools,...(d.tools||{})}};resumed=S.started&&!S.done}}catch{}
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch{}};
addEventListener('pagehide',()=>{save();if(S.started&&!S.done)ana('case_left',{stage:'investigating',location:'view_'+S.v,clue_count:Object.keys(S.solved).length,minutes_used:anaMinutes(),play_minutes:anaMinutes()},true)});
let NEWTOOL=null,NEWROOM=null;

const fmt=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const hintTotal=()=>Object.values(S.hints).reduce((a,b)=>a+b,0);
const wrongTotal=()=>Object.values(S.wrong).reduce((a,b)=>a+b,0);
const anaMinutes=()=>Math.round(S.ms/60000);
const ana=(name,params={},beacon=false)=>{if(window.hn)window.hn(name,params,beacon)};
const anaChapter=(name,p)=>ana(name,{chapter:p,minutes_used:anaMinutes()});
const frontier=()=>Math.min(S.open,LAST);   // 지금 풀어야 할 장
// 힌트: 보고 있는 장이나 방에 걸린 장이 열려 있고 아직 못 풀었으면 그 장, 아니면 지금 풀어야 할 장
const ROOM_PAGE={office:2,class:3,store:4,music:4,bell:6};
function hintPage(){
  const v=S.v,p=v[0]==='p'?+v.slice(1):ROOM_PAGE[v];
  return p&&p<=S.open&&!S.solved[p]?p:frontier();
}
function renderStats(){$('#time').textContent=fmt(S.ms);$('#hintCount').textContent=hintTotal();$('#btnHint').disabled=!S.started||S.done}
let tick=0;
setInterval(()=>{if(S.started&&!S.done&&!document.hidden){S.ms+=1000;renderStats();if(++tick%5===0)save()}},1000);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
const norm=s=>s.replace(/[\s.,!?·'"~:\-]/g,'').toLowerCase();
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const sameDigits=(a,b)=>[...a].sort().join('')===[...b].sort().join('');
function gain(tool,msg){if(S.tools[tool])return;S.tools[tool]=true;NEWTOOL=tool;save();renderTools();toast(msg)}
function openRoom(r,msg){if(S.rooms[r])return;S.rooms[r]=true;NEWROOM=r;save();if(msg)toast(msg)}

// ── 탭 · 소지품 ──────────────────────────────
const isRoom=v=>v in ROOM_NAME;
function canView(v){
  if(v==='cover')return true;
  if(!S.started)return false;
  if(v==='map')return true;
  if(v==='end')return S.done;
  if(isRoom(v))return !!S.rooms[v];
  const n=+v.slice(1);return n>=1&&n<=S.open;
}
function renderTabs(){
  const tabs=[['cover','표지'],...[1,2,3,4,5,6].map(n=>['p'+n,n+'장']),['map','배치도'],...(S.done?[['end','끝']]:[])];
  const cur=isRoom(S.v)?'map':S.v;
  $('#tabs').innerHTML=tabs.map(([v,label])=>{
    const locked=!canView(v),n=v[0]==='p'?+v.slice(1):0;
    return `<button class="tab${v==='map'?' map':''}${cur===v?' on':''}" data-v="${v}"${locked?' disabled':''}>${locked?'🔒 ':''}${label}${n&&S.solved[n]?'<span class="ok">✓</span>':''}</button>`}).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function renderTools(){
  const el=$('#tools');
  if(!S.started||S.v==='cover'||S.v==='end'){el.innerHTML='';return}
  // 연필·지우개는 눌러서 손에 든다 (든 채로 물건을 누르면 그 위에 쓴다)
  const items=[['key','🔑 열쇠꾸러미',S.tools.key],['torch',S.torch?'🔦 손전등 켜짐':'🔦 손전등',S.tools.torch],
    ['pencil',S.held==='pencil'?'✏️ 연필 든 채':'✏️ 연필',S.tools.pencil],['eraser',S.held==='eraser'?'🧽 지우개 든 채':'🧽 지우개',S.tools.eraser]].filter(t=>t[2]);
  const on=id=>id==='torch'?S.torch:S.held===id;
  el.innerHTML=items.length?'<span>소지품</span>'+items.map(([id,label])=>
    `<button class="tool${on(id)?' lit':''}${NEWTOOL===id?' new':''}" data-t="${id}"${id!=='key'?` aria-pressed="${on(id)}"`:''}>${label}</button>`).join(''):'';
  NEWTOOL=null;
  el.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(t==='key')toast('열쇠꾸러미: 「숙직실」 「교무실」 「창고」 표가 붙은 열쇠 세 개.');
    else if(t==='torch'){S.torch=!S.torch;save();renderTools();applyTorch()}
    else{S.held=S.held===t?null:t;save();renderTools()}
  });
}
function go(v){if(!canView(v))return;S.v=v;if(isRoom(v)){S.here=v;ana('location_opened',{location:v,minutes_used:anaMinutes()})}else if(v[0]==='p')anaChapter('chapter_opened',+v.slice(1));save();render(true);scrollTo({top:0,behavior:'smooth'})}

// ── 일지 ──────────────────────────────
// [시각, 장소, 이상 유무(true=이상 있음), 비고]
// ==== 일지·배치도 그리기 ====
function logDay(date,weather,rows,foot,cls){
  return `<div class="${cls||''}">
    <div class="meta"><span>일자<b>${date}</b></span><span>날씨<b>${weather}</b></span><span>숙직자<b>한봉수</b></span></div>
    <div class="rows">
      <div class="th">시각</div><div class="th">순찰 장소</div><div class="th">이상 유무</div><div class="th memo">비고</div>
      ${rows.map(([t,p,bad,m])=>`<div>${t}</div><div>${p}</div><div class="st${bad?' bad':''}">${bad?'이상 있음':'이상 없음'}</div><div class="memo">${m||''}</div>`).join('')}
    </div>
    <div class="foot"><div>${foot||''}</div><div class="sign">확인<b>한</b></div></div>
  </div>`;
}
function logSheet(date,weather,rows,foot,dark){
  return `<article class="log turn${dark?' dk':''}">
    <h3>숙직 일지</h3>
    ${logDay(date,weather,rows,foot)}
    ${dark?'<div class="dark"><span>정전. 일지가 하나도 안 보인다.</span></div>':''}
  </article>`;
}
function page1(){
  return logSheet('1999년 2월 22일 (월)','눈',[
    ['21:00','숙직실',false,'난로에 기름 채움'],
    ['21:00','교무실',false,'창문 잠금 확인'],
    ['23:00','교실',false,''],
    ['23:00','음악실',true,'시끄러운 풍금 소리. 가 보니 아무도 없음'],
    ['01:00','복도',true,'계속 발소리가 따라옴. 젖은 발자국 셋'],
    ['01:00','현관',false,'빗장 확인'],
    ['03:00','종탑',true,'뒤뜰 종 줄이 혼자 흔들림'],
  ],'열쇠꾸러미는 애들 손 안 타게 딴 데 숨김. 잊어버릴까 봐 오늘 기록에 몰래 적어 둠.')+answerRow(1);
}
function page2(){
  return logSheet('1999년 2월 23일 (화)','흐림',[
    ['21:00','숙직실',false,''],
    ['21:00','교무실',true,'캐비닛 번호를 교감 선생님이 또 바꿔 놓고 가심. 손전등이 그 안에 있는데. 적어 둔 데가 있다나'],
    ['23:00','교실',true,'불이 켜져 있음. 가 보니 꺼짐. 문은 잠겨 있었다'],
    ['01:00','복도',false,''],
    ['03:00','종탑',true,'종이 한 번 울림'],
  ],'은수 어머니 전화. 전학 서류 이야기.')+answerRow(2);
}
function page3(){
  return logSheet('1999년 2월 24일 (수)','눈 · 정전',[
    ['21:00','숙직실',true,'정전. 캐비닛에서 손전등 꺼냄'],
    ['23:00','교실',true,'불도 안 들어오는데 웃음소리. 가 보니 아무도 없음. 칠판에 뭐라고 써 있었는데 어두워서 못 읽음'],

function answerBox(p,pg,nav){

}

      ['d3','🪑','창가 뒤 책상',()=>({t:'창가 뒤 책상',h:'<p>창밖, 뒤뜰 너머로 <b>종탑</b>이 검게 서 있다.</p><p>책상 귀퉁이에 색연필로 그린 작은 종 그림.</p>'})],
    ]},
};
function pageRoom(id){
  const R=ROOMS[id],dark=R.dark;
  return `<section class="room turn">
    <h2>📍 ${ROOM_NAME[id]}</h2>
    <p class="desc">${R.desc}</p>
    <div class="${dark?'dk':''}">
      <div class="things">${R.things().map(([tid,ic,nm])=>`<button class="thing" data-t="${tid}"><span class="ic">${ic}</span>${nm}</button>`).join('')}</div>
      ${dark?'<div class="dark"><span>너무 어둡다. 아무것도 안 보인다.</span></div>':''}
    </div>
    ${R.after?R.after():''}
    <div class="nav"><button data-go="map">← 배치도</button><button data-go="p${frontier()}">일지 펼치기 →</button></div>
  </section>`;
}
function cabinet(){
  if(S.solved[2])return `<section class="lock open"><h3>철제 캐비닛 · 열림</h3><div class="msg">안은 비었다. 손전등과 「교실」 열쇠는 이미 챙겼다.</div></section>`;
  return `<section class="lock" id="lock"><h3>철제 캐비닛 · 3자리 번호자물쇠</h3>
    <div class="dials">${S.cab.map((d,i)=>`<div class="dial"><span style="font-family:var(--hand);font-size:20px;color:var(--crayon);line-height:1.2">${'동미은'[i]}</span><button data-i="${i}" data-d="1" aria-label="${i+1}번째 숫자 올리기">▲</button><b>${d}</b><button data-i="${i}" data-d="-1" aria-label="${i+1}번째 숫자 내리기">▼</button></div>`).join('')}</div>
    <button class="pull" id="pull">당기기</button><div class="msg" id="lockMsg"></div></section>`;
}
function bindCabinet(){
  const lk=$('#lock');if(!lk)return;
  lk.querySelectorAll('.dial button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.cab[i]=(S.cab[i]+(+b.dataset.d)+10)%10;b.parentNode.querySelector('b').textContent=S.cab[i];save()});
  $('#pull').onclick=()=>{
    const code=S.cab.join(''),ans=PAGES[2].code,m=$('#lockMsg');
    if(code===ans){
      ana('puzzle_tried',{puzzle:'chapter_2',outcome:'solved',attempt:(S.wrong[2]||0)+1,minutes_used:anaMinutes()});anaChapter('chapter_solved',2);
      S.solved[2]=ans;S.open=Math.max(S.open,3);S.tools.torch=true;NEWTOOL='torch';openRoom('class');save();
      render(false);toast('캐비닛이 열렸다. 손전등과 「교실」 열쇠를 챙겼다.');return}
    S.wrong[2]=(S.wrong[2]||0)+1;ana('puzzle_tried',{puzzle:'chapter_2',outcome:'wrong',attempt:S.wrong[2],minutes_used:anaMinutes()});save();
    m.textContent=code==='436'?'지각까지 센 것 같다.':sameDigits(code,ans)?'숫자는 맞는 것 같은데… 순서가 아닌가?':'철컥거리기만 하고 안 열린다.';
    lk.classList.remove('shake');void lk.offsetWidth;lk.classList.add('shake');
  };
}

// ── 음악실: 풍금. ★ 건반이 1. 악보대의 5 3 3 4 2 2를 치면 서랍이 열린다 ──
const STAR=2,TUNE=[5,3,3,4,2,2].map(n=>STAR+n-1);
let played=[];
function kidsNote(){
  return `<p>서랍 안에 접힌 공책 종이 한 장.</p>
  <div class="paper" style="font-family:var(--hand);font-size:22px;line-height:1.45;color:var(--crayon)">봉수 아저씨 미안해요.<br>풍금도 불도 종도 우리가 그랬어요.<br>귀신 나오는 학교면 안 없앨까 봐서요.<br><br>우리 신호<br>미래 — 끝종<br>동민 — 모임종<br>은수 — 비밀! (아저씨는 알지?)<br>다 모이면 번호 순서대로!</div>
  <p>그 아래 검은 볼펜으로 한 줄. <span class="hand">알고 있었다. — 봉수</span></p>`;
}
function organ(){
  return `<section class="organ"><h3>풍금 건반</h3>
    <div class="keys">${Array.from({length:8},(_,i)=>`<button class="key" data-k="${i}" aria-label="${i+1}번째 건반${i===STAR?' (별 표시)':''}">${i===STAR?'<span class="star">★</span>':''}</button>`).join('')}</div>
    <div class="msg" id="organMsg">${S.drawer?'풍금 위 서랍이 열려 있다.':''}</div></section>`;
}
function bindOrgan(){
  played=[];
  document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{
    if(S.drawer){$('#organMsg').textContent='♪';return}
    played=[...played,+k.dataset.k].slice(-TUNE.length);
    $('#organMsg').textContent='♪ '.repeat(played.length);
    if(played.join()===TUNE.join()){
      S.drawer=true;save();
      setTimeout(()=>{render(false);showM('풍금 위 서랍',`<p>마지막 음이 끝나자 풍금 위에서 딸깍 소리가 난다. 서랍이 조금 밀려 나와 있다.</p>${kidsNote()}`)},350);
    }
  });
}

// ── 종탑: 줄을 당긴 횟수를 묶음으로 센다. 1.5초 쉬면 한 묶음 ──
const PEAL=[4,2,3];
let peal=[],cur=0,pealT=null;
function rope(){
  return `<section class="rope" id="rope"><h3>종 줄</h3>
    <button class="pull" id="pullRope">줄 당기기</button>
    <div class="rings" id="rings"></div>
    <div class="msg" id="ropeMsg"></div></section>`;
}
function bindRope(){
  peal=[];cur=0;clearTimeout(pealT);
  const show=()=>{$('#rings').innerHTML=[...peal,...(cur?[cur]:[])].map(n=>'땡'.repeat(n)).join('<i>·</i>')};
  $('#pullRope').onclick=()=>{
    cur++;show();$('#ropeMsg').textContent='';clearTimeout(pealT);
    pealT=setTimeout(()=>{
      peal.push(cur);cur=0;show();
      if(peal.join()===PEAL.join()){ana('puzzle_tried',{puzzle:'chapter_6',outcome:'solved',attempt:(S.wrong[6]||0)+1,minutes_used:anaMinutes()});finish();return}
      if(peal.length>=PEAL.length){
        S.wrong[6]=(S.wrong[6]||0)+1;ana('puzzle_tried',{puzzle:'chapter_6',outcome:'wrong',attempt:S.wrong[6],minutes_used:anaMinutes()});save();
        $('#ropeMsg').textContent=sameDigits(peal.join(''),PEAL.join(''))?'세 사람 종소리 같기는 한데… 순서가 아닌가?':'종소리가 빗속으로 흩어진다. 아무 일도 없다.';
        peal=[];setTimeout(show,1600);
      }else if(peal.length===1&&peal[0]===3){
        $('#ropeMsg').textContent='시작종. 매일 밤 울리던 소리다.';
      }
    },1500);
  };
}
// 사건 대장에 보일 내 기록 (hn.clear.noteNN: 깼는지, 가장 빠른 시간, 마지막 시간)
// ==== 결말·렌더 ====
function record(ms,ok=true){try{const k='hn.clear.note03',p=JSON.parse(localStorage.getItem(k)||'{}');localStorage.setItem(k,JSON.stringify({ok:ok||!!p.ok,best:ok?Math.min(p.best||Infinity,ms):p.best||null,last:ms,at:Date.now()}))}catch{}}
function finish(){
  anaChapter('chapter_solved',6);
  S.solved[6]='4-2-3';S.done=true;S.open=LAST;save();record(S.ms);
  ana('case_finished',{grade:'solved',points:1,clue_count:6,clue_total:6,minutes_used:anaMinutes(),play_minutes:anaMinutes()});
  $('#ropeMsg').textContent='종소리가 멎자, 빗속에서 불빛 하나가 다가온다.';
  $('#pullRope').disabled=true;
  setTimeout(()=>{S.v='end';save();render(true)},2200);
}

// ── 표지 · 끝 ──────────────────────────────
function pageCover(){
  return `<section class="cover turn">
    <div class="label"><h2>숙직 일지</h2><div>은하국민학교 은하분교장</div><div class="who">숙직자: 한봉수</div></div>
    <p class="story">비 오는 밤, 캠핑장으로 고칠 폐교를 보러 왔다가 숙직실에서 비를 피했다. 바람에 문이 쾅 닫히더니, 밖에서 빗장이 걸리는 소리가 났다. 창에는 쇠창살. 교무실로 통하는 쪽문이 하나 더 있지만 그것도 잠겨 있다.<br>책상 위에는 표지가 눅눅한 일지 한 권. 첫 장에 이렇게 적혀 있다.</p>
    <div class="rules">매일 밤 9시부터 두 시간마다 순찰하고 이상 유무를 적을 것.</div>
    <button class="btn go" id="start">${S.started?'이어서 펼치기':'일지 펼치기'}</button>
    <div class="proto">시제품 · 진행 상황은 이 브라우저에 저장돼요</div>
  </section>`;
}
function pageEnd(){
  const h=hintTotal(),ansHints=Object.values(S.hints).filter(n=>n>=3).length;
  const grade=h===0?'숙직 교사':ansHints===0?'순찰 대원':'비 피한 손님';
  return `<article class="log turn result">
    <p class="big">쇠사슬 풀리는 소리.</p>
    <div class="seal">${grade}</div>
    <dl>
      <div><dt>걸린 시간</dt><dd>${fmt(S.ms)}</dd></div>
      <div><dt>힌트</dt><dd>${h}장</dd></div>
      <div><dt>틀린 답</dt><dd>${wrongTotal()}번</dd></div>
    </dl>
    <p>현관 유리문 너머로 등불이 흔들린다. 우비를 걸친 노인이 숨을 몰아쉬며 서 있다. 등불을 들어 얼굴을 비춰 보더니, 한참 말이 없다.</p>
    <div class="paper" style="font-family:var(--hand);font-size:24px;line-height:1.4;color:var(--pen);background:#fffdf4;border-left:3px solid #6b604a;padding:10px 14px;max-width:540px">“애들이 다 온 줄 알았지.”</div>
    <p>한봉수 씨는 학교가 문을 닫은 뒤로도 스물일곱 해 동안 밤마다 종탑에 올라 시작종을 쳤다. 작별 인사 없이 떠난 은수가 언젠가 그 소리를 듣고 찾아올까 봐. 숙직 일지는 오늘 밤에도 이어진다. 맨 아래 비고 칸이 비어 있다.</p>
    <div class="row"><button class="btn" id="again">처음부터 다시</button><a class="btn primary" href="../../" style="text-decoration:none">사건 대장으로</a></div>
  </article>`;
}

// ── 렌더 ──────────────────────────────
function view(){
  const v=S.v;
  if(v==='cover')return pageCover();
  if(v==='map')return pageMap();
  if(v==='end')return pageEnd();
  if(isRoom(v))return pageRoom(v);
  return [null,page1,page2,page3,page4,page5,page6][+v.slice(1)]();
}
function render(anim){
  if(!canView(S.v))S.v='cover';
  renderTabs();renderStats();
  const pg=$('#page');pg.innerHTML=view();
  if(!anim)pg.querySelectorAll('.turn').forEach(e=>e.classList.remove('turn'));
  pg.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(S.v==='cover')$('#start').onclick=()=>{if(!S.started){ana('case_started');S.started=true;S.open=1}go('p'+frontier())};
  const f=$('#pw');if(f)f.onsubmit=e=>{e.preventDefault();check(+S.v.slice(1))};
  if(S.v==='map')pg.querySelectorAll('.rm').forEach(g=>{
    const enter=()=>{const r=g.dataset.r;
      if(!S.rooms[r]&&r==='store'&&S.tools.key&&S.open<4){toast('창고 열쇠가 맞긴 한데, 지금 창고에 볼 일은 없다.');return}
      if(!S.rooms[r]&&r==='store'&&S.rooms.hall&&S.tools.key){openRoom('store','열쇠꾸러미의 「창고」 열쇠로 창고 문을 열었다.');render(false);return}
      if(S.rooms[r])go(r);else toast(`${ROOM_NAME[r]}. 잠겨 있다.`)};
    g.onclick=enter;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}}});
  if(isRoom(S.v)){
    const R=ROOMS[S.v];
    pg.querySelectorAll('.thing').forEach(b=>b.onclick=()=>{
      if(R.dark&&!S.torch){showM('…','<p>너무 어두워서 손에 닿는 것만 겨우 느껴진다. 빛이 있어야겠다.</p>');return}
      const th=R.things().find(t=>t[0]===b.dataset.t),r=th[3]();
      showM(r.t,r.h);
      if(S.v==='duty')render(false);   // 열쇠·쪽문 상태 반영
    });
    if(S.v==='office')bindCabinet();
    if(S.v==='music')bindOrgan();
    if(S.v==='bell')bindRope();
  }
  if(S.v==='end'){
    $('#again').onclick=()=>{if(confirm('처음부터 다시 할까요? 지금 기록은 지워져요.')){ana('case_restarted');S=fresh();save();render(true)}};
  }
  renderTools();applyTorch();
}

// 손전등: 켜면 .dk 위 어둠에 구멍이 뚫리고 포인터를 따라간다 (터치는 끌면 따라오고, 그동안 스크롤은 잠긴다)
function applyTorch(){
  document.querySelectorAll('.dk').forEach(el=>{
    el.classList.toggle('torch',S.torch);
    const mv=e=>{const b=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-b.left)+'px');el.style.setProperty('--my',(e.clientY-b.top)+'px')};
    el.onpointermove=el.onpointerdown=S.torch?mv:null;
    el.style.setProperty('--r',Math.round(Math.min(130,Math.max(80,el.clientWidth*.2)))+'px');
  });
}

// ==== 정답 판정 ====
function check(p){
  const inp=$('#ans'),v=norm(inp.value),pg=PAGES[p],msg=$('#msg');
  if(!v)return;
  if(v===norm(pg.ans)||(pg.alt||[]).some(a=>norm(a)===v)){
    ana('puzzle_tried',{puzzle:'chapter_'+p,outcome:'solved',attempt:(S.wrong[p]||0)+1,minutes_used:anaMinutes()});anaChapter('chapter_solved',p);
    S.solved[p]=pg.ans;S.open=Math.max(S.open,p+1);
    if(p===5)S.rooms.bell=true;
    save();render(false);
    toast(p===5?'올해다. 일지 뒤표지 안쪽에서 녹슨 열쇠가 떨어졌다. 「종탑」.':`${p+1}장이 열렸다.`);
    if(p===5)NEWROOM='bell';
    return;
  }
  S.wrong[p]=(S.wrong[p]||0)+1;ana('puzzle_tried',{puzzle:'chapter_'+p,outcome:'wrong',attempt:S.wrong[p],minutes_used:anaMinutes()});save();
  const a=norm(pg.ans),said=pg.say&&pg.say[v];
  const near=(pg.near||[]).includes(v)||(a.length>=3&&lev(v,a)<=1);
  msg.className='msg'+(near&&!said?' near':'');
  msg.textContent=said||(near?'거의 맞았다. 조금만 더…':['아닌 것 같다.','일지를 다시 읽어 보자.','다른 데를 봐야 하나.'][S.wrong[p]%3]);
  $('#pw').classList.remove('shake');void $('#pw').offsetWidth;$('#pw').classList.add('shake');
  inp.select();
}

// ── 모달 · 힌트 ──────────────────────────────
function showM(title,html){
  $('#modal').innerHTML=`<h2>${title}</h2>${html}<div class="actions"><button class="btn" id="mclose">닫기</button></div>`;
  $('#mbg').classList.add('on');$('#mclose').onclick=closeM;
}
// ==== 힌트·모달 ====
function openHint(){
  const p=hintPage(),pg=PAGES[p];if(!pg||!pg.hints||S.done)return;
  const got=S.hints[p]||0;
  $('#modal').innerHTML=`<h2>${pg.tab} 힌트</h2><div class="sub">지금 풀고 있는 장의 힌트예요. 한 장씩 떼어 볼 수 있고, 세 번째 장엔 정답이 있어요.</div>
    <div class="posts">${pg.hints.map((h,i)=>i<got?`<div class="post"><small>포스트잇 ${i+1}</small>${h}</div>`
      :i===got?`<button class="post closed" id="peel">포스트잇 ${i+1} 떼어 보기${i===2?' (정답)':''}</button>`
      :`<div class="post closed">포스트잇 ${i+1}</div>`).join('')}</div>
    <div class="actions"><button class="btn" id="mclose">닫기</button></div>`;
  $('#mbg').classList.add('on');
  $('#mclose').onclick=closeM;
  const pe=$('#peel');if(pe)pe.onclick=()=>{S.hints[p]=got+1;ana('hint_revealed',{chapter:p,level:got+1,minutes_used:anaMinutes()});save();renderStats();openHint()};
}
function closeM(){$('#mbg').classList.remove('on')}
$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#btnHint').onclick=openHint;
addEventListener('resize',applyTorch);

ana('case_intro_viewed');
if(resumed)ana('case_resumed',{clue_count:Object.keys(S.solved).length,minutes_used:anaMinutes()});
render(true);
</script>
</body>
</html>
