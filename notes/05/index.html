<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{
  --desk:#1d1b1f;--pad:#fbf2a6;--pline:#a9c3e0;--margin:rgba(214,69,65,.55);--lh:32px;--ml:56px;--binding:#5a1f2a;
  --ink:#1f1c18;--dim:#6b6358;--stamp:#a3312a;--pen:#151515;--seri:#c4261c;--log:#f3ead2;
  --hs:clamp(19px,5vw,24px);
  --mono:"Kkakdugi Drafting",monospace;--serif:"LevelUp",serif;--hand:"HEEJOY",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:"Kkakdugi Drafting",system-ui,sans-serif;font-size:15px;line-height:1.6}
@media(max-width:640px){:root{--ml:26px}}
button{font-family:inherit;cursor:pointer;color:inherit}

/* 리갈패드 바탕 (시리즈 공통 틀, 이번엔 자주색 제본) */
.app{max-width:900px;min-height:100vh;margin:0 auto;padding:0 22px 56px calc(var(--ml) + 22px);background-color:var(--pad);
  background-image:linear-gradient(90deg,transparent calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 4px),transparent calc(var(--ml) - 4px),transparent var(--ml),var(--margin) var(--ml),var(--margin) calc(var(--ml) + 1px),transparent calc(var(--ml) + 1px)),
    repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--pline) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0,0 6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.app::before{content:"";display:block;height:34px;margin:0 -22px 22px calc(-1 * (var(--ml) + 22px));background:linear-gradient(#7a2c3a,var(--binding) 70%,#3a131b);box-shadow:0 3px 0 rgba(0,0,0,.12)}
@media(max-width:640px){.app{padding:0 12px 40px calc(var(--ml) + 12px)}.app::before{margin:0 -12px 18px calc(-1 * (var(--ml) + 12px))}}
body.hasbag .app{padding-bottom:120px}

header.hud{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--hand);font-size:40px;letter-spacing:-.5px;line-height:1.05}
.brand .t{background:linear-gradient(transparent 60%,rgba(90,31,42,.25) 60% 88%,transparent 88%)}
.brand .back{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px}
.brand .back:hover{color:var(--ink)}
.brand small{display:block;font-family:var(--serif);font-size:14px;color:var(--dim);margin-top:4px}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;line-height:1.3;padding:0 4px}
.stat b{color:var(--ink);font-size:20px;border-bottom:1px solid var(--ink);min-width:62px}
.btn{white-space:nowrap;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:7px 13px;font-size:14px;font-weight:700}
.btn:hover{background:var(--ink);color:#fffdf4}
.btn.primary{background:var(--ink);color:#fffdf4}
.btn.primary:hover{background:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}

/* 탭 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding-left:14px;position:relative;z-index:1;margin-bottom:-4px}
.tab{border:none;color:#5a2a30;padding:7px 14px 9px;font-size:13px;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.12);opacity:.85;background:#ecd6cf}
.tab:hover{opacity:1}
.tab.on{opacity:1;padding-top:12px;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.tab.map{background:#d6dbe4;color:#2f3a4a}
.tab:disabled{background:#e6e0d6;color:#a0968a;font-weight:400;cursor:not-allowed;opacity:.8}
.tab .ok{color:#2b7a52;margin-left:3px}

/* 상영 일지: 윤 기사 = 검정 만년필 손글씨, 구청 공문 = 명조 인쇄. 박 여사 = 파란 글씨(OHP 시트) */
.log{position:relative;max-width:680px;background:var(--log);padding:16px 18px 14px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 16px 30px -14px rgba(40,20,20,.55)}
.log h3{margin:0;text-align:center;font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:10px;color:#3d3628}
.log .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-family:var(--serif);font-size:12.5px;color:#6b604a;border-bottom:2px solid #6b604a;padding:10px 0 6px;margin-bottom:6px}
.log .meta b{font-family:var(--hand);font-weight:400;font-size:calc(var(--hs) * 1.02);color:var(--pen);margin-left:5px}
.log .k{font-family:var(--hand);font-size:var(--hs);line-height:1.38;color:var(--pen);margin:6px 0 0;padding-bottom:4px;border-bottom:1px solid #d9cdb0}
.log .s{display:inline-block;font-family:var(--mono);font-weight:700;font-size:17px;line-height:1.5;color:var(--seri);margin:12px 0 2px 14px;padding:4px 10px 4px 12px;border-left:5px solid var(--seri);background:rgba(196,38,28,.06);transform:rotate(-1.2deg);letter-spacing:.4px}
.log .s + .s{display:block;width:max-content;max-width:90%;margin-top:6px;transform:rotate(.8deg)}
.log .g{font-family:var(--serif);font-size:13.5px;line-height:1.75;color:#2a2a2a;background:#fbf8ef;border:1px solid #9a9182;padding:8px 12px 9px;margin:6px 0 8px;box-shadow:2px 2px 0 #cfc4ab}
.log .g b{display:block;letter-spacing:8px;text-align:center;font-size:14px;margin-bottom:2px}
.log .sign{text-align:right;font-family:var(--serif);font-size:12px;color:#6b604a;margin-top:10px}

/* 방 */
.room{max-width:680px;margin-top:18px;background:#1b181a;color:#e9e1d2;padding:12px 12px 14px;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.room h2{margin:0 0 8px;font-family:var(--serif);font-size:18px;font-weight:800;color:#f2ead5;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.room h2 small{font-family:var(--mono);font-size:12px;color:#a59b8a;font-weight:400}
.scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;background:#000}
.scene text{font-family:"Kkakdugi Drafting",sans-serif}
.scene.h-loupe{cursor:zoom-in}
/* 어두운 방에서는 손가락으로 끌어 손전등을 움직인다. 페이지 스크롤은 일지·여백에서 */
.scene.dk{touch-action:none}
.scene [data-t]:hover{filter:brightness(1.12)}
.item .spark{animation:spark 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}}
.edge{margin-top:8px;font-family:var(--mono);font-size:13px;color:#b9ae9c}
.edge b{font-family:var(--mono);font-size:20px;color:#fff3c4;letter-spacing:6px;margin-left:8px;background:#2b2622;padding:1px 10px;border-top:3px dotted #8a8178;border-bottom:3px dotted #8a8178}

/* 장치 · 확대해 보기 */
.dev{margin-top:12px;background:var(--log);color:var(--ink);padding:12px 14px 16px}
.dev.dk{background:#0f0e11;color:#e9e1d2;border:1px solid #3a3438}
.dev .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:15px;margin-bottom:10px}
.dev .x{background:none;border:1.5px solid currentColor;font-weight:700;padding:1px 10px;border-radius:2px}
.dev svg{display:block;width:100%;height:auto;max-width:440px;margin:0 auto}
.dev svg.drag{touch-action:none}
.drow{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dev.dk .btn{color:#e9e1d2;border-color:#e9e1d2}
.dev.dk .btn.primary{background:#e9e1d2;color:#111}
.paper{background:#fbf8ef;border:1px solid #b6ab95;padding:14px 16px;font-family:var(--serif);font-size:15px;line-height:1.8;max-width:440px;margin:0 auto;box-shadow:2px 3px 0 #cfc4ab}
.paper h4{margin:0 0 6px;font-size:13px;letter-spacing:4px;color:#6b604a;font-weight:700}
.paper .big{font-size:26px;font-weight:800;letter-spacing:2px;line-height:1.3}
.paper .hand{font-family:var(--hand);font-size:var(--hs);color:var(--pen);line-height:1.35;margin:4px 0}
.paper s{color:#555}
.poster{background:#e9d6a3;text-align:center;border:3px solid #3a1a1a}
.dials{display:flex;gap:16px;justify-content:center}
.dial{display:flex;flex-direction:column;align-items:center;gap:5px}
.dial b{font-family:var(--mono);font-size:40px;background:#fffdf4;border:2px solid var(--ink);width:60px;text-align:center;line-height:1.35}
.dial button{width:60px;padding:5px 0;border:1.5px solid var(--ink);background:#e8dcb8;font-weight:700}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw button{border:2px solid #2a2a2a;background:#3a3a3e;color:#cfc8bb;padding:12px 4px 10px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:4px}
.sw button .lamp{width:22px;height:22px;border-radius:50%;background:#1d1d20;border:2px solid #777}
.sw button em{font-style:normal;font-size:12px;font-weight:400}
.sw button.on{background:#fff1b8;color:#1f1c18;border-color:#b98a12}
.sw button.on .lamp{background:#ffcf33;border-color:#b98a12;box-shadow:0 0 12px #ffcf33}
.sw button.on em{font-weight:700}
@media(max-width:420px){.sw{grid-template-columns:repeat(2,1fr)}}
.scr{text-align:center;font-family:var(--serif);font-size:12px;letter-spacing:10px;background:#d8d0bd;color:#3a332a;margin:0 auto 14px;max-width:420px;padding:2px 0}
.seatgrid{display:grid;grid-template-columns:repeat(6,1fr) 10px repeat(6,1fr);gap:4px 3px;max-width:420px;margin:0 auto}
.seat{aspect-ratio:1/1;border:none;border-radius:6px 6px 2px 2px;background:#a12d3c;box-shadow:inset 0 -5px 0 #651722;padding:0;min-width:0}
.seat:hover{background:#c23a4b}
.seat.folded{background:#3c2b2e;box-shadow:inset 0 4px 0 #651722}
.kpd{max-width:240px!important;background:#050505;padding:6px;border-radius:4px}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:12px}
.keys button{height:50px;font-family:var(--mono);font-size:21px;font-weight:700;background:#3a3f46;color:#eee;border:none;border-radius:6px;box-shadow:inset 0 -4px 0 #22262b}
.keys button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #22262b}
.memo .hand{font-family:var(--hand);font-size:var(--hs);line-height:1.38;color:var(--pen);margin:0 0 6px}
.memo .hand.r{text-align:right}
.memo label{display:block;font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-top:14px}
.memo textarea{width:100%;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--seri);background:#fffdf6;border:none;border-bottom:3px solid var(--seri);padding:6px 8px;resize:vertical;outline:none}

.nav{max-width:680px;display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-family:var(--mono);font-size:13px}
.nav button{background:none;border:none;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.nav button:hover{color:var(--ink);border-color:var(--ink)}

/* 배치도 */
.newtag{position:absolute;top:-8px;right:12px;background:#b3261e;color:#fff;font-family:var(--mono);font-size:12px;padding:2px 8px;transform:rotate(3deg)}
.plan{max-width:680px;background:#1f2a33;color:#d9e2e6;padding:16px 16px 12px;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.plan h3{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:#93a6b2;font-weight:400}
.plan svg{display:block;width:100%;height:auto}
.plan svg text{font-family:"Kkakdugi Drafting",sans-serif}
.plan .rm.open{cursor:pointer}
.plan .rm.fresh rect{animation:fresh 1.2s ease-in-out 3}
@keyframes fresh{50%{fill:#6b8fa3}}
.fdrag{position:fixed;z-index:99;font-size:30px;pointer-events:none;transform:translate(-50%,-60%)}
.slot[data-b="film"]{touch-action:none}
.mapbtn{float:right;font:inherit;font-family:var(--mono);font-size:13px;background:#d6dbe4;color:#2f3a4a;border:none;padding:4px 10px;cursor:pointer;margin-top:2px}
.plan .rm.open:hover rect{fill:#3a5466}
.plan .legend{font-family:var(--mono);font-size:11.5px;color:#93a6b2;margin-top:6px}

/* 표지 */
.cover{max-width:680px;background:#2a1418;color:#efe3d4;padding:34px 30px 30px;position:relative;box-shadow:0 18px 32px -14px rgba(0,0,0,.6);border-left:14px solid #5a1f2a;overflow:hidden}
.cover .ticket{background:#efe2bf;color:var(--ink);padding:14px 18px 12px;max-width:310px;box-shadow:0 2px 4px rgba(0,0,0,.35);border-left:2px dashed #8a7a5a;position:relative}
.cover .ticket h2{margin:0;font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:6px}
.cover .ticket div{font-family:var(--serif);font-size:13.5px;color:#6b4a3a;margin-top:4px}
.cover .ticket .who{font-family:var(--hand);font-size:24px;color:var(--pen)}
.cover .story{font-family:var(--serif);font-size:15px;line-height:1.85;margin:22px 0 0;max-width:540px}
.cover .rules{background:var(--log);color:var(--pen);font-family:var(--hand);font-size:24px;line-height:1.3;padding:12px 16px;margin-top:16px;max-width:440px;transform:rotate(-.8deg);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.cover .go{margin-top:22px;background:#efe3d4;color:#2a1418;border:none;font-weight:800;padding:10px 20px;font-size:15px}
.cover .go:hover{background:#fff}
.cover .exit{position:absolute;right:18px;top:18px;background:#1f9a48;color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;padding:4px 10px;letter-spacing:2px;box-shadow:0 0 18px rgba(40,200,90,.55)}
.proto{font-family:var(--mono);font-size:11.5px;color:#b3a296;margin-top:16px}
@media(max-width:480px){.cover{padding:56px 18px 24px}}

/* 결과 */
.result{max-width:680px;background:var(--log);padding:22px 22px 18px;box-shadow:0 16px 30px -14px rgba(40,20,20,.55)}
.result .big{font-family:var(--hand);font-size:42px;line-height:1.1;margin:0 0 10px}
.result .seal{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:3px;padding:4px 14px;transform:rotate(-7deg);margin:6px 0 16px;mix-blend-mode:multiply}
.result dl{font-family:var(--mono);font-size:14px;margin:0;max-width:340px}
.result dl div{display:flex;border-bottom:1px dotted #c9b9a0;padding:5px 0}
.result dt{width:110px;color:var(--dim)}.result dd{margin:0}
.result p{font-family:var(--serif);font-size:14.5px;line-height:1.85;max-width:560px}
.result .reply{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--seri);border-left:5px solid var(--seri);padding:2px 0 2px 12px}
.result .later{font-family:var(--mono);font-size:12.5px;color:var(--dim);border-top:1px dashed #b9a98f;padding-top:10px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* 소지품 */
.bag{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.bag .in{pointer-events:auto;display:flex;align-items:center;gap:6px;background:#3a161d;padding:9px 14px 11px;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.35);border:2px dashed rgba(239,227,212,.35);border-bottom:none}
.bag .lbl{font-family:var(--hand);font-size:22px;color:#efe3d4;margin-right:4px}
.slot{position:relative;width:46px;height:46px;border-radius:7px;border:1.5px dashed rgba(239,227,212,.35);background:transparent;padding:4px;transition:transform .15s}
.slot:disabled{cursor:default}
.slot.has{background:#f3ead2;border:1.5px solid #f3ead2}
.slot.on{background:#ffe680;border-color:#c9a04a;transform:translateY(-8px) rotate(-5deg);box-shadow:0 6px 10px rgba(0,0,0,.3)}
.slot svg{width:100%;height:100%;display:block}
.slot i{position:absolute;right:-4px;top:-6px;background:#c4261c;color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center}
.slot.new{animation:pop .5s 4}
.slot.book.unread::after{content:'';position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:#c4261c;border:2px solid #f3ead2}
.bookhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.bookhd span{font-family:var(--mono);font-size:13px;color:var(--dim)}
.bookft{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.modal .log{box-shadow:none;padding:12px 6px 6px}.modal .plan{padding:12px}
@keyframes pop{50%{transform:scale(1.25) rotate(-5deg)}}
@media(max-width:420px){.bag .lbl{display:none}.slot{width:37px;height:37px;padding:3px}.bag .in{gap:4px;padding:7px 8px 9px}}

/* 모달 · 힌트 */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,18,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--log);max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px 20px;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.modal h2{font-family:var(--serif);font-weight:800;margin:0 0 8px;font-size:20px}
.modal .sub{font-size:13px;color:var(--dim);margin-bottom:14px}
.posts{display:flex;flex-direction:column;gap:12px}
.post{background:#fff3a0;padding:10px 14px;font-family:var(--hand);font-size:22px;line-height:1.3;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.post:nth-child(2){background:#ffd6e0;transform:rotate(.6deg)}.post:nth-child(3){background:#cfeaff;transform:rotate(-.6deg)}
.post small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim)}
.post.closed{background:#ebe3d0;color:var(--dim);font-family:inherit;font-size:14px;border:none;text-align:left}
.modal .actions{display:flex;justify-content:flex-end;margin-top:16px}

.turn{animation:turn .45s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(26px) rotate(.8deg)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fffdf4;padding:10px 18px;font-size:14px;line-height:1.5;opacity:0;transition:.25s;pointer-events:none;z-index:60;width:max-content;max-width:min(560px,90vw);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.smear{color:#8a7f70!important;letter-spacing:1px}

  4:['열쇠 꾸러미로 지하 문을 여세요. 철망 자물쇠의 꼬리표, 계단 옆 클립보드, 철망 안 캔들, 바닥을 살펴보세요. 캔 라벨은 루페를 들고 철망을 눌러 읽어요.',

  return `<svg class="viewer${w.crank?' crank':''}" viewBox="0 0 470 110" aria-label="편집대 뷰어">${w.crank?[0,1,2,3].map(k=>`<g class="fr" style="animation-delay:${-k*.04}s">${frame(k,.65)}</g>`).join(''):frame(w.fi)}</svg>
    <div class="drow"><button class="btn" data-act="step"${w.crank?' disabled':''}>한 칸 넘기기 (${w.fi+1}/4)</button><button class="btn primary" data-act="crank">${w.crank?'손잡이 멈추기':'손잡이 빨리 돌리기'}</button></div>`}
function chartBase(){
  let s=`<rect width="356" height="362" fill="#efe6cf"/><rect x="60" y="4" width="236" height="16" fill="#7d766a"/><text x="178" y="16" text-anchor="middle" font-size="11" fill="#fff" letter-spacing="6">SCREEN</text>`;
  for(let i=0;i<12;i++)s+=`<text x="${46+i*24}" y="34" text-anchor="middle" font-size="9" fill="#5a5246">${i+1}</text>`;
  for(let r=0;r<14;r++){s+=`<text x="13" y="${77+r*19}" text-anchor="middle" font-size="11" fill="#3a332a" font-weight="700">${ROWS[r]}</text>`;for(let i=0;i<12;i++)s+=`<rect x="${36+i*24}" y="${66+r*19}" width="20" height="15" rx="3" fill="#cdbf9f"/>`}
  return s+corners('#a59a85');
}
function corners(c){return [[26,40,1,1],[330,40,-1,1],[26,354,1,-1],[330,354,-1,-1]].map(([x,y,a,b])=>`<path d="M${x} ${y+16*b} V${y} H${x+16*a}" stroke="${c}" stroke-width="3" fill="none"/>`).join('')}
const sheetT=w=>`translate(${w.dx} ${w.dy}) rotate(${w.rot} 178 197)`;
function sheetSvg(w){
  return `<g id="sheetG" transform="${sheetT(w)}" style="cursor:grab"><rect x="26" y="40" width="304" height="314" fill="rgba(170,205,240,.3)" stroke="#5f86b0" stroke-width="1.5"/>${corners('#111')}
    <text x="178" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f3f8f" font-family="Kkakdugi Drafting">↑ SCREEN 쪽이 위 — 박</text>
    ${[[0,8],[1,2],[2,6]].map(([r,s])=>`<circle cx="${46+(s-1)*24}" cy="${73.5+r*19}" r="11" fill="none" stroke="#111" stroke-width="2.8"/>`).join('')}
    <path d="M38 122.5 l16 16 m0 -16 l-16 16" stroke="#111" stroke-width="2.8"/>
    <text x="318" y="346" text-anchor="end" font-size="10.5" font-weight="700" fill="#1f3f8f" font-family="Kkakdugi Drafting">열쇠함 · 10. 10. 바꿈</text></g>`}
const paper=h=>`<div class="paper">${h}</div>`;
const LOCKT={1:'매표소 셔터 자물쇠',2:'열쇠함',4:'철망 자물쇠',8:'빗장 자물쇠'};
function wiringSvg(){
  const xt=i=>30+i*43,xb=i=>30+i*43;
  return `<svg viewBox="0 0 360 250"><rect width="360" height="250" fill="#efe6cf"/><text x="12" y="18" font-size="11" fill="#5a4a36">배선도 · 1998. 3. 고침</text>
    ${[0,1,2,3,4,5,6,7].map(i=>`<circle cx="${xt(i)}" cy="40" r="10" fill="#fffdf4" stroke="#3a2a1a" stroke-width="2"/><text x="${xt(i)}" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#3a2a1a">${i+1}</text>`).join('')}
    <g fill="none" stroke="#2a2420" stroke-width="2.2">${WMAP.map((b,i)=>`<path d="M${xt(i)} 50 C${xt(i)} 130 ${xb(b)} 120 ${xb(b)} 200"/>`).join('')}</g>
    ${WIRE.map((n,i)=>[1,3,5,6].includes(i)?'▒▒▒':n).map((n,i)=>`<rect x="${xb(i)-20}" y="200" width="40" height="34" fill="#fffdf4" stroke="#3a2a1a" stroke-width="1.5"/><text x="${xb(i)}" y="${n.length>3?214:221}" text-anchor="middle" font-size="9" fill="#3a2a1a">${n.length>3?`${n.split(' ')[0]}</text><text x="${xb(i)}" y="227" text-anchor="middle" font-size="9" fill="#3a2a1a">${n.split(' ')[1]||''}`:n}</text>`).join('')}
    <ellipse cx="300" cy="22" rx="40" ry="14" fill="#b8a27a" opacity=".55"/></svg>`}
function sectionSvg(){
  const C=[[90,'s','붉은 막'],[150,'t','흑막'],[210,'o','배경막'],[290,'x','흑막']];
  return `<svg viewBox="0 0 360 210"><rect width="360" height="210" fill="#e8dcc0"/><text x="180" y="18" text-anchor="middle" font-size="11" fill="#5a4a36">무대 단면도 (옆에서 본 것)</text>
    <path d="M20 170 H340 V40" stroke="#3a2a1a" stroke-width="3" fill="none"/><path d="M40 170 V182 H20" stroke="#3a2a1a" stroke-width="2" fill="none"/>
    <text x="24" y="198" font-size="8" fill="#5a4a36">객석</text><text x="336" y="198" text-anchor="end" font-size="8" fill="#5a4a36">뒷벽</text>
    <path d="M250 60 V170" stroke="#9a9182" stroke-width="5"/><text x="250" y="186" text-anchor="middle" font-size="8" fill="#5a4a36">스크린</text>
    ${C.map(([x,k,n])=>{const r=ROPE[k];return `<path d="M${x} 50 V170" stroke="#3a2a1a" stroke-width="2" stroke-dasharray="6 3"/><rect x="${x-11}" y="28" width="22" height="22" fill="${r.col}" stroke="#111" stroke-width="1.5"/><text x="${x}" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="${r.fg}">${r.sym}</text><text x="${x}" y="186" text-anchor="middle" font-size="8" fill="#5a4a36">${n}</text>`}).join('')}</svg>`}

  bus:{t:'옆문 유리에 붙은 종이',h:()=>paper(`<h4>별빛극장 앞 정류장</h4><div class="big">37번 막차</div><p>평일 23:40<br>토요일 23:25<br>일요일·공휴일 23:10</p>`)},
  notice:{t:'게시판 종이',h:()=>paper(`<h4>민원 처리 결과 회신 (2026. 11. 12.)</h4><p>신고 내용: 폐관을 앞둔 별빛극장 객석 쪽에서 밤마다 불빛이 깜빡임<br>처리 결과: 낮에 현장을 확인했으나 이상 없음</p><p style="text-align:right">구청 도시정비과</p>`)},
  receipt:{t:'벽에 꽂힌 종이',h:()=>paper(`<h4>전기 공사 내역서 · 1998. 3.</h4><p>1. 분전반 회로 새로 정리 · 배선도 새로 그림<br>&nbsp;&nbsp;&nbsp;배선도 아래 칸(왼쪽부터): 매표소 · 객석 통로 · 무대 · 지하 계단 · 로비 · 영사실 · 매점 · 객석등</p><p>2. 반입문 전기 잠금 새로 달기 · 무대 회로에서 끌어옴</p><p style="text-align:right">○○전기 · 별빛극장 귀중</p>`)},
  card:{t:'유리 밑 종이',h:()=>paper(`<h4>객석 호출등 신호 · 매표소 → 안내원</h4><p>짧게 ● = 1<br>길게 ▬ = 5<br>쉬는 데서 끊어 읽기<br>▶ 켜진 다음부터 · 줄 먼저, 번호 다음</p>`)},
  chart:{t:'좌석표',h:w=>`<svg id="chartSvg" class="drag" viewBox="0 0 356 362">${chartBase()}${w.on?sheetSvg(w):''}</svg>${w.on?`<div class="drow"><button class="btn" data-act="rot">시트 돌리기</button></div>`:''}`},
  lock:{t:()=>LOCKT[pageNo()],h:w=>`${pageNo()===4?`<p class="paper" style="max-width:240px;margin:0 auto 12px;font-family:var(--hand);font-size:var(--hs);transform:rotate(-2deg)">꼬리표: 번호 = 내 캔 — 윤</p>`:''}<div class="dials">${w.dial.map((d,i)=>`<div class="dial"><button data-act="dial" data-i="${i}" data-d="1" aria-label="${i+1}번째 칸 올리기">▲</button><b>${d}</b><button data-act="dial" data-i="${i}" data-d="9" aria-label="${i+1}번째 칸 내리기">▼</button></div>`).join('')}</div><div class="drow"><button class="btn primary" data-act="pull">당기기</button></div>`},
  panel:{t:'분전반',dk:true,h:w=>`<div class="sw">${w.brk.map((u,i)=>`<button data-act="brk" data-i="${i}" class="${u?'on':''}" aria-pressed="${!!u}"><span class="lamp"></span>${i+1}번<em class="${BRK[i].includes('▒')?'smear':''}">${BRK[i]}</em><em>${u?'▲ 올림':'▼ 내림'}</em></button>`).join('')}</div>`},
  wiring:{t:'분전반 옆에 붙은 배선도',h:()=>wiringSvg()},
  list:{t:'계단 옆 클립보드',h:()=>paper(`<h4>철거 반출 목록 · 지하 필름 캔</h4><p>반출일 <b>11. 18. (수) 07:00</b></p><p class="big" style="font-size:20px;letter-spacing:1px">314 ✓ &nbsp;311 ✓ &nbsp;320 ✓<br>316 ✓ &nbsp;312 ✓ &nbsp;319 ✓<br>313 ✓ &nbsp;318 ✓ &nbsp;315 ✓</p><p style="text-align:right">(주)대한철거</p>`)},
  cage:{t:'철망 안 필름 캔 (루페)',dk:true,h:()=>`<svg viewBox="0 0 400 210"><rect width="400" height="210" fill="#191818"/>${CANS.map(([n,t,st],i)=>{const x=40+(i%5)*80,y=i<5?52:152;
    return `<circle cx="${x}" cy="${y}" r="34" fill="#5a6068" stroke="#1c1416" stroke-width="2"/><rect x="${x-34}" y="${y+4}" width="68" height="26" fill="#e9dfc4"/><text x="${x}" y="${y+16}" text-anchor="middle" font-size="12" font-weight="700" fill="#1c1416">${n}</text><text x="${x}" y="${y+27}" text-anchor="middle" font-size="7.5" fill="#3a332a">${t}</text>
      ${st?`<g transform="rotate(10 ${x+14} ${y-22})"><rect x="${x-6}" y="${y-34}" width="42" height="22" fill="#e8742a" stroke="#111"/><text x="${x+15}" y="${y-25}" text-anchor="middle" font-size="7" font-weight="700" fill="#111">11.18</text><text x="${x+15}" y="${y-16}" text-anchor="middle" font-size="7" font-weight="700" fill="#111">반출</text></g>`:''}`}).join('')}</svg>`},
  diagram:{t:'벽에 붙은 필름 경로도',h:()=>`<svg viewBox="0 0 300 220"><rect width="300" height="220" fill="#e8dcc0"/><text x="12" y="20" font-size="11" fill="#5a4a36">영사기 필름 경로 · 1979</text>
    <rect x="80" y="86" width="120" height="86" rx="8" fill="none" stroke="#5a4a36" stroke-width="2"/><circle cx="130" cy="42" r="22" fill="none" stroke="#5a4a36" stroke-width="2"/><text x="130" y="46" text-anchor="middle" font-size="9" fill="#5a4a36">릴</text>
    <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a2a22"/></marker></defs>
    <path d="M130 64 L143 64.5" stroke="#8a2a22" stroke-width="2.4" marker-end="url(#ar)"/><path d="M145 64.5 L102 95" stroke="#8a2a22" stroke-width="2.4" marker-end="url(#ar)"/><path d="M100 96 L189 109" stroke="#8a2a22" stroke-width="2.4" marker-end="url(#ar)"/><path d="M191.8 109.5 L146 163" stroke="#8a2a22" stroke-width="2.4" marker-end="url(#ar)"/><path d="M145 165 V205" stroke="#8a2a22" stroke-width="2.4" marker-end="url(#ar)"/><text x="160" y="214" font-size="9" fill="#8a2a22">필름 가는 길</text>
    ${ROL.map(r=>{const x=(r.x-150)*.9+10,y=(r.y-30)*.75;return `<circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="#3a2a1a" stroke-width="2"/><text x="${x}" y="${y+20}" text-anchor="middle" font-size="10" fill="#3a2a1a">${r.n}</text>`}).join('')}
    <g fill="#2a1a12"><ellipse cx="${(250-150)*.9+10}" cy="${(158-30)*.75+16}" rx="30" ry="18" opacity=".93"/><ellipse cx="${(300-150)*.9+10}" cy="${(250-30)*.75+12}" rx="38" ry="16" opacity=".93"/><ellipse cx="${(398-150)*.9+10}" cy="${(238-30)*.75+14}" rx="30" ry="18" opacity=".93"/><ellipse cx="290" cy="8" rx="40" ry="22"/></g></svg>`},
  lights:{t:'조명 패널',dk:true,h:w=>`<div class="sw">${LIGHTS.map((n,i)=>`<button data-act="sw" data-i="${i}" class="${w.sw[i]?'on':''}" aria-pressed="${!!w.sw[i]}"><span class="lamp"></span>${n}<em>${w.sw[i]?'● 켬':'○ 끔'}</em></button>`).join('')}</div>`},
  seats:{t:'객석',h:w=>`<div class="scr">스크린</div><div class="seatgrid">${Array.from({length:14},(_,r)=>Array.from({length:12},(_,i)=>(i===6?'<span></span>':'')+`<button class="seat${w.fold.includes(r*12+i)?' folded':r===5&&i===2?' down':''}" data-act="seat" data-r="${r}" data-s="${i+1}" aria-label="좌석"></button>`).join('')).join('')}</div>`},
  section:{t:'벽에 붙은 무대 단면도',h:()=>sectionSvg()},
  rail:{t:'무대 옆 줄걸이',dk:true,h:w=>`<p class="paper" style="max-width:300px;margin:0 auto 12px;text-align:center">막 줄 · 올릴 때는 <b>안쪽 막부터</b><br>내릴 때는 바깥 막부터</p><div class="sw">${RAIL.map(k=>{const r=ROPE[k],p=w.pulled.includes(k);return `<button data-act="rope" data-k="${k}" class="${p?'pulled':''}"><span class="tagx" style="background:${r.col};color:${r.fg}">${r.sym}</span>${r.name} 테이프<em>${p?'올라감':'당기기'}</em></button>`}).join('')}</div>`},
  splice:{t:'편집대',h:w=>`<svg id="spSvg" viewBox="0 0 480 ${w.sp?136:300}">
    ${[0,1,2,3].map(i=>`<rect x="${i*120+2}" y="18" width="116" height="112" fill="none" stroke="#9a9182" stroke-dasharray="4 3"/>`).join('')}
    ${w.slots.map((k,i)=>piece(k,i*120,18,'slot',i)).join('')}
    ${w.sp?'':`<text x="2" y="162" font-size="11" fill="#6b604a">필름 조각</text>${w.tray.slice(0,putN(w)).filter(k=>!w.slots.includes(k)).map((k,j)=>piece(k,j*120,170,'tray',k)).join('')}`}</svg>${w.sp?viewerSvg(w):''}`},
  check:{t:'빗장에 끼워져 있던 종이',h:()=>{const d=shut();return `${paper(`<h4>마지막으로 나가는 사람 볼 것</h4><ul class="check">${SHUT.map((s,i)=>`<li class="${d[i]?'done':''}">${d[i]?'✓ ':''}${i+1}. ${s}</li>`).join('')}<li>4. 뒷문 걸쇠 걸기</li></ul><p style="text-align:right">별빛극장</p><p class="verso">뒷면, 만년필 글씨 · 「마흔일곱 해 동안 마지막 불은 늘 내가 껐다. 이번엔 누가 대신 꺼 주면 좋겠다. — 윤」</p>`)}<div class="drow"><button class="btn primary" data-act="leave">밖으로 나가 걸쇠 걸기</button></div>`}},
};
function devHtml(){if(!DEV||!DEVS[DEV])return '';const d=DEVS[DEV],t=typeof d.t==='function'?d.t():d.t;
  return `<div class="dev${d.dk?' dk':''}"><div class="dh"><span>${t}</span>${DEV==='check'?'':'<button class="x" data-act="close" aria-label="닫기">✕</button>'}</div>${d.h(W())}</div>`}
function openDev(n){DEV=n;refresh();setTimeout(()=>{const d=$('#dev');if(d&&d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'nearest'})},40)}

// ── 장마다 눌렀을 때 ──────────────────────────────
const used=k=>{delete S.bag[k];S.used[k]=true;S.hold=null};
function keyDoor(w,h,msg){
  if(h==='keys'){w.door=true;S.hold=null;refresh();return msg}
  return S.bag.keys?'문이 잠겨 있다. 열쇠 꾸러미에 맞는 게 있을 것 같다.':'문이 잠겨 있다. 열쇠가 있어야겠다.'}
const TAP={
  1:(t,w)=>{
    if(t==='poster'||t==='bus'||t==='notice'){openDev(t);return}
    if(t==='board')return S.w[3].brk[0]?'아무도 없는 극장에 전광판만 켜져 있다. 마지막 날 상영표 그대로다. 다섯째 줄 숫자 칸만 불이 다 나가 있다.':'전광판이 꺼져 있다.';
    if(t==='snack')return '카운터 위 상자에 매직으로 「영사실 — 윤 기사 짐, 18일 아침 찾아감」. 필름 통, 공구 몇 개, 그리고 이 일지가 들어 있었다.';
    if(t==='door')return '들어온 옆문이다. 밖에서 잠겼다. 손잡이를 아무리 돌려도 꿈쩍 않는다. 유리에 빗물이 흘러내린다.';
    if(t==='shutter'){if(w.open)return '셔터가 올라가 있다. 매표소 안으로 들어갈 수 있겠다.';openDev('lock');return}
  },
  2:(t,w,h)=>{
    if(t==='chart'){
      if(h==='sheet'){w.on=true;used('sheet');openDev('chart');return '좌석표 위에 투명 시트를 대 보았다.'}
      openDev('chart');return}
    if(t==='drawer'){if(w.drawer)return S.bag.sheet||S.used.sheet?'서랍이 비어 있다.':null;w.drawer=true;refresh();return '서랍을 당겼다. 맨 위에 투명한 OHP 시트가 한 장 있다. 동그라미가 몇 개 그려져 있다.'}
    if(t==='cab'){if(w.open)return S.bag.keys||S.used.keys?'열쇠함이 비어 있다.':'열쇠함 안에 열쇠 꾸러미가 걸려 있다.';openDev('lock');return}
    if(t==='card'){openDev('card');return}
    if(t==='file'){openDev('receipt');return}
    if(t==='prints')return '먼지 위 구두 발자국. 어른 남자 발이다. 열쇠함 앞에서 한참 서 있다가 돌아 나간 자국이 겹쳐 있다. 먼지가 앉지 않은 걸 보면 오래되지 않았다.';
    if(t==='window')return '매표 창구 유리 너머로 캄캄한 로비가 보인다. 전광판 불빛만 바닥에 번져 있다.';
  },
  3:(t,w,h)=>{
    if(!w.door){if(t!=='door')return;return keyDoor(w,h,'열쇠 하나가 맞는다. 문을 열자 눅눅한 곰팡내가 끼쳐 온다. 천장에 물 자국이 번져 있다.')}
    if(t==='panel'){openDev('panel');return}
    if(t==='wiring'){openDev('wiring');return}
    if(t==='toolbox'){if(w.box)return S.bag.loupe?'공구함에 드라이버와 테이프뿐이다.':null;w.box=true;refresh();return '공구함 뚜껑을 열었다. 드라이버, 절연 테이프, 그리고 작은 루페.'}
  },
  4:(t,w,h)=>{

function thread(i,w){
  if(!w.mount)return '걸 필름이 없다.';
  if(w.ok)return '필름이 이미 팽팽하게 걸려 있다.';
  if(w.thread.includes(i))return '그 롤러에는 벌써 필름이 걸려 있다.';
  if(i===2&&!w.gate)return '렌즈 앞으로 필름을 넣으려는데, 필름 문에 뭔가 끼어 있어 들어가지 않는다.';
  w.thread.push(i);
  if(w.thread.length<4){save();refresh();return null}
  const ch=w.thread.map(k=>ROL[k].ch).join(' ');
  if(w.thread.join('')==='0123'){w.ok=true;save();refresh();return `필름이 롤러 네 개를 지나 팽팽하게 걸렸다. 롤러에 새겨진 글자가 필름 가장자리에 눌려 찍혔다. ${ch}`}
  w.thread=[];save();refresh();return `필름이 축 늘어지더니 롤러에서 빠져 버렸다. 가장자리에 눌린 글자는 ${ch}.`;
}

  const g=$('#sheetG'),svg=$('#chartSvg');if(!g||!svg)return;const w=S.w[2];let st=null;
  g.onpointerdown=e=>{const p=toSvg(svg,e);st={x:p.x,y:p.y,dx:w.dx,dy:w.dy,m:0};try{g.setPointerCapture(e.pointerId)}catch{}e.preventDefault()};
  g.onpointermove=e=>{if(!st)return;const p=toSvg(svg,e);st.m=Math.max(st.m,Math.hypot(p.x-st.x,p.y-st.y));w.dx=Math.max(-160,Math.min(160,Math.round(st.dx+p.x-st.x)));w.dy=Math.max(-160,Math.min(160,Math.round(st.dy+p.y-st.y)));g.setAttribute('transform',sheetT(w))};
  const up=()=>{if(!st)return;const tap=st.m<6;st=null;
    if(tap){ACT.rot();return}
    if(Math.hypot(w.dx,w.dy)<SNAP){const was=w.dx||w.dy;w.dx=0;w.dy=0;g.setAttribute('transform',sheetT(w));if(was)toast(w.rot?'귀퉁이 표시가 맞물렸다. 그런데 파란 글씨가 거꾸로 섰다.':'귀퉁이 표시가 딱 맞물렸다.')}
    save()};
  g.onpointerup=up;g.onpointercancel=up;
}

// ── 6장 호출등: ▶, 짧게 ×5, 쉼, 길게, 짧게 ×2, 긴 쉼 (11초마다 되풀이) ──
const ON=[[1.6,1.9],[2.3,2.6],[3.0,3.3],[3.7,4.0],[4.4,4.7],[6.0,7.2],[7.6,7.9],[8.3,8.6]];
setInterval(()=>{const b=document.getElementById('bulb');if(!b)return;const t=(performance.now()/1000)%11;
  if(performance.now()<STILL){b.setAttribute('opacity',.15);const pl=document.getElementById('play');if(pl)pl.setAttribute('opacity',.15);return}
  b.setAttribute('opacity',ON.some(([a,z])=>t>=a&&t<z)?1:.15);const pl=document.getElementById('play');if(pl)pl.setAttribute('opacity',t<.8?1:.15)},50);

// ── 탭 · 소지품 ──────────────────────────────
function canView(v){
  if(v==='cover')return true;
  if(!S.started)return false;
  if(v==='end')return S.done;
  const n=+v.slice(1);return n>=1&&n<=Math.min(S.open,LAST);
}
function renderTabs(){
  const tabs=[['cover','표지'],...(S.v[0]==='p'?[[S.v,'📍 '+ROOM[pageNo()]]]:[]),...(S.done?[['end','끝']]:[])];
  $('#tabs').innerHTML=tabs.map(([v,label])=>{const lk=!canView(v),n=v[0]==='p'?+v.slice(1):0;
    return `<button class="tab${v==='map'?' map':''}${S.v===v?' on':''}" data-v="${v}"${lk?' disabled':''}>${lk?'🔒 ':''}${label}${n&&S.clear[n]?'<span class="ok">✓</span>':''}</button>`}).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function renderBag(){
  const show=S.started&&!S.done&&(S.v[0]==='p'||S.v==='map');
  document.body.classList.toggle('hasbag',show);
  if(!show){$('#bag').innerHTML='';return}
  $('#bag').innerHTML=`<div class="in" role="toolbar" aria-label="소지품"><span class="lbl">소지품</span><button class="slot has book${(S.seen||0)<Math.min(S.open,LAST)?` unread`:``}" data-book aria-label="상영 일지" title="상영 일지"><svg viewBox="0 0 40 40"><rect x="9" y="6" width="23" height="29" rx="2" fill="#5b2a2e"/><rect x="12" y="6" width="3" height="29" fill="#3b1a1d"/><rect x="18" y="12" width="10" height="2" fill="#e8d9b0"/><rect x="18" y="17" width="8" height="2" fill="#e8d9b0"/></svg></button>${ORDER.map(id=>{const has=!!S.bag[id];
    return `<button class="slot${has?' has':''}${S.hold===id?' on':''}${NEWSLOT===id?' new':''}" data-b="${id}"${has?` aria-pressed="${S.hold===id}" aria-label="${NAME[id]}" title="${NAME[id]}"`:' disabled aria-label="빈 칸"'}>${has?`<svg viewBox="0 0 40 40"><use href="#i-${id}" width="40" height="40"/></svg>${id==='film'?`<i>${S.bag.film}</i>`:''}`:''}</button>`}).join('')}</div>`;
  NEWSLOT=null;
  $('#bag').querySelectorAll('.slot.has[data-b]').forEach(b=>b.onclick=()=>{if(FD&&FD.skip){FD=null;return}hold(b.dataset.b)});
  const bk=$('#bag [data-book]');if(bk)bk.onclick=openBook;
}
function go(v){if(!canView(v))return;if(v!==S.v)DEV=null;S.v=v;if(v[0]==='p')anaChapter('chapter_opened',+v.slice(1));save();render(true);scrollTo({top:0,behavior:'smooth'});
  if(v[0]==='p'&&S.started&&(S.seen||0)<+v.slice(1))toast('일지에 아직 안 읽은 쪽이 있다. 소지품의 일지를 눌러 펼쳐 보자.')}

// ── 쪽 ──────────────────────────────
function pageCover(){
  return `<section class="cover turn">
    <div class="ticket"><h2>별빛극장</h2><div>상영 일지 · 2026</div><div class="who">영사기사 윤만석</div></div>
    <p class="story">별빛극장은 우리 동네 골목 끝에서 마흔일곱 해를 버틴 단관 극장이다. 지난 일요일 마지막 상영을 하고 문을 닫았다. 내일 아침 7시면 헐린다.</p>
    <p class="story">폐관이 정해진 뒤로 동네에 소문이 돌았다. 밤마다 빈 객석에서 불이 깜빡인다고. 단톡방엔 객석에 누가 앉아 있는 걸 봤다는 사람까지 나왔다.</p>
    <p class="story">11월 17일 화요일, 비 오는 밤. 마지막 기회라 휴대폰을 들고 가림막 안으로 들어갔다. 공사장 쪽 옆문이 열려 있었다. 로비를 찍다가 배터리가 나갔고, 더듬더듬 매점 쪽으로 가는 사이 옆문이 밖에서 잠겼다. 순찰 돌던 경비가 열린 문을 보고 잠근 모양이다.</p>
    <div class="rules">소리쳐 봐야 가림막 밖까지는 안 닿는다. 들키면 무단 침입이다. 아침 일곱 시, 인부들이 오기 전에 나가야 한다. 남은 길은 무대 뒤 골목으로 난 2번 출입구뿐인데, 거기까지 가는 문이 전부 잠겨 있다.</div>
    <p class="story">로비에 불이 들어온 건 전광판 하나뿐이다. 매점 카운터 위에 상자가 하나 있고, 맨 위에 공책이 얹혀 있다. 영사기사의 상영 일지다. 밤마다 여기서 무슨 일이 있었는지 적혀 있을지도 모른다.</p>
    <button class="btn go" id="start">${S.started?'이어서 읽기':'일지 펼치기'}</button>
    <div class="proto">1~8장 · 진행 상황은 이 브라우저에 저장돼요</div>
  </section>`;
}
function pageLevel(p){
  const L=LOG[p],w=S.w[p];
  const edge=p===5&&w.door&&(w.thread.length||w.ok)?`<div class="edge">필름 가장자리<b>${w.thread.map(i=>ROL[i].ch).join(' ')}</b></div>`:'';
  return `<section class="room turn"><h2>${ROOM[p]}${S.clear[p]?'<small>✓ 지나옴</small>':''}<button class="mapbtn" data-map>🗺 약도</button></h2>${sceneSvg(p)}${edge}<div id="dev">${devHtml()}</div></section>
    <div class="nav"><span></span>${S.clear[p]&&p<LAST?`<button data-go="p${p+1}">→ ${ROOM[p+1]}${ro(ROOM[p+1])}</button>`:'<span></span>'}</div>`;
}
// ── 상영 일지 책자: 소지품의 일지를 눌러 한 쪽씩 넘겨 본다. 열린 장까지 날짜 쪽, 맨 뒤는 윤 기사가 그린 극장 약도
const BOOK={i:0,from:0};
function openBook(){
  const n=Math.min(S.open,LAST);BOOK.from=S.seen||0;
  BOOK.i=BOOK.from<n?BOOK.from:Math.max(0,Math.min(pageNo()||n,n)-1);
  S.seen=n;save();renderBag();bookPage();$('#mbg').classList.add('on');
}
function bookPage(){
  const n=Math.min(S.open,LAST),last=n-1,i=Math.max(0,Math.min(BOOK.i,last));BOOK.i=i;
  let body;
  {const p=i+1,L=LOG[p];
    body=`<article class="log">${p>BOOK.from?'<span class="newtag">새 쪽</span>':''}
    <div class="meta"><span>일자<b>${L.date}</b></span><span>날씨<b>${L.wx}</b></span><span>영사기사<b>윤만석</b></span></div>
    ${L.body.map(([t,x])=>`<div class="${t}">${x}</div>`).join('')}</article>`}
  $('#modal').innerHTML=`<div class="bookhd"><h2>상 영 일 지</h2><span>${i+1} / ${last+1}</span></div>${body}
    <div class="bookft"><button class="btn" id="bprev"${i===0?' disabled':''}>‹ 앞 쪽</button><button class="btn primary" id="mclose">덮기</button><button class="btn" id="bnext"${i===last?' disabled':''}>뒤 쪽 ›</button></div>`;
  $('#modal').scrollTop=0;
  $('#bprev').onclick=()=>{BOOK.i--;bookPage()};$('#bnext').onclick=()=>{BOOK.i++;bookPage()};$('#mclose').onclick=closeM;
  $('#modal').querySelectorAll('[data-go]').forEach(g=>g.onclick=()=>{closeM();go(g.dataset.go)});
}
// 받침 없거나 ㄹ이면 '로', 아니면 '으로'
const ro=w=>{const c=(w.charCodeAt(w.length-1)-0xAC00)%28;return c===0||c===8?'로':'으로'};
function openMap(){$('#modal').innerHTML=pageMap()+'<div class="bookft"><span></span><button class="btn primary" id="mclose">접기</button><span></span></div>';$('#modal').scrollTop=0;$('#mclose').onclick=closeM;$('#modal').querySelectorAll('[data-go]').forEach(g=>g.onclick=()=>{closeM();go(g.dataset.go)});$('#mbg').classList.add('on')}
function pageMap(){
  const R=[[7,'무대 뒤',150,18,300,52,0],[8,'2번 출입구',460,18,130,52,0],[6,'객석',150,80,300,140,0],[5,'영사실(2층)',290,230,150,48,1],[4,'지하 창고',460,230,130,48,1],[2,'매표소',150,290,86,58,0],[1,'로비',240,290,210,58,0],[3,'매점 창고',460,290,130,58,0]];
  const cur=pageNo(),fresh=S.open<=LAST&&!S.clear[S.open]?S.open:0;
  return `<section class="plan"><h3>윤 기사가 그린 극장 약도 · 일지 뒤표지에 끼워져 있던 종이</h3><svg viewBox="0 0 600 360">
    <rect x="160" y="80" width="280" height="8" fill="#93a6b2"/>
    ${R.map(([n,nm,x,y,w,h,ds])=>{const open=canView('p'+n);
      return `<g class="rm ${open?'open':'locked'}${n===fresh?' fresh':''}"${open?` data-go="p${n}" role="button" tabindex="0"`:''} aria-label="${nm}${open?'':' (잠김)'}">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${n===cur&&open?'#41606f':open?'#2c3e4a':'#1a2229'}" stroke="${n===cur&&open?'#ffd257':open?'#93a6b2':'#3a4650'}" stroke-width="${n===cur&&open?4:2}"${ds?' stroke-dasharray="6 4"':''}/>
      <text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="${Math.min(21,Math.floor((w-10)/(nm.length+(S.clear[n]?1.5:0))))}" fill="${open?'#e7eef2':'#55636d'}">${open?nm+(S.clear[n]?' ✓':''):'?'}</text></g>`}).join('')}
    <text x="300" y="100" text-anchor="middle" font-size="10" fill="#93a6b2" letter-spacing="6">스크린</text>
  </svg><div class="legend">갈 수 있는 방을 누르면 그리로 간다 · ? 는 아직 못 가 본 곳 · 점선은 2층·지하</div></section>`;
}
function pageEnd(){
  const h=hintTotal(),ansHints=Object.values(S.hints).filter(n=>n>=3).length;
  const grade=h===0?'영사기사':ansHints===0?'단골 관객':'귀신 구경꾼';
  return `<article class="result turn">
    <p class="big">오늘 밤의 귀신</p>
    <div class="seal">${grade}</div>
    <dl><div><dt>걸린 시간</dt><dd>${fmt(S.ms)}</dd></div><div><dt>힌트</dt><dd>${h}장</dd></div></dl>
    <p>골목으로 나와 걸쇠를 걸었다. 돌아보니 로비 전광판 하나만 켜져 있었다. 표에 적힌 그대로다. 비는 그쳐 있었다.</p>
    <p>집에 와서 휴대폰을 충전했다. 남은 영상은 로비 바닥을 찍다 끊긴 4초짜리 하나였다. 3초쯤, 둥근 불빛 하나가 바닥을 천천히 쓸고 지나간다. 객석에서 본 것과 같은 크기, 같은 빛이다.</p>
    <p>그때 내 손에는 아직 손전등이 없었다.</p>
    <p>다음 날 아침, 동네 단톡방에 글이 올라왔다. 「어젯밤에도 극장에 귀신불 봤다는 사람 있음. 마지막까지 있네.」</p>
    <p>창밖에서 굴착기가 별빛극장 간판을 뜯고 있었다.</p>
    <div class="row"><button class="btn" id="again">처음부터 다시</button><a class="btn primary" href="../../" style="text-decoration:none">사건 대장으로</a></div>
  </article>`;
}
function render(anim){
  if(!canView(S.v))S.v='cover';
  renderTabs();renderStats();
  const pg=$('#page'),v=S.v;
  pg.innerHTML=v==='cover'?pageCover():v==='end'?pageEnd():pageLevel(+v.slice(1));
  if(!anim)pg.querySelectorAll('.turn').forEach(e=>e.classList.remove('turn'));
  if(v==='cover')$('#start').onclick=()=>{if(!S.started){ana('case_started');S.started=true;S.open=1;go('p1');openBook();return}go('p'+frontier())};
  if(v==='end')$('#again').onclick=()=>{if(confirm('처음부터 다시 할까요? 지금 기록은 지워져요.')){ana('case_restarted');S=fresh();DEV=null;save();render(true)}};
  renderBag();bindScene();bindDev();SND.after();
}
const refresh=()=>render(false);
$('#page').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.closest('[data-map]')){openMap();return}
  const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b,e);
});
$('#page').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-go]')){e.preventDefault();go(e.target.dataset.go)}});

// ── 힌트 ──────────────────────────────
function openHint(){
  const p=hintPage(),H=HINTS[p];if(!H||S.done)return;
  const got=S.hints[p]||0;
  $('#modal').innerHTML=`<h2>${p}장 힌트</h2><div class="sub">지금 풀고 있는 장의 힌트예요. 한 장씩 떼어 볼 수 있고, 세 번째 장엔 푸는 법이 다 있어요.</div>
    <div class="posts">${H.map((h,i)=>i<got?`<div class="post"><small>포스트잇 ${i+1}</small>${h}</div>`
      :i===got?`<button class="post closed" id="peel">포스트잇 ${i+1} 떼어 보기${i===2?' (푸는 법)':''}</button>`
      :`<div class="post closed">포스트잇 ${i+1}</div>`).join('')}</div>
    <div class="actions"><button class="btn" id="mclose">닫기</button></div>`;
  $('#mbg').classList.add('on');
  $('#mclose').onclick=closeM;
  const pe=$('#peel');if(pe)pe.onclick=()=>{S.hints[p]=got+1;ana('hint_revealed',{chapter:p,level:got+1,minutes_used:anaMinutes()});save();renderStats();openHint()};
}
function closeM(){$('#mbg').classList.remove('on')}
$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(S.hold){S.hold=null;save();renderBag();const sc=$('#scene');if(sc)sc.classList.forEach(c=>c.startsWith('h-')&&sc.classList.remove(c))}}});
$('#btnHint').onclick=openHint;

ana('case_intro_viewed');
if(resumed)ana('case_resumed',{clue_count:Object.keys(S.clear).length,minutes_used:anaMinutes()});
render(true);
</script>
</body>
</html>
