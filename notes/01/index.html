<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note 01 · 퍼니보드 사건 파일 | 히든노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --panel:#1e1a17; --panel2:#272220; --line:#3a332e;
  --ink:#efe6d8; --dim:#a69a8a; --gold:#d8a64a; --gold2:#f0c96b; --red:#c8553d; --green:#7fa36b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:14px}
header.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.brand{font-family:"Noto Serif KR",serif;font-weight:900;font-size:20px;letter-spacing:-.5px}
.brand small{display:block;font-family:"Noto Sans KR";font-weight:400;font-size:12px;color:var(--dim);letter-spacing:0}
.spacer{flex:1}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--dim)}
.stat b{color:var(--ink);font-size:16px;margin-left:4px}
.stat.time b{color:var(--gold2)}
.stat.low b{color:var(--red)}
.btn{white-space:nowrap;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1b140a;border-color:var(--gold);font-weight:700}
.btn.primary:hover{background:var(--gold2)}
.btn.danger{background:#5a2219;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.layout{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.locs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.loc{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 14px;font-size:13px}
.loc.on{background:var(--gold);color:#1b140a;border-color:var(--gold);font-weight:700}
.loc.locked{opacity:.55}
.scene-wrap{background:#0d0b0a;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.scene-wrap svg{display:block;width:100%;height:auto}
.scene-cap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.hs{fill:transparent;cursor:pointer;transition:fill .15s, stroke .15s}
.hs.vis:hover{fill:rgba(240,201,107,.12);stroke:var(--gold2);stroke-width:2;stroke-dasharray:6 4}
.hs.done.vis{stroke:rgba(127,163,107,.6);stroke-width:1.5;stroke-dasharray:3 4}
.hs.hid:hover{fill:rgba(255,255,255,.03)}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--gold2);letter-spacing:.5px}
.clue-list{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
.clue-item{background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:13px;text-align:left;color:var(--ink)}
.clue-item:hover{border-color:var(--gold)}
.clue-item .cat{font-size:11px;color:var(--dim);margin-right:6px}
.clue-item.new{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(240,201,107,.15)}
.empty{color:var(--dim);font-size:13px}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-family:"Noto Serif KR",serif;margin:0 0 10px;font-size:20px}
.modal .body{white-space:pre-line}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.paper{background:#efe6d3;color:#2a221a;border-radius:6px;padding:12px 14px;font-size:14px;white-space:pre-line;margin-top:8px;font-family:"Noto Sans KR"}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border-bottom:1px solid #cbbd9f;padding:3px 6px;text-align:left;font-size:13px}
.cost{display:inline-block;font-size:11px;color:#1b140a;background:var(--gold);border-radius:4px;padding:0 6px;margin-left:6px;font-weight:700;vertical-align:middle}
.newtag{color:var(--gold2);font-weight:700;font-size:13px;margin-top:10px}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:14px 0}
.keypad button{height:52px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:20px}
.keypad button:hover{border-color:var(--gold)}
.pin{display:flex;gap:10px;justify-content:center;margin-top:8px}
.pin span{width:40px;height:50px;border-radius:8px;border:1px solid var(--line);background:#0d0b0a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--gold2)}
.pfr{width:260px;height:520px;margin:4px auto 0;border-radius:38px;border:9px solid #1c1c20;overflow:hidden;position:relative;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pscr{position:absolute;inset:0;color:#fff}
.pbg{position:absolute;inset:0;width:100%;height:100%}
.pbg.blur{filter:blur(10px) brightness(.55);transform:scale(1.15)}
.pnotch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:80px;height:20px;border-radius:12px;background:#000;z-index:2}
.pbar{position:absolute;top:10px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;z-index:1}
.pdate{position:absolute;top:58px;width:100%;text-align:center;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.pclock{position:absolute;top:74px;width:100%;text-align:center;font-size:64px;font-weight:300;letter-spacing:-1px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.pnoti{position:absolute;top:168px;left:12px;right:12px;background:rgba(30,30,35,.55);backdrop-filter:blur(8px);border-radius:16px;padding:9px 12px;font-size:12px}
.pnoti b{display:block;font-size:12px}
.plock{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);border:none;color:#fff;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.plock:hover{background:rgba(255,255,255,.35)}
.pbottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:rgba(255,255,255,.7)}
.ptitle{position:absolute;top:70px;width:100%;text-align:center;font-size:16px}
.pdots{position:absolute;top:102px;width:100%;display:flex;justify-content:center;gap:16px}
.pdots i{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;display:block}
.pdots i.f{background:#fff}
.pkeys{position:absolute;top:150px;left:0;right:0;display:grid;grid-template-columns:repeat(3,62px);gap:14px 20px;justify-content:center}
.pkeys button{width:62px;height:62px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:24px;font-weight:300}
.pkeys button:hover{background:rgba(255,255,255,.3)}
.pkeys button.blank{visibility:hidden}
.pcancel{position:absolute;bottom:26px;right:30px;background:none;border:none;color:#fff;font-size:14px}
.lockwrap{display:flex;flex-direction:column;align-items:center;margin:10px 0 4px}
.shackle{width:120px;height:80px;border:16px solid #9aa3a8;border-bottom:none;border-radius:60px 60px 0 0;margin-bottom:-4px;transition:transform .4s}
.shackle.open{transform:translateY(-22px)}
.lbody{width:200px;background:linear-gradient(#5d666b,#3e4549);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 8px 20px rgba(0,0,0,.5)}
.drow{display:flex;align-items:center;gap:10px}
.ddot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.dwheel{flex:1;height:54px;background:linear-gradient(#111 0%,#3a3a3a 20%,#d9d9d9 50%,#3a3a3a 80%,#111 100%);border-radius:6px;position:relative;overflow:hidden;cursor:ns-resize;user-select:none}
.dwheel .num{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-family:monospace}
.dwheel .cur{top:12px;font-size:26px;color:#1a1a1a}
.dwheel .prev{top:-10px;font-size:12px;color:#777}
.dwheel .next{bottom:-10px;font-size:12px;color:#777}
.darr{display:flex;flex-direction:column;gap:2px}
.darr button{width:30px;height:24px;border:none;border-radius:5px;background:#2b3135;color:#ddd;font-size:11px}
.darr button:hover{background:#465056}
.calv{background:#f6f0e2;color:#2a221a;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4);margin-top:6px}
.calh{background:#b0463a;color:#fff;text-align:center;font-family:"Noto Serif KR",serif;font-weight:900;font-size:26px;padding:10px 0 8px;position:relative}
.calh span{position:absolute;left:14px;top:16px;font-size:12px;font-weight:400;opacity:.8;font-family:"Noto Sans KR"}
.calw,.calg{display:grid;grid-template-columns:repeat(7,1fr)}
.calw div{text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-bottom:1px solid #d8cdb7}
.cd{min-height:62px;border-right:1px solid #e3d9c4;border-bottom:1px solid #e3d9c4;padding:4px 5px;font-size:10.5px;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.cd b{font-size:13px}
.cd.e{background:#efe7d4}
.stk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:12px;transform:rotate(-8deg)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.phone{background:#0b0b0d;border-radius:28px;border:6px solid #2b2b30;padding:16px;max-width:340px;margin:0 auto}
.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.app-btn{background:#1d1d24;border:1px solid #33333d;border-radius:14px;color:#eee;padding:14px 8px;font-size:13px}
.app-btn:hover{border-color:var(--gold)}
.chat{display:flex;flex-direction:column;gap:6px;font-size:13px}
.chat .day{text-align:center;color:#8a8f99;font-size:11px;margin:6px 0}
.chat{margin-top:8px}.chat .msg{background:#23262e;color:#e8e8e8;border-radius:10px;padding:6px 10px}
.chat .msg b{color:#9fc4ff;font-weight:500;margin-right:6px}
.chat .msg i{color:#8a8f99;font-style:normal;font-size:11px;margin-left:6px}
.sus-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:560px){.sus-row{grid-template-columns:repeat(2,1fr)}}
.sus{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;color:var(--ink)}
.sus.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,166,74,.25)}
.sus .face{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#1b140a}
.sus small{display:block;color:var(--dim);font-size:11px}
.say{background:var(--panel2);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-line}
.log{max-height:240px;overflow:auto}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px;width:100%}
.q{margin:12px 0}
.q label{display:block;font-weight:700;margin-bottom:6px}
.opt{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:4px 0;cursor:pointer;font-size:14px}
.opt input{margin-right:8px}
.res-score{font-family:"Noto Serif KR",serif;font-size:28px;color:var(--gold2);margin:4px 0 10px}
.ok{color:var(--green)} .ng{color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#1b140a;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.intro p{margin:6px 0}
.rules{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:10px}
.rules li{margin:3px 0}
.steps{display:grid;gap:8px;margin:12px 0}
.stp{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:10px 12px}
.stp .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1b140a;font-weight:900;display:flex;align-items:center;justify-content:center}
.stp b.t{display:block}
.stp span{font-size:13px;color:var(--dim)}
.timebox{background:#2b2116;border:1px solid #5a4422;border-radius:10px;padding:10px 12px;font-size:13.5px}
.timebox table{width:100%;border-collapse:collapse;margin-top:6px}
.timebox td{padding:3px 0}
.timebox td:last-child{text-align:right;color:var(--gold2);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand"><a href="../../" style="color:var(--dim);text-decoration:none;font-family:'Noto Sans KR';font-size:12px;font-weight:700;letter-spacing:2px;display:block">← HIDDEN NOTE · NOTE 01</a>퍼니보드 사건 파일 <small>보드게임 카페의 마지막 손님</small></div>
    <div class="spacer"></div>
    <div class="stat time" id="stTime">남은 조사 시간<b id="tLeft">80분</b></div>
    <div class="stat">발견한 단서<b id="cCount">0</b></div>
    <button class="btn" id="btnHelp" title="게임 방법">? 방법</button>
    <button class="btn" id="btnTalk">심문하기</button>
    <button class="btn primary" id="btnAccuse">범인 지목</button>
  </header>
  <div class="layout">
    <main>
      <div class="locs" id="locs"></div>
      <div class="scene-wrap">
        <div id="scene"></div>
        <div class="scene-cap"><span id="locDesc"></span><span>물건 클릭 = 조사 (2분) · 심문 3분 · 비번 오답 1분</span></div>
      </div>
    </main>
    <aside class="side">
      <div class="card">
        <h3>수사 수첩</h3>
        <div class="clue-list" id="clues"><div class="empty">아직 찾은 단서가 없습니다.</div></div>
        <div class="hint">단서를 누르면 다시 볼 수 있어요. 심문할 때 증거로 제시할 수 있습니다.</div>
      </div>
      <div class="card">
        <h3>사건 요약</h3>
        <div style="font-size:13px;color:var(--dim)">어젯밤 21:30~22:20 사이, 쇼케이스 속 한정판 도금 미플 20개가 금색 물감을 칠한 가짜로 바뀌었다. 그 시간 카페에 있던 사람은 넷.<br><br>범인을 지목하고, 범행 시각과 그 근거를 제시하라.</div>
      </div>
    </aside>
  </div>
</div>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== DATA ===================== */
const TOTAL_TIME = 80;

const CLUES = {
  c_frame:{cat:'현장',title:'벽의 액자',text:'',photo:true},
  c_calendar:{cat:'현장',title:'벽 달력',cal:true},
  c_board:{cat:'현장',title:'화이트보드',text:'이번 주 할 일\n✔ 물티슈 주문\n✔ 젠가 블록 1개 분실 확인\n✔ 할인 이벤트 접시 정리\n☐ 화요일 서프라이즈 준비 🤫\n— 지아'},
  c_dice:{cat:'현장',title:'할인 이벤트 접시',dice:true},
  c_postit:{cat:'현장',title:'키보드 밑 쪽지',postit:true},
  c_check:{cat:'기록',title:'마감 체크리스트',text:'작성: 서지아\n\n22:10 쇼케이스 잠금 확인 ✔ (자물쇠 당겨봄)\n22:15 사장님 선물 포장 완료 ✔\n22:20 출입문 잠금 ✔'},
  c_glitter:{cat:'물증',title:'반납된 확장판 상자',text:'윤미래가 21:52에 반납한 《드래곤 바자르 확장: 사막의 시장》.\n뚜껑 모서리에 반짝이는 금색 알갱이가 묻어 있다.'},
  c_gift:{cat:'물증',title:'포장된 생일 선물',text:'금박지로 포장된 상자. 만지자 금박 가루가 손에 묻는다.\n안에는 금색으로 칠한 드래곤 피규어와 카드 한 장.\n“생일 축하해요, 사장님! — 건우”\n피규어 받침 밑면에 작은 스티커: MG-03'},
  c_key:{cat:'물증',title:'계산대 서랍의 열쇠',text:'서랍은 칸이 두 개다.\n왼쪽 칸: 영수증 롤 몇 개.\n오른쪽 칸: 쇼케이스 열쇠, 카드 영수증 몇 장.\n\n(열쇠를 손에 넣었다)'},
  c_water:{cat:'현장',title:'정수기',text:'손님용 정수기. 종이컵 디스펜서가 붙어 있다. 컵이 몇 개 빠져 있다.'},
  c_cctv:{cat:'기록',title:'입구 CCTV 출입 기록',html:`<table><tr><th>시각</th><th>기록</th></tr>
<tr><td>17:00</td><td>서지아 출근</td></tr>
<tr><td>18:40</td><td>박태수 입장</td></tr>
<tr><td>19:00</td><td>손님 2명 입장</td></tr>
<tr><td>21:20</td><td>손님 2명 퇴장</td></tr>
<tr><td>21:30</td><td>사장 한도윤 퇴장</td></tr>
<tr><td>21:40</td><td>최건우 입장</td></tr>
<tr><td>21:47</td><td>최건우 퇴장</td></tr>
<tr><td>21:50</td><td>윤미래 입장</td></tr>
<tr><td>21:58</td><td>윤미래 퇴장</td></tr>
<tr><td>22:05</td><td>박태수 퇴장</td></tr>
<tr><td>22:20</td><td>서지아 퇴장, 출입문 잠금</td></tr>
<tr><td>~ 다음 날 10:00</td><td>출입 없음</td></tr></table>`},
  c_cctvphoto:{cat:'기록',title:'CCTV 캡처 화면',text:'18:40 박태수 — 빨간 체크 남방\n21:30 한도윤 — 회색 니트\n21:40 최건우 — 초록 작업 앞치마\n21:50 윤미래 — 베이지 코트'},
  c_showapp:{cat:'기록',title:'쇼케이스 앱 기록',html:`<table><tr><th>시각</th><th>기록</th></tr>

/* ===================== STATE ===================== */
let S;
function reset(){
  S={time:TOTAL_TIME,clues:[],seen:new Set(),step:{},solved:{},apps:{},heard:{},asked:{},loc:'counter',over:false,cur:'seo'};
  render();
}
const stepOf=id=>S.step[id]||0;
const has=c=>S.clues.includes(c);

/* ===================== UI HELPERS ===================== */
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function modal(html){$('#modal').innerHTML=html;$('#mbg').classList.add('on');$('#modal').scrollTop=0}
function closeM(){$('#mbg').classList.remove('on')}
$('#mbg').addEventListener('click',e=>{if(e.target.id==="mbg"&&!S.over&&!(ACC&&ACC.forced))closeM()});

function spend(n){
  if(n<=0)return;
  S.time=Math.max(0,S.time-n);renderHud();
}
function checkTime(){
  if(S.time<=0&&!S.over){setTimeout(()=>{toast('조사 시간이 끝났습니다');openAccuse(true)},400);return true}
  return false;
}
function addClues(list){
  const fresh=[];
  list.forEach(c=>{if(!has(c)){S.clues.push(c);fresh.push(c)}});
  renderNotebook(fresh);
  return fresh;
}
function calHTML(){
  const notes={6:'<span style="color:#2b5bb5">보드겜 모임</span>',16:'<span class="stk" style="background:#f0c96b">★</span><span style="color:#b0463a">한정판 전시!</span>',17:'<span class="stk" style="background:#f7c1cf;color:#e75480">♥</span>',21:'<span style="color:#2b5bb5">재고 입고</span>',25:'<span style="color:#7a6a55">월세</span>'};
  let cells='',day=1;
  for(let i=0;i<35;i++){
    if(i<0||day>30){cells+='<div class="cd e"></div>';continue}
    const dow=i%7;
    cells+=`<div class="cd"><b style="color:${dow===0?'#c0392b':dow===6?'#2b5bb5':'#2a221a'}">${day}</b>${notes[day]||''}</div>`;day++;
  }
  return `<div class="calv"><div class="calh"><span>2026</span>11월</div><div class="calw">${['일','월','화','수','목','금','토'].map((d,i)=>`<div style="color:${i===0?'#c0392b':i===6?'#2b5bb5':'#5a4a3a'}">${d}</div>`).join('')}</div><div class="calg">${cells}</div></div>`;
}
function dieSVG(col,n,pip){const P={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[3,1],[1,3],[3,3]],5:[[1,1],[3,1],[2,2],[1,3],[3,3]],6:[[1,1],[3,1],[1,2],[3,2],[1,3],[3,3]]}[n];
 return `<svg width="64" height="64" viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="7" fill="${col}"/>${P.map(([x,y])=>`<circle cx="${x*10}" cy="${y*10}" r="3.4" fill="${pip}"/>`).join('')}</svg>`}
function clueBody(c){const d=CLUES[c];if(d.postit)return `<div class="paper" style="background:#3a2f28;text-align:center;padding:26px"><svg width="200" height="200" viewBox="0 0 100 100" style="transform:rotate(-6deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))"><rect x="5" y="5" width="90" height="90" fill="#f7dc6f"/><rect x="5" y="5" width="90" height="14" fill="#f4d03f"/>
<path d="M50 74 C 20 56, 22 34, 36 34 C 44 34, 49 40, 50 45 C 51 40, 56 34, 64 34 C 78 34, 80 56, 50 74 Z" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>
<path d="M30 86 l-14 0 m0 0 l5 -4 m-5 4 l5 4" stroke="#555" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>`;if(d.cal)return calHTML();if(d.dice)return `<div class="paper" style="text-align:center"><div style="font-weight:700;margin-bottom:10px">“주사위 굴려서 6 나오면 음료 10% 할인!”</div><div style="display:inline-flex;gap:12px;background:#d9cdb4;border-radius:40px;padding:14px 22px">${dieSVG('#c0392b',4,'#fff')}${dieSVG('#e1b12c',1,'#fff')}${dieSVG('#2e6fb5',6,'#fff')}</div></div>`;if(d.photo)return `<div class="paper"><svg viewBox="0 0 160 106" style="width:100%;max-width:320px;display:block;margin:0 auto 8px;border:6px solid #8a6a3a">${PHOTO}${PHOTO_DATE}</svg></div>`;return d.html?`<div class="paper">${d.html}</div>`:`<div class="paper">${esc(d.text)}</div>`}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* ===================== RENDER ===================== */
function render(){renderHud();renderLocs();renderScene();renderNotebook([])}
function renderHud(){
  $('#tLeft').textContent=S.time+'분';
  $('#stTime').classList.toggle('low',S.time<=15);
  $('#cCount').textContent=S.clues.length;
}
function locOpen(l){return !l.lock||S.solved[l.lock]}
function renderLocs(){
  $('#locs').innerHTML=LOCS.map(l=>{
    const open=locOpen(l);
    return `<button class="loc ${S.loc===l.id?'on':''} ${open?'':'locked'}" data-loc="${l.id}">${open?'':'🔒 '}${l.name}</button>`}).join('');
  document.querySelectorAll('.loc').forEach(b=>b.onclick=()=>{
    const l=LOCS.find(x=>x.id===b.dataset.loc);
    if(!locOpen(l)){toast('잠겨 있습니다. 안쪽 복도의 창고 문을 열어야 해요.');return}
    S.loc=l.id;renderLocs();renderScene();
  });
}
function renderScene(){
  const l=LOCS.find(x=>x.id===S.loc);
  $('#locDesc').textContent=l.desc;
  const hs=HS.filter(h=>h.loc===S.loc&&(!h.show||h.show()));
  const overlays=hs.map(h=>{
    const done=isDone(h);
    const cls=h.hidden?'hid':'vis';
    return `<rect class="hs ${cls} ${done?'done':''}" data-hs="${h.id}" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="6">${h.hidden?'':`<title>${h.label}</title>`}</rect>`}).join('');
  $('#scene').innerHTML=`<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">${SCENES[S.loc]()}${overlays}</svg>`;
  document.querySelectorAll('.hs').forEach(r=>r.onclick=()=>investigate(HS.find(h=>h.id===r.dataset.hs)));
}
function isDone(h){
  if(h.phone)return !!S.solved[h.id];
  return stepOf(h.id)>=h.steps.length;
}
function renderNotebook(fresh){
  const el=$('#clues');
  if(!S.clues.length){el.innerHTML='<div class="empty">아직 찾은 단서가 없습니다.</div>';return}
  el.innerHTML=S.clues.map(c=>`<button class="clue-item ${fresh.includes(c)?'new':''}" data-c="${c}"><span class="cat">${CLUES[c].cat}</span>${CLUES[c].title}</button>`).join('');
  el.querySelectorAll('.clue-item').forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;
    modal(`<h2>${CLUES[c].title}</h2>${clueBody(c)}<div class="actions"><button class="btn" onclick="closeM()">닫기</button></div>`);
  });
  renderHud();
}

/* ===================== INVESTIGATE ===================== */
function investigate(h){
  if(S.over)return;
  if(h.puzzle&&!S.solved[h.id]){if(h.phone)openPhoneLock(h);else if(h.dial)openDialLock(h);else openPad(h);return}
  if(h.phone){openPhone();return}
  const i=stepOf(h.id);
  if(i>=h.steps.length){
    // already done: show last text, free
    const st=h.steps[h.steps.length-1];
    if(st.go){S.loc=st.go;renderLocs();renderScene();return}
    const cl=h.steps.flatMap(s=>s.clues);
    modal(`<h2>${h.name||h.label}</h2><div class="body">이미 조사한 곳이다.</div>${cl.map(clueBody).join('')}<div class="actions"><button class="btn" onclick="closeM()">닫기</button></div>`);
    return;
  }
  const st=h.steps[i];
  if(st.req&&!has(st.req)){
    spend(st.lockCost||0);
    modal(`<h2>${h.name||h.label}</h2><div class="body">${st.lockText}</div><div class="actions"><button class="btn" onclick="closeM()">닫기</button></div>`);
    checkTime();return;
  }
  spend(st.cost);
  S.step[h.id]=i+1;
  if(st.go){closeM();S.loc=st.go;renderLocs();renderScene();toast(st.text);checkTime();return}
  const fresh=addClues(st.clues);
  modal(`<h2>${h.name||h.label}</h2><div class="body">${st.text}</div>${st.clues.map(clueBody).join('')}${fresh.length?`<div class="newtag">새 단서 ${fresh.length}개를 수첩에 적었다.</div>`:''}<div class="actions"><button class="btn primary" onclick="closeM()">확인</button></div>`);
  renderScene();checkTime();
}

/* ===================== KEYPAD ===================== */
let pad={h:null,val:''};
function openPad(h){
  pad={h,val:''};
  modal(`<h2>${h.puzzle.title}</h2><div class="body" style="color:var(--dim);font-size:13px">${h.puzzle.prompt}<br>틀릴 때마다 1분이 지나갑니다.</div>
  <div class="pin" id="pin">${'<span></span>'.repeat(h.puzzle.len)}</div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" style="color:var(--gold2)">OK</button></div>
  <div class="actions"><button class="btn" onclick="closeM()">그만두기</button></div>`);
  document.querySelectorAll('.keypad button').forEach(b=>b.onclick=()=>padKey(b.dataset.k));
}
function padKey(k){
  const L=pad.h.puzzle.len;
  if(k==='del')pad.val=pad.val.slice(0,-1);
  else if(k==='ok'){submitPad();return}
  else if(pad.val.length<L)pad.val+=k;
  document.querySelectorAll('#pin span').forEach((s,i)=>s.textContent=pad.val[i]||'');
  if(pad.val.length===L)setTimeout(submitPad,150);
}
function submitPad(){
  const h=pad.h;if(pad.val.length<h.puzzle.len)return;
  if(pad.val===h.puzzle.ans){
    S.solved[h.id]=true;toast('잠금 해제!');
    if(h.phone){renderScene();openPhone();return}
    renderLocs();investigate(h);
  }else{
    spend(1);const p=$('#pin');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
    pad.val='';document.querySelectorAll('#pin span').forEach(s=>s.textContent='');
    if(checkTime())return;
  }
}

/* ===================== DIAL LOCK ===================== */
let dial=[0,0,0];
function openDialLock(h){
  pad={h,val:''};dial=[0,0,0];
  const cols=['#c0392b','#e1b12c','#2e6fb5'];
  modal(`<h2>${h.puzzle.title}</h2>
  <div class="lockwrap" id="lockwrap"><div class="shackle" id="shackle"></div><div class="lbody">
  ${cols.map((c,i)=>`<div class="drow"><span class="ddot" style="background:${c}"></span><div class="dwheel" data-i="${i}" id="dw${i}"></div><div class="darr"><button data-i="${i}" data-d="1">▲</button><button data-i="${i}" data-d="-1">▼</button></div></div>`).join('')}
  </div></div>
  <div class="actions"><button class="btn" onclick="closeM()">그만두기</button><button class="btn primary" id="pull">당겨서 열기</button></div>`);
  drawDial();
  document.querySelectorAll('.darr button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;dial[i]=(dial[i]+ +b.dataset.d+10)%10;drawDial()});
  document.querySelectorAll('.dwheel').forEach(w=>w.addEventListener('wheel',e=>{e.preventDefault();const i=+w.dataset.i;dial[i]=(dial[i]+(e.deltaY<0?1:-1)+10)%10;drawDial()},{passive:false}));

  $('#n3').onclick=()=>{ACC.ev=boxes.filter(x=>x.checked).map(x=>x.value);result()};

function result(){
  S.over=true;
  const total=Object.keys(CLUES).length;
  const okWho=ACC.who==='park';
  const t=+ACC.hh*60+ +ACC.mm, okTime=t>=21*60+40&&t<=21*60+47;
  const good=ACC.ev.filter(c=>KEY_EVIDENCE.includes(c));
  const okEv=okWho&&good.length>=2;
  const pts=(okWho?1:0)+(okTime?1:0)+(okEv?1:0);
  const grade=pts===3?'완전 해결':okWho&&pts===2?'거의 해결':okWho?'범인은 맞혔지만…':'미해결';
  const line=(ok,label,mine,right)=>`<div style="margin:8px 0"><b>${label}</b><br><span class="${ok?'ok':'ng'}">${ok?'✔':'✘'} ${mine}</span>${ok?'':`<br><span style="color:var(--dim)">정답: ${right}</span>`}</div>`;
  const evTxt=ACC.ev.length?ACC.ev.map(c=>`${KEY_EVIDENCE.includes(c)&&okWho?'●':'○'} ${CLUES[c].title}`).join('<br>'):'(고른 단서 없음)';
  const rows=line(okWho,'STEP 1 · 범인',SUSPECTS[ACC.who].name,'박태수')
   +line(okTime,'STEP 2 · 쇼케이스가 열린 시각',`${ACC.hh}:${ACC.mm}`,'21:40 ~ 21:47 사이')
   +`<div style="margin:8px 0"><b>STEP 3 · 지목의 근거</b><br><span class="${okEv?'ok':'ng'}">${okEv?'✔ 근거가 탄탄합니다':'✘ 근거가 부족합니다'}</span><div style="font-size:13px;margin-top:4px">${evTxt}</div><div class="hint">● 박태수를 가리키는 단서 · ○ 직접 관련 없는 단서</div></div>`;
  modal(`<h2>사건 결과</h2><div class="res-score">${grade} · ${pts}/3</div>
  <div style="color:var(--dim);font-size:13px">사용한 시간 ${TOTAL_TIME-S.time}분 · 찾은 단서 ${S.clues.length}/${total}</div>
  ${rows}
  <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--gold2);font-weight:700">사건의 전말 보기</summary>
  <div class="paper">${esc(`범인은 박태수.

일주일 전 단톡방 공지로 전시 날짜를 알게 된 박태수는 이튿날 옆 공방에서 메탈골드 MG-07을 현금으로 샀다(공방 장부). 집에 있던 자기 일반판 미플 20개를 서툴게 칠했고, 단톡방에 “새 취미”라며 칠하던 책상 사진까지 올렸다. 당일 18:12에는 미플이 정말 20개인지 확인했다.

21:41, 3판을 끝낸 그는 서지아가 테이프를 찾으러 창고에 들어간 틈을 노렸다. 정수기에 물을 뜨는 척 계산대 안으로 들어가 서랍 왼쪽 칸의 열쇠를 집었고, 쇼케이스를 열어 바꿔치기한 뒤 다시 잠갔다. 쇼케이스 앱은 21:31부터 와이파이가 끊겨 아무것도 기록하지 못했다. 창고 안의 서지아는 얇은 합판 벽 너머로 ‘띡’ 소리를 들었지만 화장실 문 소리로 착각했다. 화장실 문은 ‘끼이익’ 소리가 난다. 다 마신 종이컵은 쇼케이스 옆 쓰레기통에 버렸다. 21:47에 자리로 돌아와 4판을 시작했다.

열쇠는 22:05 계산할 때 영수증을 받으며 손님 쪽 오른쪽 칸에 슬쩍 돌려놓았다. 늘 안쪽에서 왼쪽 칸에 넣는 서지아라면 그렇게 두지 않는다(서지아 진술). 카페의 일반판은 B테이블의 한 개뿐이고 미플이 그대로였으니(선반·B테이블), 가짜는 밖에서 만들어 온 것이다. 진짜 미플은 백팩에 넣어 나갔다.

범행 시각을 좁히는 법: 쇼케이스 앱은 21:31부터 끊겨 있어 쓸모없다. 대신 서지아가 ‘띡’ 소리를 들은 건 최건우의 테이프를 찾으러 창고에 있을 때다. 최건우가 카페에 있던 시간은 CCTV상 21:40~21:47이고, 박태수의 기록지도 21:41~21:47이 비어 있다.

함정들:
• 서지아: 알바비 갈등과 금박 가루가 있지만, ‘띡’ 소리가 났을 때 창고 안에 있었다(최건우 진술: 지아 씨가 창고에 간 사이). 열쇠도 손님 쪽 오른쪽 칸에 둘 이유가 없다. 금박은 선물 포장지에서 나왔다.
• 윤미래: 거짓말을 했지만 범행이 끝난 뒤인 21:50에 왔다. 21:55에 사진만 찍었다. 글리터는 네일 장식이다.
• 최건우: 물감 전문가지만 그가 쓰는 건 MG-03이다. 가짜는 서툰 붓질에 MG-07이다. 단톡방 멤버가 아니라 전시 날짜를 미리 알 수 없었다.
• 금색 흔적은 함정이다. 서지아의 금박, 윤미래의 글리터, 최건우의 MG-03은 모두 출처가 따로 있다.`)}</div></details>
  <div class="actions"><button class="btn primary" id="again">처음부터 다시</button></div>`);
  $('#again').onclick=()=>{closeM();reset();showIntro()};
}

/* ===================== INTRO ===================== */
function showIntro(){
  modal(`<div class="intro"><h2>퍼니보드 사건 파일<br><span style="font-size:15px;color:var(--dim)">보드게임 카페의 마지막 손님</span></h2>
  <p>보드게임 카페 「퍼니보드」의 사장 한도윤은 《드래곤 바자르》 초판 한정판을 딱 하루 카페에 전시했다. 이 판에만 들어 있는 도금 미플 20개는 시세만 수백만 원이다.</p>
  <p>다음 날 아침, 사장이 미플을 집어 들자 손끝에 금색이 묻어났다. <b>20개 전부 금색 물감을 칠한 가짜였다.</b> 쇼케이스는 잠겨 있었고 부서진 곳도 없었다.</p>
  <p>그날 밤 21:30~22:20 사이 카페에 있었던 사람은 넷. 당신은 사장의 부탁을 받고 카페를 조사한다.</p>
  <div class="actions"><button class="btn primary" id="toHow">게임 방법 보기 →</button></div></div>`);
  $('#toHow').onclick=showHow;
}
function showHow(){
  modal(`<h2>게임 방법</h2>
  <div style="font-size:14px">목표는 하나예요. <b>누가, 언제, 어떻게 바꿔치기했는지</b> 밝히는 것.</div>
  <div class="steps">
   <div class="stp"><div class="n">1</div><div><b class="t">현장 둘러보기</b><span>위쪽 탭으로 장소를 옮기고, 그림 속 물건을 클릭해 조사해요. 찾은 단서는 오른쪽 <b>수사 수첩</b>에 모여요. 눈에 잘 안 띄는 곳도 있어요.</span></div></div>
   <div class="stp"><div class="n">2</div><div><b class="t">잠긴 것 풀기</b><span>휴대폰, 녹화기, 창고는 비밀번호가 있어요. 답의 힌트는 현장 어딘가에 숨어 있어요.</span></div></div>
   <div class="stp"><div class="n">3</div><div><b class="t">심문하기</b><span>위쪽 <b>심문하기</b> 버튼 → 사람 선택 → 진술 듣기. 그다음 수첩의 단서를 보여주면 새로운 이야기를 털어놓기도 해요.</span></div></div>
   <div class="stp"><div class="n">4</div><div><b class="t">범인 지목</b><span>준비되면 <b>범인 지목</b> 버튼. 범인 선택 → 범행 시각 입력 → 근거 단서 제출, 세 단계를 마치면 결과와 사건의 전말이 나와요.</span></div></div>
  </div>
  <div class="timebox"><b>⏱ 조사 시간 80분</b> <span style="color:var(--dim)">(실제 시간이 아니라, 행동할 때마다 줄어드는 게임 속 시간)</span>
   <table><tr><td>물건 하나 조사</td><td>2분</td></tr><tr><td>진술 듣기 · 증거 보여주기</td><td>3분</td></tr><tr><td>비밀번호 틀림</td><td>1분</td></tr><tr><td>장소 이동 · 수첩 다시 보기</td><td>무료</td></tr></table>
   <div style="margin-top:6px;color:var(--dim)">전부 조사할 시간은 없어요. 0분이 되면 바로 범인을 지목해야 해요.</div></div>
  <div class="actions"><button class="btn primary" onclick="closeM()">조사 시작</button></div>`);
}
