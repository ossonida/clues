<!DOCTYPE html>
<html lang="ko" data-note="note04">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note 04 · 깡총이 연습장 | 히든노트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hada0127/hada-type-levelup@v2026.10.21/css/levelup-subset.css">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{
  --desk:#24262b;--pad:#fbf2a6;--pline:#a9c3e0;--margin:rgba(214,69,65,.55);--lh:32px;--ml:56px;--binding:#2f5a45;
  --ink:#1f1c18;--dim:#6b6358;--stamp:#a3312a;--pencil:#3b3b3b;--blue:#2a4fb0;--grid:rgba(96,160,110,.2);--paper:#fbfdf5;
  --hs:clamp(19px,5vw,24px);
  --mono:"Kkakdugi Drafting",monospace;--serif:"LevelUp",serif;--hand:"HEEJOY",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:"Kkakdugi Drafting",system-ui,sans-serif;font-size:15px;line-height:1.6}
@media(max-width:640px){:root{--ml:26px}}
button{font-family:inherit;cursor:pointer;color:inherit}

/* 리갈패드 바탕 (시리즈 공통 틀, 이번엔 초록 제본) */
.app{max-width:900px;min-height:100vh;margin:0 auto;padding:0 22px 56px calc(var(--ml) + 22px);background-color:var(--pad);
  background-image:linear-gradient(90deg,transparent calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 5px),var(--margin) calc(var(--ml) - 4px),transparent calc(var(--ml) - 4px),transparent var(--ml),var(--margin) var(--ml),var(--margin) calc(var(--ml) + 1px),transparent calc(var(--ml) + 1px)),
    repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--pline) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0,0 6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.app::before{content:"";display:block;height:34px;margin:0 -22px 22px calc(-1 * (var(--ml) + 22px));background:linear-gradient(#3f7259,var(--binding) 70%,#1f3d2f);box-shadow:0 3px 0 rgba(0,0,0,.12)}
@media(max-width:640px){.app{padding:0 12px 40px calc(var(--ml) + 12px)}.app::before{margin:0 -12px 18px calc(-1 * (var(--ml) + 12px))}}
body.hasbag .app{padding-bottom:120px}

header.hud{display:flex;align-items:flex-end;gap:10px 18px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--hand);font-size:40px;letter-spacing:-.5px;line-height:1.05}
.brand .t{background:linear-gradient(transparent 60%,rgba(47,90,69,.25) 60% 88%,transparent 88%)}
.brand .back{display:block;font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px}
.brand .back:hover{color:var(--ink)}
.brand small{display:block;font-family:var(--serif);font-size:14px;color:var(--dim);margin-top:4px}
.spacer{flex:1}
.stat{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;flex-direction:column;line-height:1.3;padding:0 4px}
.stat b{color:var(--ink);font-size:20px;border-bottom:1px solid var(--ink);min-width:62px}
.btn{white-space:nowrap;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:7px 13px;font-size:14px;font-weight:700}
.btn:hover{background:var(--ink);color:#fffdf4}
.btn.primary{background:var(--ink);color:#fffdf4}
.btn.primary:hover{background:var(--stamp);border-color:var(--stamp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}

/* 탭 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding-left:14px;position:relative;z-index:1;margin-bottom:-4px}
.tab{border:none;color:#2f4638;padding:7px 14px 9px;font-size:13px;font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.12);opacity:.85;background:#d5e6cf}
.tab:hover{opacity:1}
.tab.on{opacity:1;padding-top:12px;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.tab:disabled{background:#e4e6d8;color:#98a08f;font-weight:400;cursor:not-allowed;opacity:.8}
.tab .ok{color:#2b7a52;margin-left:3px}

/* 모눈 연습장 한 장 */
.sheet{position:relative;max-width:680px;background-color:var(--paper);padding:14px 16px 10px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px;
  box-shadow:0 1px 1px rgba(0,0,0,.12),0 16px 30px -14px rgba(20,40,20,.55)}
.sheet.turn{animation:turn .45s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(26px) rotate(.8deg)}to{opacity:1;transform:none}}
.sheet.leave{animation:leave .6s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(-40px) rotate(-2deg)}}
.sheet .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-family:var(--serif);font-size:12.5px;color:#4f7a5a;border-bottom:2px solid #6aa07a;padding-bottom:4px;margin-bottom:6px}
.sheet .head b{font-family:var(--hand);font-weight:400;font-size:calc(var(--hs) * 1.02);color:var(--pencil);margin-left:4px}
.say{font-family:var(--hand);font-size:var(--hs);line-height:1.28;color:#4a4a4a;margin:0}

/* 낙서 장면 */
.scene{display:block;width:100%;height:auto;margin-top:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.scene.draw{touch-action:none;cursor:crosshair}
.scene text{font-family:"HEEJOY",cursive}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.item .spark{animation:spark 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}}
.fold{animation:fold 2.4s ease-in-out infinite}
@keyframes fold{50%{transform:translate(-3px,-3px)}}
.fold.ready{animation-duration:.8s}
.fold.ready path:nth-child(2){fill:#fff3a0;stroke:#e0b100;stroke-width:3}
.drop{animation:drop 2s linear infinite}
@keyframes drop{from{transform:translateY(-10px);opacity:0}15%{opacity:1}to{transform:translateY(130px);opacity:.2}}
.ink-fade{transition:opacity .7s;opacity:0}
#wall.fade{transition:opacity .9s;opacity:0}
.pop{animation:popin .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}

/* 필통 */
.bag{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.bag .in{pointer-events:auto;display:flex;align-items:center;gap:6px;background:#2f5a45;padding:9px 14px 11px;border-radius:14px 14px 0 0;
  box-shadow:0 -6px 18px rgba(0,0,0,.35);border:2px dashed rgba(232,240,220,.4);border-bottom:none}
.bag .lbl{font-family:var(--hand);font-size:22px;color:#e8f0dc;margin-right:4px}
.slot{width:46px;height:46px;border-radius:7px;border:1.5px dashed rgba(232,240,220,.35);background:transparent;padding:3px;transition:transform .15s}
.slot:disabled{cursor:default}
.slot.has{background:var(--paper);border:1.5px solid var(--paper)}
.slot.on{background:#ffe680;border-color:#c9a04a;transform:translateY(-8px) rotate(-5deg);box-shadow:0 6px 10px rgba(0,0,0,.3)}
.slot svg{width:100%;height:100%;display:block}
.slot.new{animation:pop .5s 4}
.slot.no{animation:wig .4s}
@keyframes pop{50%{transform:scale(1.25) rotate(-5deg)}}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@media(max-width:420px){.bag .lbl{display:none}.slot{width:39px;height:39px;padding:2px}.bag .in{gap:4px;padding:7px 8px 9px}}

.nav{max-width:680px;display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-family:var(--mono);font-size:13px}
.nav button{background:none;border:none;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.nav button:hover{color:var(--ink);border-color:var(--ink)}

/* 표지 */
.cover{max-width:680px;background:#3f6b52;color:#e6eedf;padding:34px 30px 30px;position:relative;box-shadow:0 18px 32px -14px rgba(0,0,0,.6);border-left:14px solid #2a4a38;overflow:hidden}
.cover .label{background:var(--paper);color:var(--ink);padding:14px 18px 12px;max-width:300px;box-shadow:0 2px 4px rgba(0,0,0,.25);border:1px solid #9fbf9f}
.cover .label h2{margin:0;font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:8px}
.cover .label div{font-family:var(--serif);font-size:14px;color:#4f7a5a;margin-top:6px}
.cover .label .who{font-family:var(--hand);font-size:24px;color:var(--pencil);margin-top:2px}
.cover .kc{position:absolute;right:20px;top:16px;width:92px;height:118px;transform:rotate(8deg)}
.cover .story{font-family:var(--serif);font-size:15px;line-height:1.85;margin:24px 0 0;max-width:540px}
.cover .rules{background:var(--paper);color:var(--pencil);font-family:var(--hand);font-size:25px;line-height:1.3;padding:12px 16px;margin-top:16px;max-width:420px;transform:rotate(-.8deg);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.cover .go{margin-top:22px;background:#e6eedf;color:#1f3d2f;border:none;font-weight:800;padding:10px 20px;font-size:15px}
.cover .go:hover{background:#fff}
.proto{font-family:var(--mono);font-size:11.5px;color:#b5c9b8;margin-top:16px}
@media(max-width:480px){.cover{padding:26px 18px 24px}.cover .kc{width:62px;height:80px;right:10px;top:10px}}

/* 결과 */
.result .big{font-family:var(--hand);font-size:42px;line-height:1.1;margin:0 0 10px}
.result .seal{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:3px;padding:4px 14px;transform:rotate(-7deg);margin:6px 0 16px;mix-blend-mode:multiply}
.result dl{font-family:var(--mono);font-size:14px;margin:0;max-width:340px}
.result dl div{display:flex;border-bottom:1px dotted #b9cdb9;padding:5px 0}
.result dt{width:110px;color:var(--dim)}.result dd{margin:0}
.result p{font-family:var(--serif);font-size:14.5px;line-height:1.8;max-width:560px}
.result .note{font-family:var(--hand);font-size:26px;line-height:1.35;color:var(--pencil)}
.result .later{font-family:var(--mono);font-size:12.5px;color:var(--dim);border-top:1px dashed #9fbf9f;padding-top:10px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* 모달 · 힌트 */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,24,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--paper);max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px 20px;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.modal h2{font-family:var(--serif);font-weight:800;margin:0 0 8px;font-size:20px}
.modal .sub{font-size:13px;color:var(--dim);margin-bottom:14px}
.posts{display:flex;flex-direction:column;gap:12px}
.post{background:#fff3a0;padding:10px 14px;font-family:var(--hand);font-size:22px;line-height:1.3;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.post:nth-child(2){background:#ffd6e0;transform:rotate(.6deg)}.post:nth-child(3){background:#cfeaff;transform:rotate(-.6deg)}
.post small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim)}
.post.closed{background:#e9eedb;color:var(--dim);font-family:inherit;font-size:14px;border:none;text-align:left}
.modal .actions{display:flex;justify-content:flex-end;margin-top:16px}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fffdf4;padding:10px 18px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<!-- 낙서 모양. 크레용으로 칠한 것처럼 색을 넣고, 테두리는 연필 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
    <!-- 크레용 결: 칠한 면에 잔구멍을 내고 가장자리를 흔든다 -->

      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="2" result="n"/>

  <symbol id="d-ladder" viewBox="0 0 60 60"><g stroke="#8a5124" stroke-width="4.5" stroke-linecap="round"><path d="M20 4 L15 56 M40 4 L45 56"/><path d="M19 15 H41 M18 27 H42 M17 39 H43 M16 50 H44" stroke="#b9773d"/></g></symbol>
  <symbol id="d-key" viewBox="0 0 60 60"><g stroke="#3b3b3b" stroke-width="2.4" stroke-linejoin="round"><circle cx="17" cy="30" r="11" fill="#f2c14e"/><circle cx="17" cy="30" r="4" fill="#fbfdf5"/><path d="M27 26 H54 V34 H50 V40 H45 V34 H41 V38 H36 V34 H27 Z" fill="#f2c14e"/></g></symbol>
  <symbol id="d-star" viewBox="0 0 60 60"><path d="M30 4 L37 22 L56 23 L41 35 L47 54 L30 43 L13 54 L19 35 L4 23 L23 22 Z" fill="#ffd84a" stroke="#3b3b3b" stroke-width="2.6" stroke-linejoin="round"/><circle cx="25" cy="30" r="1.8" fill="#3b3b3b"/><circle cx="35" cy="30" r="1.8" fill="#3b3b3b"/><path d="M27 36 Q30 39 33 36" stroke="#3b3b3b" stroke-width="1.8" fill="none"/></symbol>
  <!-- 깡총이. 발바닥 가운데가 (34, 88) -->
  <symbol id="d-kc" viewBox="0 0 68 90"><g stroke="#3b3b3b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 36 C15 14 17 2 24 3 C31 4 32 20 30 35" fill="#fff"/><path d="M25.5 31 C21 18 22 9 24.5 9.5 C27 10 27.5 20 27.5 30" fill="#f6a5b8" stroke="none"/>

    <circle cx="51" cy="75" r="5" fill="#fff"/>

<div class="app">
  <header class="hud">
    <div class="brand">
      <a class="back" href="../../">← 사건 대장 / NOTE 04</a>
      <span class="t">깡총이 연습장</span>
      <small>노트 방탈출 · 시제품 (1~3장)</small>
    </div>
    <div class="spacer"></div>
    <div class="stat"><span>걸린 시간</span><b id="time">0:00</b></div>
    <div class="stat"><span>힌트</span><b id="hintCount">0</b></div>
    <button class="btn" id="btnHint">힌트</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="page"></main>
</div>
<div class="bag" id="bag"></div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>

<script>
const $=s=>document.querySelector(s);
const SAVE_KEY='hn.note04.v3';
const PLAY_LAST=3;   // 시제품은 3장까지
const SW=600,SH=360,GY=300;   // 장면 크기, 땅 높이

const ORDER=['pencil','eraser','lens','umbrella','ladder','key','star'];
const NAME={pencil:'몽당연필',eraser:'지우개',lens:'돋보기',umbrella:'우산',ladder:'사다리',key:'열쇠',star:'별'};
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xac00;return w+(c>=0&&c<11172&&c%28?a:b)};

// ── 상태 ──────────────────────────────
// w[장]: 깡총이 위치(seg, x)와 그 장에서 바뀐 것
const fresh=()=>({v:'cover',open:0,clear:{},hints:{},ms:0,started:false,done:false,bag:{},hold:null,
  w:{1:{bridge:false},2:{ladder:false,erased:false,rub:[]},3:{big:{},umb:false,placed:false}}});
let S=fresh();
try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d)S={...fresh(),...d,w:{...fresh().w,...(d.w||{})}}}catch{}
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch{}};
addEventListener('pagehide',save);
let NEW=null,busy=false;
const pageNo=()=>S.v[0]==='p'?+S.v.slice(1):0;
const W=()=>S.w[pageNo()];

const fmt=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const hintTotal=()=>Object.values(S.hints).reduce((a,b)=>a+b,0);
const frontier=()=>Math.min(Math.max(S.open,1),PLAY_LAST);
function hintPage(){const p=pageNo();return p&&p<=S.open&&!S.clear[p]&&LV[p]?p:frontier()}
function renderStats(){$('#time').textContent=fmt(S.ms);$('#hintCount').textContent=hintTotal();$('#btnHint').disabled=!S.started||S.done}
let tick=0;
setInterval(()=>{if(S.started&&!S.done&&!document.hidden){S.ms+=1000;renderStats();if(++tick%5===0)save()}},1000);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3000)}

// ── 장 설계 ──────────────────────────────

function canView(v){
  if(v==='cover')return true;
  if(!S.started)return false;
  if(v==='end')return S.done;
  const n=+v.slice(1);return n>=1&&n<=Math.min(S.open,PLAY_LAST);
}
function renderTabs(){
  const tabs=[['cover','표지'],...[1,2,3,4,5,6].map(n=>['p'+n,n+'장']),...(S.done?[['end','끝']]:[])];
  $('#tabs').innerHTML=tabs.map(([v,label])=>{
    const locked=!canView(v),n=v[0]==='p'?+v.slice(1):0;
    return `<button class="tab${S.v===v?' on':''}" data-v="${v}"${locked?' disabled':''}${n>PLAY_LAST?' title="준비 중"':''}>${locked?'🔒 ':''}${label}${n&&S.clear[n]?'<span class="ok">✓</span>':''}</button>`}).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function renderBag(){
  const show=S.started&&S.v[0]==='p';
  document.body.classList.toggle('hasbag',show);
  if(!show){$('#bag').innerHTML='';return}
  $('#bag').innerHTML=`<div class="in" role="toolbar" aria-label="필통"><span class="lbl">필통</span>${ORDER.map(id=>{
    const has=!!S.bag[id];
    return `<button class="slot${has?' has':''}${S.hold===id?' on':''}${NEW===id?' new':''}" data-b="${id}"${has?` aria-pressed="${S.hold===id}" aria-label="${NAME[id]}" title="${NAME[id]}"`:' disabled aria-label="빈 칸"'}>${has?`<svg viewBox="0 0 60 60"><use href="#d-${id}"/></svg>`:''}</button>`}).join('')}</div>`;
  NEW=null;
  $('#bag').querySelectorAll('.slot.has').forEach(b=>b.onclick=()=>{S.hold=S.hold===b.dataset.b?null:b.dataset.b;save();renderBag();syncHold()});
}

  const L=LV[p];
  return `<article class="sheet turn" id="sheet">
    <div class="head"><span>날짜<b>${L.date}</b></span><span>4학년 3반<b>윤서하</b></span></div>
    ${L.say.map(s=>`<p class="say">${s}</p>`).join('')}
    ${scene(p)}
  </article>
  <div class="nav"><button data-go="${p===1?'cover':'p'+(p-1)}">← 앞 장</button>${S.clear[p]&&p<PLAY_LAST?`<button data-go="p${p+1}">다음 장 →</button>`:''}</div>`;
}

// ── 넘기기 ──────────────────────────────
// 길이 다 열리면 귀퉁이가 반짝인다. 누르면 깡총이가 종이 밖으로 뛰어나가고 다음 장이 열린다
function turnPage(){
  const p=pageNo(),w=W(),L=LV[p];
  if(!L.clear(w)){toast(L.why(w));return}
  S.clear[p]=true;S.open=Math.max(S.open,p+1);if(p>=PLAY_LAST)S.done=true;save();
  busy=true;toast(p>=PLAY_LAST?'깡총이가 귀퉁이를 넘어간다!':`${p+1}장으로 깡총!`);
  const kc=$('#kc');if(kc)kc.animate([{transform:'translate(0,0)'},{transform:'translate(40px,-40px)'},{transform:'translate(160px,0)',opacity:0}],{duration:700,easing:'ease-in',fill:'forwards',composite:'add'});
  setTimeout(()=>{$('#sheet').classList.add('leave')},500);
  setTimeout(()=>{busy=false;go(p>=PLAY_LAST?'end':'p'+(p+1))},1100);
}
// 상태가 바뀌어 깡총이 자리가 달라졌으면 다시 그리면서 톡 튀어나오게
function update(msg){
  const p=pageNo(),before=String(LV[p].pos(W()));
  return ()=>{MOVED=String(LV[p].pos(W()))!==before;save();render(false);if(msg)toast(msg)};
}

// ── 낙서 쓰기 ──────────────────────────────
function take(id){
  const p=pageNo(),w=W(),no=LV[p].reach(id,w);
  if(no){toast(no);return}
  S.bag[id]=true;NEW=id;save();render(false);toast(`${josa(NAME[id],'을','를')} 필통에 넣었다.`);
}
const toSvg=(svg,e)=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())};
function syncHold(){
  const svg=$('#scene');if(!svg)return;
  svg.classList.toggle('draw',['pencil','eraser','lens'].includes(S.hold));
  if(S.hold!=='lens')$('#lens').style.display='none';
}
function showLens(pt){
  const {x,y}=pt;$('#lens').style.display='';
  ['lcC','lbg','lrim'].forEach(id=>{const c=document.getElementById(id);c.setAttribute('cx',x);c.setAttribute('cy',y)});
  $('#lz').setAttribute('transform',`translate(${x} ${y}) scale(${LZ}) translate(${-x} ${-y})`);
  const k=LR*.72;$('#lh').setAttribute('d',`M${x+k} ${y+k} L${x+k+30} ${y+k+30}`);
}
// 연필: 점선을 따라 그은 만큼 칸을 채운다. 80%가 차면 그 낙서가 진짜가 된다
let stroke=null,cover={};
function inkPath(pts){return `<path d="M${pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L')}" stroke="#4a4a4a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>`}
function endStroke(){
  const p=pageNo(),w=W(),pts=stroke;stroke=null;
  const g=$('#ink').lastElementChild;
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(len<14){g&&g.remove();return false}
  for(const gd of LV[p].guides(w)){
    const c=cover[gd.id]||(cover[gd.id]=new Set());
    gd.pts.forEach((q,i)=>{if(pts.some(s=>Math.hypot(s[0]-q[0],s[1]-q[1])<20))c.add(i)});
    if(c.size/gd.pts.length>=.8){const u=update(gd.msg);gd.done(w);delete cover[gd.id];u();return true}
  }
  if(g){g.classList.add('ink-fade');setTimeout(()=>g.remove(),800)}
  return true;
}
// 지우개: 2장 볼펜 벽만 지워진다. 칸의 70%를 지우면 벽이 사라진다
let rubbing=false;
const inWall=pt=>pt.x>=WALL.x-8&&pt.x<=WALL.x+WALL.w+8&&pt.y>=WALL.y-8&&pt.y<=WALL.y+WALL.h;
function rub(pt){
  const w=W();if(pageNo()!==2||w.erased||!inWall(pt))return;
  const x=Math.round(pt.x),y=Math.round(pt.y),last=w.rub[w.rub.length-1];
  if(last&&Math.hypot(last[0]-x,last[1]-y)<10)return;
  w.rub.push([x,y]);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',24);c.setAttribute('fill','#000');$('#emH').appendChild(c);
  let all=0,got=0;
  for(let gx=WALL.x+10;gx<WALL.x+WALL.w;gx+=20)for(let gy=WALL.y+10;gy<WALL.y+WALL.h;gy+=20){all++;if(w.rub.some(([a,b])=>(a-gx)**2+(b-gy)**2<24*24))got++}
  if(got/all>=.7){const u=update('볼펜 벽이 다 지워졌다. 밑에 파란 글씨가 있었다. 깡총이가 지나갔다.');w.erased=true;rubbing=false;save();$('#wall').classList.add('fade');setTimeout(u,900)}
  else if(w.rub.length%6===0)save();
}
function onTap(pt,el){
  if(busy)return;
  const p=pageNo(),w=W(),h=S.hold;
  // 돋보기: 작은 낙서를 누르면 크게 튀어나와 땅에 떨어진다
  if(h==='lens'&&p===3){
    const k=Object.keys(BIG).find(k=>!w.big[k]&&Math.hypot(BIG[k].t[0]-pt.x,BIG[k].t[1]-pt.y)<16);
    if(k){w.big[k]=true;NEW_DROP=k;save();render(false);toast(`작은 ${josa(NAME[k],'이','가')} 커다랗게 튀어나왔다!`);return}
  }
  // 우산: 비구름 밑에 펼쳐 둔다
  if(h==='umbrella'&&p===3&&!w.umb&&pt.x>=180&&pt.x<=350&&pt.y>=100&&pt.y<=GY+10){
    const u=update('비구름 밑에 우산을 펼쳤다. 깡총이가 우산 밑으로 쏙.');w.umb=true;delete S.bag.umbrella;S.hold=null;u();return}
  if(h==='ladder'&&p===3&&pt.x>=404&&pt.x<=506&&pt.y>=150&&pt.y<=GY+6){
    if(!w.umb){toast(RAIN);return}
    const u=update('책 더미에 사다리를 세웠다. 깡총이가 꼭대기에 올라갔다.');w.placed=true;delete S.bag.ladder;S.hold=null;u();return}
  if(el&&el.closest('[data-exit]')){turnPage();return}
  const it=el&&el.closest('[data-item]');
  if(it){take(it.dataset.item);return}
  if(el&&el.closest('[data-kc]')){toast(LV[p].clear(w)?'깡총이가 귀퉁이 쪽을 쳐다본다.':'나다. 깡총이. '+LV[p].why(w));return}
  if(h&&h!=='key'&&h!=='star'){wiggleHeld();return}
  if(p===3&&pt.y<112&&pt.x<400)toast('작은 낙서가 잔뜩. 너무 작아서 콩알만 하다.');
}
function bindScene(){
  const svg=$('#scene');if(!svg)return;
  syncHold();
  let down=null;
  svg.onpointerdown=e=>{
    const pt=toSvg(svg,e);down={pt,el:e.target};
    if(S.hold==='pencil'){stroke=[[pt.x,pt.y]];$('#ink').insertAdjacentHTML('beforeend',inkPath(stroke));try{svg.setPointerCapture(e.pointerId)}catch{}}
    else if(S.hold==='eraser'&&pageNo()===2&&!W().erased&&inWall(pt)){rubbing=true;try{svg.setPointerCapture(e.pointerId)}catch{}rub(pt)}
    if(S.hold==='lens')showLens(pt);
  };
  svg.onpointermove=e=>{
    const pt=toSvg(svg,e);
    if(S.hold==='lens')showLens(pt);
    if(stroke){const l=stroke[stroke.length-1];if(Math.hypot(l[0]-pt.x,l[1]-pt.y)>3){stroke.push([pt.x,pt.y]);$('#ink').lastElementChild.outerHTML=inkPath(stroke)}}
    if(rubbing)rub(pt);
  };
  svg.onpointerup=e=>{
    const d=down;down=null;
    if(stroke){if(endStroke())return}
    if(rubbing){rubbing=false;return}
    if(d)onTap(toSvg(svg,e),d.el);
  };
  svg.onpointercancel=()=>{stroke=null;rubbing=false;down=null};
  svg.onpointerleave=()=>{if(S.hold==='lens')$('#lens').style.display='none'};
}

// ── 표지 · 끝 ──────────────────────────────
function pageCover(){
  return `<section class="cover turn">
    <svg class="kc" viewBox="0 0 68 90" aria-hidden="true"><use href="#d-kc" filter="url(#rough)"/></svg>
    <div class="label"><h2>수학 연습장</h2><div>4학년 3반</div><div class="who">윤서하</div></div>
    <p class="story">나는 깡총이. 2009년 3월, 이 연습장 첫 장 귀퉁이에 연필로 그려졌다. 나를 그린 아이는 그날 이렇게 적었다.</p>
    <div class="rules">깡총이 집은 다음에 그려 줄게. 문도.</div>
    <p class="story">그 “다음”은 오지 않았다. 연습장 맨 뒷장 어딘가에 그리다 만 집이 있다는 것만 안다. 종이 귀퉁이까지 가면 다음 장으로 넘어갈 수 있다. 그런데 이 연습장, 낙서투성이다.</p>
    <button class="btn go" id="start">${S.started?'이어서 펼치기':'연습장 펼치기'}</button>
    <div class="proto">시제품 · 1~3장 · 진행 상황은 이 브라우저에 저장돼요</div>
  </section>`;
}
function pageEnd(){
  const h=hintTotal(),ansHints=Object.values(S.hints).filter(n=>n>=3).length;
  const grade=h===0?'짝꿍':ansHints===0?'낙서 친구':'전학생';
  return `<article class="sheet turn result">
    <p class="big">토요일, 미끄럼틀 밑.</p>
    <div class="seal">${grade}</div>
    <dl>
      <div><dt>걸린 시간</dt><dd>${fmt(S.ms)}</dd></div>
      <div><dt>힌트</dt><dd>${h}장</dd></div>
    </dl>
    <p>지호 숨은그림찾기 맨 아래, 돋보기로나 보이는 글씨가 있었다. 그날 서하는 연습장 맨 아래에 작게 적었다.</p>
    <p class="note">토요일에 미끄럼틀 밑에서 지호 만나기로 함! 깡총이도 데려가야지.</p>
    <p>깡총이 필통에는 아직 쓸 데를 모르는 낙서가 남아 있다. 열쇠와 별.</p>
    <div class="later">시제품은 여기까지예요. 4~6장(찢어진 사다리타기, 지호의 보물상자, 깡총이 집)은 만드는 중이에요.</div>
    <div class="row"><button class="btn" id="again">처음부터 다시</button><a class="btn primary" href="../../" style="text-decoration:none">사건 대장으로</a></div>
  </article>`;
}

// ── 렌더 ──────────────────────────────
function render(anim){
  if(!canView(S.v))S.v='cover';
  renderTabs();renderStats();
  const pg=$('#page'),v=S.v;
  pg.innerHTML=v==='cover'?pageCover():v==='end'?pageEnd():pageLevel(+v.slice(1));
  if(!anim)pg.querySelectorAll('.turn').forEach(e=>e.classList.remove('turn'));
  pg.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(v==='cover')$('#start').onclick=()=>{if(!S.started){S.started=true;S.open=1}go('p'+frontier())};
  if(v==='end')$('#again').onclick=()=>{if(confirm('처음부터 다시 할까요? 지금 기록은 지워져요.')){S=fresh();save();render(true)}};
  renderBag();bindScene();
}

// ── 힌트 ──────────────────────────────
function openHint(){
  const p=hintPage(),L=LV[p];if(!L||S.done)return;
  const got=S.hints[p]||0;
  $('#modal').innerHTML=`<h2>${p}장 힌트</h2><div class="sub">지금 있는 장의 힌트예요. 한 장씩 떼어 볼 수 있고, 세 번째 장엔 푸는 법이 다 있어요.</div>
    <div class="posts">${L.hints.map((h,i)=>i<got?`<div class="post"><small>포스트잇 ${i+1}</small>${h}</div>`
      :i===got?`<button class="post closed" id="peel">포스트잇 ${i+1} 떼어 보기${i===2?' (푸는 법)':''}</button>`
      :`<div class="post closed">포스트잇 ${i+1}</div>`).join('')}</div>
    <div class="actions"><button class="btn" id="mclose">닫기</button></div>`;
  $('#mbg').classList.add('on');
  $('#mclose').onclick=closeM;
  const pe=$('#peel');if(pe)pe.onclick=()=>{S.hints[p]=got+1;save();renderStats();openHint()};
}
function closeM(){$('#mbg').classList.remove('on')}
$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(S.hold){S.hold=null;save();renderBag();syncHold()}}});
$('#btnHint').onclick=openHint;

render(true);
</script>
</body>
</html>
