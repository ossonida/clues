<!-- 기록 공유 미리보기 바탕. api/og.js가 기록 카드 빈칸에 숫자를 찍는다. 칸 위치를 바꾸면 api/og.js SLOT도 같이 -->
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.c{position:relative;width:1200px;height:630px;background:repeating-linear-gradient(#fbf3b8 0 47px,#9fb6d8 47px 49px);background-color:#fbf3b8;font-family:'Kkakdugi Drafting',monospace;color:#2a2422}
.c:before{content:"";position:absolute;left:70px;top:0;bottom:0;width:3px;background:#d9534f;box-shadow:6px 0 0 #d9534f}

.l{position:absolute;left:104px;top:64px;width:500px;display:flex;flex-direction:column;align-items:flex-start}

.s{margin:40px 0 0 14px;border:10px solid #a3312a;color:#a3312a;font-family:LevelUp,serif;font-size:var(--ss,62px);padding:8px 26px;transform:rotate(-6deg);background:rgba(255,253,244,.7);white-space:nowrap}

.p hr{position:absolute;left:36px;right:36px;margin:0;border:0;border-top:3px dotted #b8ad95}

</style></head><body><div class="c">
<div class="l"><div class="k" id="k"></div><h1 id="h"></h1><div class="s" id="s"></div></div>
<div class="p"><h2>MY RECORD</h2><div class="lb" style="left:36px;top:76px">걸린 시간</div><hr style="top:300px"><div class="lb" style="left:36px;top:322px">힌트</div><div class="lb" style="left:286px;top:322px" id="wl">틀린 암호</div><div class="v"></div></div>
<div class="f">히든노트 · 브라우저에서 바로 하는 추리·방탈출</div></div>
<script>const q=new URLSearchParams(location.search);k.textContent=q.get('k');h.textContent=q.get('h');s.textContent=q.get('s');
const hl=[...q.get('h')].length,sl=[...q.get('s')].length;
document.documentElement.style.setProperty('--hs',hl>7?'72px':'92px');document.documentElement.style.setProperty('--ss',sl>7?'50px':sl>5?'60px':'72px')</script></body></html>
